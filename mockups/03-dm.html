<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Your DMs, in review</title>
<style>
:root {
  --bg: #000;
  --surface: #121212;
  --raised: #1c1c1c;
  --bubble: #262626;
  --line: #2b2b2b;
  --text: #f5f5f5;
  --text-soft: #c4c4c4;
  --text-mute: #8e8e8e;
  --dm: linear-gradient(165deg, #405DE6 0%, #833AB4 55%, #C13584 100%);
  --ring: linear-gradient(45deg, #FFDC80 0%, #FCAF45 14%, #F77737 28%, #F56040 40%, #FD1D1D 50%, #E1306C 62%, #C13584 75%, #833AB4 88%, #5851DB 100%);
  --hot: linear-gradient(135deg, #FCAF45 0%, #F56040 30%, #E1306C 62%, #833AB4 100%);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #050505;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
}
body::before, body::after {
  content: "";
  position: fixed;
  width: 620px;
  height: 620px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .22;
  pointer-events: none;
}
body::before { background: #5851DB; left: -160px; top: -180px; }
body::after { background: #E1306C; right: -180px; bottom: -220px; opacity: .18; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid #5851DB; outline-offset: 2px; }
svg { display: block; }

/* desktop side columns */
.aside { width: 270px; position: relative; z-index: 1; display: none; }
@media (min-width: 1120px) { .aside { display: block; } }
.brand { font-size: 46px; line-height: 1.02; font-weight: 800; letter-spacing: -.035em; }
.brand em { font-style: normal; background: var(--hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { margin-top: 18px; color: var(--text-soft); font-size: 16px; line-height: 1.45; }
.keys { margin-top: 30px; display: flex; align-items: center; gap: 8px; color: var(--text-mute); font-size: 13px; }
.keys kbd { font: inherit; min-width: 28px; height: 28px; display: inline-grid; place-items: center; border: 1px solid #333; border-radius: 8px; background: var(--surface); color: var(--text); }
.made { margin-top: 14px; color: var(--text-mute); font-size: 12px; letter-spacing: .02em; }
.index { list-style: none; padding: 0; display: grid; gap: 2px; }
.index button { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; color: var(--text-mute); font-size: 15px; transition: background .2s, color .2s; }
.index button:hover { background: rgba(255,255,255,.05); color: var(--text); }
.index .num { font-variant-numeric: tabular-nums; font-size: 12px; width: 16px; }
.index .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex: none; }
.index [aria-current="true"] { color: var(--text); font-weight: 600; }
.index [aria-current="true"] .dot { background: var(--hot); box-shadow: 0 0 12px rgba(225,48,108,.7); }

/* stage */
.stage {
  position: relative;
  z-index: 1;
  flex: none;
  width: min(430px, 100vw);
  height: min(calc(100vh - 48px), 880px);
  height: min(calc(100dvh - 48px), 880px);
  background: var(--bg);
  border: 1px solid #2a2a2a;
  border-radius: 40px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 120px rgba(0,0,0,.8), 0 0 0 8px #0d0d0d, 0 0 0 9px #222;
}
@media (max-width: 500px) {
  body { gap: 0; }
  .stage { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
}

/* chat header */
.head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 10px 8px; padding-top: max(16px, env(safe-area-inset-top)); background: rgba(0,0,0,.92); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.icon-btn svg { width: 24px; height: 24px; }
.contact { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.contact-text { min-width: 0; }
.contact-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.contact-sub { font-size: 12px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.counter { font-size: 12px; font-weight: 600; color: var(--text-soft); background: var(--surface); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; flex: none; }
.progress { display: flex; gap: 3px; padding: 0 14px 10px; border-bottom: 1px solid #1a1a1a; }
.progress span { flex: 1; height: 2px; border-radius: 2px; background: #2e2e2e; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--ring); transition: width .5s var(--ease); }
.progress .done i, .progress .now i { width: 100%; }

/* avatars */
.ring { position: relative; flex: none; border-radius: 50%; padding: 2px; background: var(--ring); width: var(--size, 40px); height: var(--size, 40px); }
.ring-in { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; background: linear-gradient(160deg, #2c2c2c, #161616); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--size, 40px) * .34); letter-spacing: .02em; color: #fff; }
.ring.active::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: #1cd14f; border: 2.5px solid #000; }

/* chat scroll */
.chat { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 22px; scrollbar-width: none; display: flex; flex-direction: column; gap: 6px; }
.chat::-webkit-scrollbar { display: none; }
.chat.enter { animation: chat-in .45s var(--ease); }
@keyframes chat-in { from { opacity: 0; transform: translateX(var(--dir, 18px)); } to { opacity: 1; transform: none; } }
.stamp { align-self: center; font-size: 11.5px; color: var(--text-mute); padding: 6px 0 8px; font-weight: 500; }
.item { display: none; }
.item.in { display: flex; animation: pop .42s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.intro, .typing { align-items: flex-end; gap: 8px; }
.bot-av { width: 28px; height: 28px; border-radius: 50%; background: var(--ring); display: grid; place-items: center; flex: none; visibility: hidden; }
.bot-av svg { width: 15px; height: 15px; }
.intro.last .bot-av, .typing .bot-av { visibility: visible; }
.bubble { max-width: 78%; padding: 9px 14px; border-radius: 20px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
.bubble.them { background: var(--bubble); color: var(--text); }
.bubble.me { background: var(--dm); color: #fff; }
.intro .bubble { max-width: 82%; }
.intro.lead .bubble { font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; padding: 12px 16px; border-bottom-left-radius: 6px; }
.intro.last .bubble { border-top-left-radius: 6px; }
.typing { display: none; }
.typing.on { display: flex; }
.dots { background: var(--bubble); border-radius: 20px; padding: 13px 14px; display: flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e8e; animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

/* attachment card */
.attach { flex-direction: column; gap: 8px; margin-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.card-top { padding: 16px 16px 4px; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.who-name { font-size: 14px; font-weight: 600; }
.who-kind { font-size: 12px; color: var(--text-mute); margin-top: 1px; }
.title { font-size: 25px; line-height: 1.12; font-weight: 800; letter-spacing: -.028em; text-wrap: balance; }
.body { margin-top: 10px; font-size: 15px; line-height: 1.45; color: var(--text-soft); }
.sections { padding: 12px 16px 16px; display: grid; gap: 12px; }
.sections:empty { display: none; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { flex: 1 1 130px; background: var(--raised); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 11px; color: var(--text-mute); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.stat b { display: block; margin-top: 3px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

/* recap: the shareable poster */
.card[data-kind="recap"] .card-top { padding: 18px 18px 20px; color: #fff; background: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.34)), linear-gradient(150deg, #405DE6 0%, #833AB4 32%, #C13584 58%, #E1306C 80%, #F56040 100%); }
.card[data-kind="recap"] .ring { background: rgba(255,255,255,.9); }
.card[data-kind="recap"] .who-kind { color: rgba(255,255,255,.8); }
.card[data-kind="recap"] .title { font-size: 40px; letter-spacing: -.04em; }
.card[data-kind="recap"] .body { color: rgba(255,255,255,.94); font-size: 16px; }
.card[data-kind="recap"] .sections { padding-top: 14px; }

/* link preview */
.preview { display: block; text-decoration: none; color: inherit; border-radius: 18px; overflow: hidden; background: var(--bubble); border: 1px solid #343434; transition: transform .2s var(--ease); }
a.preview:hover { transform: translateY(-2px); }
.preview-banner { background: var(--hot); padding: 12px 14px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #fff; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 100% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } }
.preview-main { padding: 12px 14px 4px; }
.preview-meta { font-size: 12px; color: var(--text-mute); font-weight: 600; }
.preview-text { margin-top: 5px; font-size: 15.5px; line-height: 1.35; font-weight: 600; }
.preview-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 12px; font-size: 12.5px; color: var(--text-mute); }
.preview-open { display: inline-flex; align-items: center; gap: 5px; color: #fff; font-weight: 700; }
.preview-open svg { width: 13px; height: 13px; }

/* evidence mini threads */
.thread { background: #000; border: 1px solid #222; border-radius: 18px; padding: 0 10px 12px; }
.thread-head { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px solid #1c1c1c; margin-bottom: 4px; }
.thread-name { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-from { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 4px 8px; border-radius: 999px; color: #fff; background: var(--hot); white-space: nowrap; }
.thread-plain { font-size: 11px; color: var(--text-mute); }
.sep { text-align: center; font-size: 11px; color: var(--text-mute); padding: 12px 0 8px; font-weight: 500; }
.row { display: flex; align-items: flex-end; gap: 6px; margin-top: 2px; }
.row.gap { margin-top: 8px; }
.row.me { justify-content: flex-end; }
.row .mini { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(160deg, #3a3a3a, #202020); font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none; visibility: hidden; }
.row.tail .mini { visibility: visible; }
.wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; }
.row.me .wrap { align-items: flex-end; }
.row .bubble { max-width: 100%; font-size: 14.5px; padding: 8px 13px; }
.row.them.joined-up .bubble { border-top-left-radius: 6px; }
.row.them.joined-down .bubble { border-bottom-left-radius: 6px; }
.row.me.joined-up .bubble { border-top-right-radius: 6px; }
.row.me.joined-down .bubble { border-bottom-right-radius: 6px; }
.row.key { margin-top: 10px; margin-bottom: 6px; }
.row.key .bubble { border: 1.5px solid transparent; box-shadow: 0 0 22px rgba(225,48,108,.42), 0 0 4px rgba(252,175,69,.5); }
.row.key .bubble.them { background: linear-gradient(#262626, #262626) padding-box, var(--hot) border-box; }
.row.key .bubble.me { background: var(--dm) padding-box, linear-gradient(135deg, #FFDC80, #F77737 45%, #E1306C) border-box; }
.this-one { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin: 0 6px 4px; background: linear-gradient(90deg, #FCAF45, #E1306C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.this-one svg { width: 9px; height: 9px; color: #FCAF45; }

/* quick reply pill */
.replies { display: flex; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #fff; border: 1.5px solid transparent; background: linear-gradient(#000, #000) padding-box, var(--dm) border-box; transition: transform .15s var(--ease), background .2s; }
.pill:hover { background: linear-gradient(#15122a, #15122a) padding-box, var(--dm) border-box; }
.pill:active { transform: scale(.96); }
.pill svg { width: 16px; height: 16px; }

/* inbox list */
.inbox { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.inbox-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 16px 8px; }
.inbox-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.025em; }
.inbox-head span { font-size: 13px; color: var(--text-mute); }
.person + .person { border-top: 1px solid #1d1d1d; }
.person-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left; animation: pop .45s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
.person-row:hover { background: rgba(255,255,255,.035); }
.person-mid { flex: 1; min-width: 0; }
.person-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.person-preview { font-size: 13.5px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.rank { flex: none; min-width: 34px; text-align: center; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--dm); color: #fff; font-variant-numeric: tabular-nums; }
.person:first-child .rank { background: var(--hot); }
.chev { flex: none; color: var(--text-mute); transition: transform .3s var(--ease); }
.chev svg { width: 16px; height: 16px; }
[aria-expanded="true"] .chev { transform: rotate(90deg); }
.person-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.person-more > div { overflow: hidden; min-height: 0; }
[aria-expanded="true"] + .person-more { grid-template-rows: 1fr; }
.person-more .body { margin: 0; padding: 2px 16px 0 82px; font-size: 14.5px; }
.person-more .sections { padding: 12px 16px 16px 82px; }

/* outro + composer */
.outro { flex-direction: column; align-items: center; gap: 12px; padding: 22px 0 4px; color: var(--text-mute); font-size: 12.5px; text-align: center; }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: #000; border-top: 1px solid #161616; }
.composer-field { flex: 1; min-width: 0; height: 44px; border-radius: 999px; border: 1px solid #303030; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px; font-size: 15px; color: var(--text-mute); text-align: left; }
.composer-field:hover { border-color: #444; }
.composer-field strong { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer-field .go { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: var(--dm); display: grid; place-items: center; flex: none; color: #fff; }
.composer-field .go svg { width: 18px; height: 18px; }
.composer .icon-btn { width: 44px; height: 44px; background: var(--surface); border: 1px solid #303030; }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 88%; overflow-y: auto; background: #1a1a1a; border-radius: 22px 22px 0 0; padding: 8px 16px max(20px, env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .42s var(--ease); box-shadow: 0 -20px 60px rgba(0,0,0,.6); scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.sheet:focus { outline: none; }
.stage.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.stage.sheet-open .sheet { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: #4a4a4a; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.sheet-sub { font-size: 12.5px; color: var(--text-mute); margin-top: 1px; }
.sheet-head .icon-btn { margin-left: auto; background: #2c2c2c; width: 32px; height: 32px; }
.sheet-head .icon-btn svg { width: 16px; height: 16px; }
.draft-box { border: 1px solid #3a3a3a; background: #000; border-radius: 24px; padding: 12px 8px 8px 16px; display: flex; flex-direction: column; gap: 8px; }
.draft-box:focus-within { border-color: #5851DB; }
.draft-box textarea { width: 100%; min-height: 84px; max-height: 240px; resize: none; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; line-height: 1.4; padding-right: 8px; }
.draft-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.draft-hint { font-size: 12px; color: var(--text-mute); }
.copy { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px 0 14px; border-radius: 999px; background: var(--dm); color: #fff; font-weight: 700; font-size: 14.5px; transition: transform .15s var(--ease); }
.copy:active { transform: scale(.95); }
.copy svg { width: 16px; height: 16px; }
.sheet-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.regen { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; color: var(--text-mute); font-size: 14px; font-weight: 600; cursor: not-allowed; }
.regen svg { width: 15px; height: 15px; }
.regen em { font-style: normal; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: #2c2c2c; color: var(--text-soft); padding: 2px 6px; border-radius: 6px; }
.sheet-note { font-size: 12px; color: var(--text-mute); line-height: 1.35; }
.poster { border-radius: 22px; padding: 20px 18px 18px; color: #fff; background: linear-gradient(rgba(0,0,0,.06), rgba(0,0,0,.36)), linear-gradient(150deg, #405DE6 0%, #833AB4 30%, #C13584 56%, #E1306C 78%, #F77737 100%); }
.poster-kicker { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.poster h3 { font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -.04em; margin-top: 8px; }
.poster p { margin-top: 10px; font-size: 15px; line-height: 1.4; }
.poster .stats { margin-top: 16px; }
.poster .stat { background: rgba(0,0,0,.26); backdrop-filter: blur(6px); }
.poster .stat span { color: rgba(255,255,255,.78); }
.poster-made { margin-top: 14px; font-size: 11px; opacity: .8; letter-spacing: .04em; }
.share-row { display: flex; justify-content: flex-end; margin-top: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<aside class="aside" aria-hidden="false">
  <h1 class="brand">Your DMs, <em>in review</em></h1>
  <p class="brand-sub">Seven things your chats have been trying to tell you, delivered the way everything else reaches you: as a message.</p>
  <div class="keys"><kbd>&larr;</kbd><kbd>&rarr;</kbd><span>or tap the sides to move</span></div>
  <p class="made">made for Instagram DMs</p>
</aside>

<main class="stage" id="stage">
  <header class="head">
    <button class="icon-btn" id="back" aria-label="Previous page"></button>
    <div class="contact">
      <div class="ring active" id="contactAvatar" style="--size:38px"><div class="ring-in"></div></div>
      <div class="contact-text">
        <div class="contact-name" id="contactName"></div>
        <div class="contact-sub" id="contactSub"></div>
      </div>
    </div>
    <div class="counter" id="counter"></div>
  </header>
  <div class="progress" id="progress" role="progressbar" aria-valuemin="1" aria-valuemax="7"></div>
  <section class="chat" id="chat" aria-live="polite"></section>
  <footer class="composer">
    <button class="icon-btn" id="prev" aria-label="Previous page"></button>

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...kids.flat().filter(kid => kid !== null && kid !== undefined && kid !== false));
  return node;
}

function cardsFor(kind) {
  const cards = DATA.cards.filter(card => card.kind === kind);
  const isRanked = cards.length > 0 && cards.every(card => card.rank !== null && card.rank !== undefined);
  if (isRanked) return cards.sort((a, b) => a.rank - b.rank);
  return cards.sort((a, b) => b.score - a.score).slice(0, maxCardsPerPage);
}

    const url = new URL(raw);
    return /^https?:$/.test(url.protocol) ? url : null;
  } catch (error) {
    return null;
  }
}

function contextBlock(context) {
  if (!context) return null;
  const url = safeUrl(context.url);
  const when = context.date ? dayFormat.format(new Date(context.date + 'T00:00:00Z')) : null;
  const meta = [context.source, when].filter(Boolean).join(' · ');
  const inner = [
    h('div', { class: 'preview-banner' }, h('i', { class: 'pulse' }), 'Why now'),
    h('div', { class: 'preview-main' }, meta && h('div', { class: 'preview-meta' }, meta), h('div', { class: 'preview-text' }, context.text)),
    h('div', { class: 'preview-foot' }, h('span', {}, url ? url.hostname.replace(/^www\./, '') : ''),
      url && h('span', { class: 'preview-open' }, 'Open', h('span', { html: ICON.open })))
  ];
  if (!url) return h('div', { class: 'preview' }, inner);
  return h('a', { class: 'preview', href: url.href, target: '_blank', rel: 'noopener noreferrer' }, inner);
}

function threadSegments(evidence) {
  const segments = [];
  for (const message of evidence) {
    const last = segments[segments.length - 1];
    if (last && last.name === message.threadName) last.messages.push(message);
    else segments.push({ name: message.threadName, messages: [message] });
  }
  return segments;
}

function isFarApart(earlier, later) {
  const a = new Date(earlier.timestamp), b = new Date(later.timestamp);
  return dayFormat.format(a) !== dayFormat.format(b) || Math.abs(b - a) >= farApartMs;
}

function messageRow(message, isJoinedUp, isJoinedDown) {
  const side = message.isFromOwner ? 'me' : 'them';
  const classes = ['row', side, message.isKey && 'key', isJoinedUp ? 'joined-up' : 'gap', isJoinedDown ? 'joined-down' : 'tail'];
  return h('div', { class: classes.filter(Boolean).join(' '), 'aria-label': `${message.sender}: ${message.text}` },
    !message.isFromOwner && h('div', { class: 'mini', 'aria-hidden': 'true' }, initials(message.sender)),
    h('div', { class: 'wrap' },
      message.isKey && h('span', { class: 'this-one' }, h('span', { html: ICON.star }), 'this one'),
      h('div', { class: 'bubble ' + side }, message.text)));
}

function threadBlock(segment, friendName) {
  const isOtherChat = segment.name !== friendName;
  const thread = h('div', { class: 'thread' },
    h('div', { class: 'thread-head' }, avatar(segment.name, 26), h('div', { class: 'thread-name' }, segment.name),
      isOtherChat ? h('span', { class: 'thread-from' }, 'your chat with ' + firstName(segment.name)) : h('span', { class: 'thread-plain' }, 'this chat')));
  segment.messages.forEach((message, i) => {
    const prev = segment.messages[i - 1], next = segment.messages[i + 1];
    const hasBreak = !prev || isFarApart(prev, message);
    const hasBreakAfter = !next || isFarApart(message, next);
    if (hasBreak) thread.append(h('div', { class: 'sep' }, stampFormat.format(new Date(message.timestamp))));
    const isJoinedUp = !hasBreak && prev.isFromOwner === message.isFromOwner && !prev.isKey && !message.isKey;
    const isJoinedDown = !hasBreakAfter && next.isFromOwner === message.isFromOwner && !next.isKey && !message.isKey;
    thread.append(messageRow(message, isJoinedUp, isJoinedDown));
  });
  return thread;
}

function evidenceBlocks(card) {
  if (!card.evidence || !card.evidence.length) return [];
  return threadSegments(card.evidence).map(segment => threadBlock(segment, card.friend.name));
}

function actionPill(card) {
  if (!card.action) return null;
  return h('div', { class: 'replies' },
    h('button', { class: 'pill', type: 'button', onclick: () => openSheet(card) }, card.action.label, h('span', { html: ICON.reply })));
}

function sections(card) {
  return h('div', { class: 'sections' }, statsBlock(card.stats), contextBlock(card.context), evidenceBlocks(card));
}

function cardItem(card) {
  const article = h('article', { class: 'card', 'data-kind': card.kind },
    h('div', { class: 'card-top' },
      h('div', { class: 'who' }, avatar(card.friend.name, 40),
        h('div', {}, h('div', { class: 'who-name' }, card.friend.name), h('div', { class: 'who-kind' }, kindLabel(card.kind)))),
      h('h2', { class: 'title' }, card.title),
      card.body && h('p', { class: 'body' }, card.body)),
    sections(card));
  return h('div', { class: 'item attach' }, article, actionPill(card));
}

/* ---------- inbox (ranked cards) ---------- */

function personRow(card, i) {
  const toggle = event => {
    const button = event.currentTarget;
    button.setAttribute('aria-expanded', button.getAttribute('aria-expanded') !== 'true');
  };
  return h('div', { class: 'person' },
    h('button', { class: 'person-row', type: 'button', style: `--i:${i}`, 'aria-expanded': i === 0 ? 'true' : 'false', onclick: toggle },
      avatar(card.friend.name, 56),
      h('div', { class: 'person-mid' }, h('div', { class: 'person-name' }, card.title), h('div', { class: 'person-preview' }, card.body)),
      h('span', { class: 'rank' }, '#' + card.rank),
      h('span', { class: 'chev', html: ICON.chevron })),
    h('div', { class: 'person-more' }, h('div', {}, h('p', { class: 'body' }, card.body), sections(card), actionPill(card))));
}

function inboxItem(cards) {
  return h('div', { class: 'item attach' },
    h('div', { class: 'inbox' },
      h('div', { class: 'inbox-head' }, h('h2', {}, 'Messages'), h('span', {}, `Top ${cards.length}, by closeness`)),
      cards.map(personRow)));
}

/* ---------- page assembly ---------- */

function introItem(text, i, all) {
  const classes = ['item', 'intro', i === 0 && 'lead', i === all.length - 1 && 'last'];
  return h('div', { class: classes.filter(Boolean).join(' ') }, h('div', { class: 'bot-av', html: ICON.spark }), h('div', { class: 'bubble them' }, text));
}

function outroItem() {
  const isLast = pageIndex === PAGES.length - 1;
  const hint = isLast ? 'That is everything. Go text someone.' : `Tap the right side for ${PAGES[pageIndex + 1].name}`;
  return h('div', { class: 'item outro' }, h('span', {}, hint),
    isLast && h('button', { class: 'pill', type: 'button', onclick: () => go(0) }, 'Start over', h('span', { html: ICON.regen })),
    isLast && h('span', {}, 'made for Instagram DMs'));
}

function pageItems(page) {
  const cards = cardsFor(page.kind);
  const isRanked = cards.length > 0 && cards[0].rank !== null && cards[0].rank !== undefined;
  const attachments = isRanked ? [inboxItem(cards)] : cards.map(cardItem);
  return [...page.intro.map(introItem), ...attachments, outroItem()];
}

function reveal(items) {
  const typing = h('div', { class: 'typing' }, h('div', { class: 'bot-av', html: ICON.spark }), h('div', { class: 'dots' }, h('i'), h('i'), h('i')));
  chat.append(typing);
  if (isReducedMotion) { items.forEach(item => item.classList.add('in')); return; }
  let at = 120;
  items.forEach(item => {
    const isAttachment = item.classList.contains('attach');
    timers.push(setTimeout(() => { item.before(typing); typing.classList.add('on'); }, at));
    at += isAttachment ? 380 : 260;
    timers.push(setTimeout(() => { typing.classList.remove('on'); item.classList.add('in'); }, at));
    at += 90;
  });
}

function renderChrome(page) {
  $('contactAvatar').firstElementChild.textContent = initials(page.name);
  $('contactName').textContent = page.name;
  $('contactSub').textContent = page.sub;
  $('counter').textContent = `${pageIndex + 1} / ${PAGES.length}`;
  $('progress').setAttribute('aria-valuenow', pageIndex + 1);
  [...$('progress').children].forEach((bar, i) => { bar.className = i < pageIndex ? 'done' : i === pageIndex ? 'now' : ''; });
  [...$('index').querySelectorAll('button')].forEach((button, i) => button.setAttribute('aria-current', i === pageIndex));
  $('back').disabled = $('prev').disabled = pageIndex === 0;
  const isLast = pageIndex === PAGES.length - 1;
  const upNext = isLast ? PAGES[0].name : PAGES[pageIndex + 1].name;
  $('next').replaceChildren(h('span', {}, isLast ? 'Replay' : 'Up next'), h('strong', {}, upNext), h('span', { class: 'go', html: ICON.arrow }));
}

function render(direction) {
  timers.forEach(clearTimeout);
  timers = [];
  const page = PAGES[pageIndex];
  renderChrome(page);
  const items = pageItems(page);
  chat.replaceChildren(h('div', { class: 'stamp' }, 'Today · ' + dayFormat.format(new Date(DATA.generatedAt))), ...items);
  chat.scrollTop = 0;
  chat.style.setProperty('--dir', direction < 0 ? '-18px' : '18px');
  chat.classList.remove('enter');
  void chat.offsetWidth;
  chat.classList.add('enter');
  reveal(items);
}

function go(index) {
  const target = Math.max(0, Math.min(PAGES.length - 1, index));
  if (target === pageIndex) return;
  const direction = target - pageIndex;
  pageIndex = target;
  closeSheet();
  history.replaceState(null, '', '#' + (pageIndex + 1));
  render(direction);
}

/* ---------- action sheet ---------- */

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    button.replaceChildren(h('span', { html: ICON.check }), 'Copied');
  } catch (error) {
    console.warn('Clipboard write failed', error);
    button.replaceChildren('Select and copy');
  }
  setTimeout(() => button.replaceChildren(h('span', { html: ICON.copy }), 'Copy'), 1800);
}

function draftBody(card) {
  const textarea = h('textarea', { 'aria-label': 'Message draft', spellcheck: 'false' });
  textarea.value = card.action.draft;
  const fit = () => { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; };
  textarea.addEventListener('input', fit);
  requestAnimationFrame(fit);
  const copy = h('button', { class: 'copy', type: 'button', onclick: event => copyText(textarea.value, event.currentTarget) }, h('span', { html: ICON.copy }), 'Copy');
  return [
    h('div', { class: 'draft-box' }, textarea, h('div', { class: 'draft-actions' }, h('span', { class: 'draft-hint' }, 'Edit it until it sounds like you'), copy)),
    h('div', { class: 'sheet-foot' },
      h('button', { class: 'regen', type: 'button', disabled: '', 'aria-disabled': 'true' }, h('span', { html: ICON.regen }), 'Regenerate', h('em', {}, 'soon')),
      h('span', { class: 'sheet-note' }, 'Copy it, then paste it into your chat with ' + firstName(card.friend.name) + '.'))
  ];
}

function shareBody(card) {
  const lines = [card.title, card.body, '', ...(card.stats || []).map(stat => `${stat.label}: ${stat.value}`)];
  const copy = h('button', { class: 'copy', type: 'button', onclick: event => copyText(lines.join('\n').trim(), event.currentTarget) }, h('span', { html: ICON.copy }), 'Copy');
  return [
    h('div', { class: 'poster' }, h('div', { class: 'poster-kicker' }, 'Your DMs, in review'), h('h3', {}, card.title),
      card.body && h('p', {}, card.body), statsBlock(card.stats), h('div', { class: 'poster-made' }, 'made for Instagram DMs')),
    h('div', { class: 'share-row' }, copy)
  ];
}

function openSheet(card) {
  const hasDraft = card.action.draft !== null && card.action.draft !== undefined;
  sheet.replaceChildren(
    h('div', { class: 'grabber' }),
    h('div', { class: 'sheet-head' }, avatar(card.friend.name, 40),
      h('div', {}, h('div', { class: 'sheet-title' }, card.action.label), h('div', { class: 'sheet-sub' }, (hasDraft ? 'To ' : 'About ') + card.friend.name)),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', html: ICON.close, onclick: closeSheet })),
    ...(hasDraft ? draftBody(card) : shareBody(card)));
  sheet.scrollTop = 0;
  stage.classList.add('sheet-open');
  sheet.focus({ preventScroll: true });
}

function closeSheet() {
  stage.classList.remove('sheet-open');
}

/* ---------- wiring ---------- */

function onStageClick(event) {
  if (event.target.closest('button, a, textarea, input, .sheet')) return;
  if (event.target.closest('.scrim')) { closeSheet(); return; }
  const box = stage.getBoundingClientRect();
  go(pageIndex + ((event.clientX - box.left) < box.width * 0.35 ? -1 : 1));
}

function onKey(event) {
  if (stage.classList.contains('sheet-open')) {
    if (event.key === 'Escape') closeSheet();
    return;
  }
  if (event.target.closest('textarea, input')) return;
  if (event.key === 'ArrowRight') go(pageIndex + 1);
  if (event.key === 'ArrowLeft') go(pageIndex - 1);
}

function readHash() {
  const match = location.hash.match(/^#(\d+)(\/sheet)?$/);
  if (!match) return { index: 0, hasSheet: false };
  return { index: Math.max(0, Math.min(PAGES.length - 1, Number(match[1]) - 1)), hasSheet: Boolean(match[2]) };
}

function init() {
  $('back').innerHTML = $('prev').innerHTML = ICON.back;
  $('progress').append(...PAGES.map(() => h('span', {}, h('i'))));
  $('index').append(...PAGES.map((page, i) => h('li', {},
    h('button', { type: 'button', onclick: () => go(i) }, h('span', { class: 'dot' }), h('span', { class: 'num' }, String(i + 1)), page.name))));
  $('back').addEventListener('click', () => go(pageIndex - 1));
  $('prev').addEventListener('click', () => go(pageIndex - 1));
  $('next').addEventListener('click', () => go(pageIndex === PAGES.length - 1 ? 0 : pageIndex + 1));
  stage.addEventListener('click', onStageClick);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => go(readHash().index));
  const start = readHash();
  pageIndex = start.index;
  render(1);
  const firstAction = cardsFor(PAGES[pageIndex].kind).find(card => card.action);
  if (start.hasSheet && firstAction) openSheet(firstAction);
}

init();
</script>
</body>
</html>
