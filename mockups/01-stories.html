<style>
:root{
  --display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ring:linear-gradient(45deg,#FFDC80,#FCAF45 20%,#F56040 40%,#E1306C 60%,#833AB4 80%,#5851DB);
  --plum:#2a0b3a;
  --c1:#5851DB;--c3:#C13584;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--body);color:#fff;background:#0b0612;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:28px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* desktop backdrop */
.glow{position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(140px);opacity:.38;z-index:-1;transition:background-color .8s}
.glow.a{left:-20vw;top:-25vw;background:var(--c1)}
.glow.b{right:-22vw;bottom:-28vw;background:var(--c3)}
.aside{position:fixed;bottom:32px;font-size:13px;color:rgba(255,255,255,.55);line-height:1.5}
.aside.l{left:40px}
.aside.r{right:40px;text-align:right}
.aside b{display:block;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;letter-spacing:-.02em}
kbd{display:inline-block;min-width:24px;padding:2px 6px;border:1px solid rgba(255,255,255,.3);border-radius:7px;font:600 12px var(--body);text-align:center}
.outer-nav{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;transition:background .2s,opacity .2s}
.outer-nav:hover{background:rgba(255,255,255,.18)}
.outer-nav:disabled{opacity:.25;cursor:default}
.outer-nav svg{width:22px;height:22px}

/* stage */
.stage{
  position:relative;height:min(100dvh - 48px,880px);aspect-ratio:9/16;max-width:430px;flex:none;
  border-radius:38px;overflow:hidden;isolation:isolate;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);
  display:flex;flex-direction:column;
}
.bg{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .7s ease;overflow:hidden}
.bg.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,0,40,.34),transparent 22%,transparent 70%,rgba(20,0,40,.22))}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.75;animation:drift 16s ease-in-out infinite alternate}
.blob:nth-child(1){width:70%;aspect-ratio:1;left:-25%;top:12%}
.blob:nth-child(2){width:80%;aspect-ratio:1;right:-35%;top:38%;animation-duration:21s;animation-direction:alternate-reverse}
.blob:nth-child(3){width:60%;aspect-ratio:1;left:5%;bottom:-18%;animation-duration:25s}
@keyframes drift{to{transform:translate(8%,-6%) scale(1.12)}}

.bars{display:flex;gap:4px;padding:14px 14px 0}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.bar.done i{width:100%}
.bar.now i{width:100%;animation:fill .7s cubic-bezier(.2,.7,.2,1)}
@keyframes fill{from{width:0}}

.head{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.head .who{flex:1;min-width:0;line-height:1.2}
.head .who strong{display:block;font-size:14px;font-weight:700}
.head .who span{font-size:12px;opacity:.8}
.head .count{font:600 12px var(--body);opacity:.85;font-variant-numeric:tabular-nums}

.avatar{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;padding:calc(var(--s)*.055);background:var(--ring);display:grid}
.avatar>span{border-radius:50%;border:calc(var(--s)*.05) solid #fff;display:grid;place-items:center;font:700 calc(var(--s)*.34)/1 var(--body);letter-spacing:.02em;color:#fff}
.avatar svg{width:52%;height:52%}
.avatar.seen{background:rgba(255,255,255,.4)}

.pages{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;visibility:hidden}
.page.active{visibility:visible}
.scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.page.active .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}

.hero{padding:10px 4px 20px}
.hero .no{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h1{font:800 clamp(40px,12.4cqw,54px)/.94 var(--display);letter-spacing:-.035em;margin:10px 0 12px;text-wrap:balance;text-shadow:0 2px 30px rgba(60,0,40,.25)}
.hero p{font-size:15.5px;line-height:1.4;opacity:.92;max-width:30ch;font-weight:500}
.pages{container-type:inline-size}

.tray{display:flex;gap:14px;padding:0 4px 18px;overflow-x:auto;scrollbar-width:none}
.tray button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;opacity:.8;transition:opacity .2s,transform .2s}
.tray button.current{opacity:1;transform:translateY(-2px)}
.tray .avatar{--s:52px}

.cards{display:flex;flex-direction:column;gap:12px}
.card{
  border-radius:28px;border:1px solid rgba(255,255,255,.28);
  background:linear-gradient(140deg,rgba(255,255,255,.24),rgba(255,255,255,.07)),rgba(96,10,56,var(--tint,.2));
  -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 18px 40px rgba(30,0,40,.18),inset 0 1px 0 rgba(255,255,255,.35);
  scroll-margin-top:8px;
}
.card-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px 16px 16px}
.card-head .txt{flex:1;min-width:0}
.card-head .friend{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.card-head h2{font:800 20px/1.12 var(--display);letter-spacing:-.02em;text-wrap:balance}
.card-head .teaser{font-size:13.5px;opacity:.85;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.open .teaser{display:none}
.card.open .card-head h2{font-size:24px}
.chev{width:30px;height:30px;flex:none;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;transition:transform .3s}
.chev svg{width:16px;height:16px}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;padding:0 16px 16px}
.card.open .card-body{display:block;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.card-body>*+*{margin-top:14px}
.card-body .body{font-size:15px;line-height:1.48;color:rgba(255,255,255,.96)}

.stats{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0}
.stats li{display:flex;gap:6px;align-items:baseline;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);font-size:12.5px}
.stats .l{opacity:.82}
.stats .v{font-weight:700}

/* ranked (top five) */
.card.ranked .card-head{align-items:center;padding-bottom:10px}
.rank{font:800 60px/.8 var(--display);letter-spacing:-.06em;width:44px;flex:none;text-align:center;opacity:.95}
.card.ranked:first-child .rank{font-size:76px;width:50px;background:linear-gradient(180deg,#fff 30%,#FFDC80);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.ranked .avatar{--s:50px}
.card.ranked:first-child .avatar{--s:60px}
.card.ranked:first-child h2{font-size:26px}
.card.ranked .card-body .body{font-size:13.5px;opacity:.9}
.card.ranked .card-body>*+*{margin-top:10px}

/* why now */
.why{display:block;color:inherit;text-decoration:none;position:relative;border-radius:22px;padding:14px 16px;background:linear-gradient(135deg,rgba(255,220,128,.95),rgba(252,175,69,.95));color:var(--plum);box-shadow:0 10px 30px rgba(252,175,69,.35);transition:transform .2s}
.why:hover{transform:translateY(-2px)}
.why .tag{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.why .tag i{width:8px;height:8px;border-radius:50%;background:#E1306C;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,48,108,.6)}100%{box-shadow:0 0 0 10px rgba(225,48,108,0)}}
.why p{font:600 15.5px/1.35 var(--body);margin:8px 0 10px}
.why .src{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.why .src svg{width:14px;height:14px;margin-left:auto}
.why .src u{text-underline-offset:3px}

/* chat */
.chat{background:rgba(24,4,40,.34);border-radius:22px;padding:14px 10px;display:flex;flex-direction:column}
.sep{align-self:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin:14px 0 8px}
.sep:first-child{margin-top:0}
.from{font-size:11px;font-weight:700;margin:10px 30px 4px;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.2)}
.from.me{align-self:flex-end;margin-right:4px}
.row{display:flex;align-items:flex-end;gap:6px;margin-top:3px}
.row.gap{margin-top:10px}
.row.me{justify-content:flex-end}
.slot{width:24px;flex:none}
.slot .avatar{--s:24px;padding:0;background:none}
.slot .avatar>span{border:0}
.bubble{max-width:80%;padding:9px 14px;border-radius:20px;font-size:14.5px;line-height:1.36;background:rgba(255,255,255,.2);overflow-wrap:anywhere}
.row.me .bubble{background:linear-gradient(135deg,#5851DB,#833AB4 55%,#C13584);border:1px solid rgba(255,255,255,.22)}
.bubble.key{background:#fff;color:var(--plum);font-weight:600;box-shadow:0 0 0 3px rgba(255,220,128,.6),0 10px 24px rgba(20,0,30,.28)}
.row.me .bubble.key{background:linear-gradient(135deg,#FFE9A8,#FCAF45);border:0}
.row:has(.key){margin-top:9px;margin-bottom:6px}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:999px;background:#fff;color:var(--plum);font:700 16px var(--body);box-shadow:0 12px 30px rgba(30,0,40,.35);transition:transform .15s}
.cta:hover{transform:translateY(-1px) scale(1.01)}
.cta:active{transform:scale(.98)}
.cta svg{width:18px;height:18px}

/* recap styling */
.k-recap.open .card-head h2{font-size:34px;letter-spacing:-.035em}
.k-recap .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k-recap .stats li{flex-direction:column-reverse;gap:2px;border-radius:18px;padding:12px 14px;font-size:12px;align-items:flex-start}
.k-recap .stats .v{font:800 21px/1.1 var(--display);letter-spacing:-.02em}
.k-recap .stats li:first-child{grid-column:1/-1}
.k-recap .stats li:first-child .v{font-size:44px;letter-spacing:-.04em}

.finale{text-align:center;padding:26px 8px 6px}
.finale p{font:800 22px/1.1 var(--display);letter-spacing:-.02em}
.finale small{display:block;margin-top:6px;font-size:12.5px;opacity:.85}
.ghost{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);font-weight:700;font-size:14px}
.ghost svg{width:16px;height:16px}

.foot{display:flex;align-items:center;justify-content:space-between;padding:6px 8px calc(8px + env(safe-area-inset-bottom));font-size:11.5px;font-weight:500;color:rgba(255,255,255,.85)}
.foot button{display:flex;align-items:center;gap:2px;padding:8px 10px;border-radius:999px;font-weight:700;font-size:12.5px}
.foot button:disabled{opacity:.35;cursor:default}
.foot svg{width:16px;height:16px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,0,30,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;overflow-y:auto;background:#fff;color:#1c1024;border-radius:30px 30px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.stage.sheet-open .scrim{opacity:1;pointer-events:auto}
.stage.sheet-open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:#d9d2df;margin:0 auto 14px}
.sheet-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-top .t{flex:1;min-width:0}
.sheet-top .t small{display:block;font-size:12px;color:#7a6c85;font-weight:600}
.sheet-top .t strong{font:800 21px/1.1 var(--display);letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:50%;background:#f1ecf4;display:grid;place-items:center;color:#1c1024}
.x svg{width:18px;height:18px}
.sheet textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid #e6dfeb;border-radius:22px;padding:14px 16px;font:500 16px/1.45 var(--body);color:#1c1024;background:#faf7fc}
.sheet textarea:focus{outline:none;border-color:#C13584;box-shadow:0 0 0 4px rgba(193,53,132,.14)}
.hint{font-size:12px;color:#7a6c85;margin:8px 4px 14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:999px;font-weight:700;font-size:15px}
.btns svg{width:17px;height:17px}
.primary{background:linear-gradient(90deg,#833AB4,#E1306C 55%,#F77737);color:#fff}
.inert{background:#f1ecf4;color:#9a8ea3;cursor:not-allowed}
.inert em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#e3dbe8}
.poster{border-radius:26px;padding:22px 20px;color:#fff;background:linear-gradient(150deg,#5851DB,#833AB4 25%,#E1306C 60%,#F77737 85%,#FCAF45);margin-bottom:14px}
.poster .duo{display:flex;margin-bottom:16px}
.poster .duo .avatar{--s:54px}
.poster .duo .avatar+.avatar{margin-left:-14px}
.poster h3{font:800 38px/.95 var(--display);letter-spacing:-.035em}
.poster p{font-size:14px;line-height:1.45;margin:10px 0 16px}
.poster .stats li{background:rgba(255,255,255,.2)}
.poster .mark{margin-top:16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

@media (max-width:760px){.aside,.outer-nav,.glow{display:none}}
@media (max-width:500px){
  .stage{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border-radius:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const discs = [['#405DE6','#833AB4'],['#C13584','#F56040'],['#833AB4','#E1306C'],['#F56040','#FCAF45'],['#5851DB','#C13584']];
const dayFormat = new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'});
const timeFormat = new Intl.DateTimeFormat('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit'});
const separatorGapMs = 4*60*60*1000;

const stage = document.getElementById('stage');
const sheet = document.getElementById('sheet');
let current = 0;

function el(tag, className, text){
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function icon(name){
  const holder = el('span');
  holder.innerHTML = ICONS[name];
  return holder.firstChild;
}
function initials(name){
  return name.trim().split(/\s+/).map(word => word[0]).slice(0,2).join('').toUpperCase();
}
function avatar(name){
  const hash = [...name].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
  const [from, to] = discs[hash % discs.length];
  const node = el('div','avatar');
  const disc = el('span', null, initials(name));
  disc.style.background = `linear-gradient(135deg,${from},${to})`;
  node.append(disc);
  return node;
}
function cardsFor(kind){
  const cards = DATA.cards.filter(card => card.kind === kind);
  const isRanked = cards.length > 0 && cards.every(card => card.rank != null);
  if (isRanked) return cards.sort((a, b) => a.rank - b.rank);
  return cards.sort((a, b) => b.score - a.score).slice(0, 4);
}

function statList(stats){
  const list = el('ul','stats');
  stats.forEach(stat => {
    const item = el('li');
    item.append(el('span','l',stat.label), el('span','v',stat.value));
    list.append(item);
  });
  return list;
}
function whyNow(context){
  const link = el('a','why');
  link.href = context.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  const tag = el('div','tag');
  tag.append(el('i'), el('span',null,'Why now'));
  const source = el('div','src');
  const when = dayFormat.format(new Date(context.date + 'T00:00:00Z'));
  source.append(el('u',null,context.source), el('span',null,'· ' + when), icon('out'));
  link.append(tag, el('p',null,context.text), source);
  return link;
}

function needsSeparator(previous, message){
  if (!previous) return true;
  const before = new Date(previous.timestamp), after = new Date(message.timestamp);
  return dayFormat.format(before) !== dayFormat.format(after) || after - before >= separatorGapMs;
}
function bubbleRow(message, isGroupStart, isGroupEnd){
  const row = el('div','row' + (message.isFromOwner ? ' me' : '') + (isGroupStart ? ' gap' : ''));
  if (!message.isFromOwner) {
    const slot = el('div','slot');
    if (isGroupEnd) slot.append(avatar(message.sender));
    row.append(slot);
  }
  row.append(el('div','bubble' + (message.isKey ? ' key' : ''), message.text));
  return row;
}
function chat(card){
  const panel = el('div','chat');
  const messages = card.evidence;
  const hasOtherThread = messages.some(message => message.threadName !== card.friend.name);
  messages.forEach((message, i) => {
    const previous = messages[i-1], next = messages[i+1];
    const isSeparated = needsSeparator(previous, message);
    const date = new Date(message.timestamp);
    if (isSeparated) panel.append(el('div','sep',`${dayFormat.format(date)} · ${timeFormat.format(date)}`));
    if (hasOtherThread) panel.append(el('div','from' + (message.isFromOwner ? ' me' : ''), 'From your chat with ' + message.threadName));
    const isGroupStart = isSeparated || previous.sender !== message.sender;
    const isGroupEnd = !next || next.sender !== message.sender || needsSeparator(message, next);
    panel.append(bubbleRow(message, isGroupStart, isGroupEnd));
  });
  return panel;
}

function cardHead(card, isCollapsible){
  const head = el(isCollapsible ? 'button' : 'div','card-head');
  if (card.rank != null) head.append(el('div','rank',String(card.rank)));
  head.append(avatar(card.friend.name));
  const text = el('div','txt');
  if (card.title !== card.friend.name) text.append(el('div','friend',card.friend.name));
  text.append(el('h2',null,card.title));
  if (isCollapsible) text.append(el('div','teaser',card.body));
  head.append(text);
  if (!isCollapsible) return head;
  const chevron = el('span','chev');
  chevron.append(icon('down'));
  head.append(chevron);
  head.addEventListener('click', () => toggleCard(head.parentElement));
  return head;
}
function cardBody(card){
  const body = el('div','card-body');
  if (card.body) body.append(el('p','body',card.body));
  if (card.stats.length) body.append(statList(card.stats));
  if (card.context) body.append(whyNow(card.context));
  if (card.evidence.length) body.append(chat(card));
  if (!card.action) return body;
  const wrap = el('div','cta-wrap');
  const button = el('button','cta');
  button.append(el('span',null,card.action.label), icon('plane'));
  button.addEventListener('click', () => openSheet(card));
  wrap.append(button);
  body.append(wrap);
  return body;
}
function renderCard(card, isCollapsible, isOpen){
  const node = el('article','card rise k-' + card.kind.replace(/[^\w-]/g,''));
  node.dataset.id = card.id;
  node.classList.toggle('ranked', card.rank != null);
  node.append(cardHead(card, isCollapsible), cardBody(card));
  setOpen(node, isOpen);
  return node;
}

function setOpen(node, isOpen){
  node.classList.toggle('open', isOpen);
  const head = node.querySelector('button.card-head');
  if (head) head.setAttribute('aria-expanded', String(isOpen));
  const page = node.closest('.page');
  if (!page) return;
  page.querySelectorAll('.tray button').forEach(button => {
    if (button.dataset.id !== node.dataset.id) return;
    button.classList.toggle('current', isOpen);
    button.querySelector('.avatar').classList.toggle('seen', !isOpen);
  });
}
function toggleCard(node, shouldForceOpen){
  const willOpen = shouldForceOpen || !node.classList.contains('open');
  node.parentElement.querySelectorAll('.card.open').forEach(other => setOpen(other, false));
  setOpen(node, willOpen);
  if (willOpen) node.scrollIntoView({block:'start', behavior:'smooth'});
}

function tray(cards){
  const row = el('div','tray rise');
  cards.forEach(card => {
    const button = el('button');
    button.dataset.id = card.id;
    button.append(avatar(card.friend.name), el('span',null,card.friend.name.split(' ')[0]));
    button.addEventListener('click', () => {
      const node = row.parentElement.querySelector(`.card[data-id="${card.id}"]`);
      toggleCard(node, true);
    });
    row.append(button);
  });
  return row;
}
function hero(page, index){
  const block = el('div','hero');
  block.append(
    el('div','no rise', String(index+1).padStart(2,'0') + ' · ' + page.name),
    el('h1','rise',page.headline),
    el('p','rise',page.kicker)
  );
  return block;
}
function finale(){
  const block = el('div','finale rise');
  const again = el('button','ghost');
  again.append(icon('redo'), el('span',null,'Watch it again'));
  again.addEventListener('click', () => go(0));
  block.append(el('p',null,'See you in the DMs.'), el('small',null,'Your DMs, in review · made for Instagram DMs'), again);
  return block;
}
function renderPage(page, index){
  const section = el('section','page');
  section.style.setProperty('--tint', page.tint);
  const scroll = el('div','scroll');
  const cards = cardsFor(page.kind);
  const isStack = cards.length > 1 && cards.every(card => card.rank == null);
  const list = el('div','cards');
  scroll.append(hero(page, index));
  if (isStack) scroll.append(tray(cards));
  scroll.append(list);
  section.append(scroll);
  cards.forEach((card, i) => list.append(renderCard(card, isStack, !isStack || i === 0)));
  if (index === PAGES.length - 1) scroll.append(finale());
  scroll.querySelectorAll('.rise').forEach((node, i) => node.style.setProperty('--i', Math.min(i, 8)));
  return section;
}
function renderBackground(page){
  const layer = el('div','bg');
  const [top, middle, bottom] = page.bg;
  layer.style.background = `linear-gradient(165deg,${top},${middle} 52%,${bottom})`;
  [bottom, top, middle].forEach(color => {
    const blob = el('div','blob');
    blob.style.background = color;
    layer.append(blob);
  });
  return layer;
}

function sheetTop(card, label){
  const top = el('div','sheet-top');
  const text = el('div','t');
  text.append(el('small',null,label), el('strong',null,card.action.label));
  const close = el('button','x');
  close.setAttribute('aria-label','Close');
  close.append(icon('close'));
  close.addEventListener('click', closeSheet);
  top.append(avatar(card.friend.name), text, close);
  return top;
}
function copyButton(label, textOf){
  const button = el('button','primary');
  const caption = el('span',null,label);
  button.append(icon('copy'), caption);
  button.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(textOf()); caption.textContent = 'Copied'; }
    catch (error) { console.warn('Clipboard unavailable', error); caption.textContent = 'Select and copy'; }
    setTimeout(() => { caption.textContent = label; }, 1600);
  });
  return button;
}
function composer(card){
  const field = el('textarea');
  field.value = card.action.draft;
  field.setAttribute('aria-label','Message draft');
  const regenerate = el('button','inert');
  regenerate.setAttribute('aria-disabled','true');
  regenerate.append(icon('redo'), el('span',null,'Regenerate'), el('em',null,'soon'));
  const buttons = el('div','btns');
  buttons.append(regenerate, copyButton('Copy', () => field.value));
  return [sheetTop(card,'To ' + card.friend.name), field, el('p','hint','Edit it until it sounds like you, then copy and paste it into the chat.'), buttons];
}
function summary(card){
  const poster = el('div','poster');
  const duo = el('div','duo');
  duo.append(avatar(DATA.owner), avatar(card.friend.name));
  poster.append(duo, el('h3',null,card.title), el('p',null,card.body));
  if (card.stats.length) poster.append(statList(card.stats));
  poster.append(el('div','mark','Your DMs, in review'));
  const lines = [card.title, card.body, ...card.stats.map(stat => `${stat.label}: ${stat.value}`)];
  const buttons = el('div','btns');
  buttons.append(copyButton('Copy summary', () => lines.join('\n')));
  return [sheetTop(card,'Share with ' + card.friend.name), poster, buttons];
}
function openSheet(card){
  const grab = el('div','grab');
  const parts = card.action.draft == null ? summary(card) : composer(card);
  sheet.replaceChildren(grab, ...parts);
  sheet.scrollTop = 0;
  stage.classList.add('sheet-open');
}
function closeSheet(){
  stage.classList.remove('sheet-open');
}

function go(index){
  if (index < 0 || index >= PAGES.length) return;
  current = index;
  document.querySelectorAll('.page').forEach((page, i) => page.classList.toggle('active', i === index));
  document.querySelectorAll('.bg').forEach((layer, i) => layer.classList.toggle('on', i === index));
  document.querySelectorAll('.bar').forEach((bar, i) => {
    bar.classList.toggle('done', i < index);
    bar.classList.toggle('now', i === index);
  });
  document.querySelectorAll('[data-nav]').forEach(button => {
    button.disabled = index + Number(button.dataset.nav) < 0 || index + Number(button.dataset.nav) >= PAGES.length;
  });
  document.getElementById('pageName').textContent = PAGES[index].name;
  document.getElementById('count').textContent = `${index + 1} / ${PAGES.length}`;
  document.body.style.setProperty('--c1', PAGES[index].bg[0]);
  document.body.style.setProperty('--c3', PAGES[index].bg[2]);
  history.replaceState(null, '', '#' + (index + 1));
}
function pageFromHash(){
  const requested = parseInt(location.hash.slice(1), 10);
  return requested >= 1 && requested <= PAGES.length ? requested - 1 : 0;
}
function handleStageClick(event){
  if (stage.classList.contains('sheet-open')) return;
  if (event.target.closest('button, a, textarea, .card:not(.ranked), .tray')) return;
  const bounds = stage.getBoundingClientRect();
  const isLeft = event.clientX - bounds.left < bounds.width * 0.33;
  go(current + (isLeft ? -1 : 1));
}
function handleKey(event){
  if (event.key === 'Escape') return closeSheet();
  if (stage.classList.contains('sheet-open') || event.target.matches('textarea, input')) return;
  if (event.key === 'ArrowRight') go(current + 1);
  if (event.key === 'ArrowLeft') go(current - 1);
}

function init(){
  PAGES.forEach((page, i) => {
    document.getElementById('bgs').append(renderBackground(page));
    document.getElementById('pages').append(renderPage(page, i));
    const bar = el('div','bar');
    bar.append(el('i'));
    document.getElementById('bars').append(bar);
  });
  document.getElementById('mark').append(icon('plane'));
  document.querySelectorAll('[data-nav]').forEach(button => {
    button.prepend(icon(button.dataset.nav === '1' ? 'right' : 'left'));
    button.addEventListener('click', () => go(current + Number(button.dataset.nav)));
  });
  document.querySelector('.foot [data-nav="-1"]').append('Back');
  document.querySelector('.foot [data-nav="1"]').prepend('Next');
  stage.addEventListener('click', handleStageClick);
  document.getElementById('scrim').addEventListener('click', event => { event.stopPropagation(); closeSheet(); });
  document.addEventListener('keydown', handleKey);
  window.addEventListener('hashchange', () => go(pageFromHash()));
  const shouldOpenSheet = location.hash.endsWith('-sheet');
  go(pageFromHash());
  if (shouldOpenSheet) document.querySelector('.page.active .cta').click();
}
init();
</script>
</body>
</html>
