<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Your DMs, in review</title>
<style>
:root {
  --bg: #000;
  --surface: #121212;
  --raised: #1c1c1c;
  --bubble: #262626;
  --line: #232323;
  --text: #f5f5f5;
  --text-soft: #c4c4c4;
  --text-mute: #8e8e8e;
  --dm: linear-gradient(165deg, #405DE6 0%, #833AB4 55%, #C13584 100%);
  --ring: linear-gradient(45deg, #FFDC80 0%, #FCAF45 14%, #F77737 28%, #F56040 40%, #FD1D1D 50%, #E1306C 62%, #C13584 75%, #833AB4 88%, #5851DB 100%);
  --hot: linear-gradient(135deg, #FCAF45 0%, #F56040 30%, #E1306C 62%, #833AB4 100%);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --side: clamp(320px, 25vw, 360px);
  --gap: clamp(6px, 1.2vh, 12px);
  --fs-msg: clamp(14.5px, 2.25vh, 18px);
  --fs-body: clamp(14px, 1.95vh, 16px);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid #5851DB; outline-offset: 2px; }
svg { display: block; }

/* stage: the whole window */
.stage { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: var(--side) minmax(0, 1fr); background: var(--bg); }

/* story bar */
.top { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 18px; padding: 10px 18px 9px; border-bottom: 1px solid var(--line); }
.segs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.seg { display: block; text-align: left; padding: 0; color: var(--text-mute); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; transition: color .2s; }
.seg:hover { color: var(--text); }
.seg .bar { display: block; height: 3px; border-radius: 3px; background: #2e2e2e; overflow: hidden; margin-bottom: 7px; }
.seg .bar i { display: block; height: 100%; width: 0; background: var(--ring) fixed; background-size: 100vw 100%; transition: width .5s var(--ease); }
.seg.done .bar i, .seg.now .bar i { width: 100%; }
.seg.now { color: var(--text); font-weight: 700; }
.seg.done { color: var(--text-soft); }
.counter { flex: none; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--text); background: var(--surface); border: 1px solid #2b2b2b; padding: 4px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }

/* avatars */
.ring { position: relative; flex: none; border-radius: 50%; padding: max(2px, calc(var(--size, 40px) * .045)); background: var(--ring); width: var(--size, 40px); height: var(--size, 40px); }
.ring-in { width: 100%; height: 100%; border-radius: 50%; border: max(2px, calc(var(--size, 40px) * .04)) solid #000; background: linear-gradient(160deg, #2c2c2c, #161616); display: grid; place-items: center; font-weight: 700; font-size: calc(var(--size, 40px) * .34); letter-spacing: .02em; color: #fff; }
.ring.active::after { content: ""; position: absolute; right: 0; bottom: 0; width: 24%; height: 24%; min-width: 11px; min-height: 11px; border-radius: 50%; background: #1cd14f; border: 2.5px solid #000; }

/* inbox column */
.side { min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: clamp(14px, 2.6vh, 24px) 0 14px; }
.side-head { padding: 0 22px; }
.brand { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: linear-gradient(90deg, #FCAF45, #E1306C 55%, #833AB4); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.page-name { margin-top: 6px; font-size: clamp(28px, 4.6vh, 36px); line-height: 1.15; font-weight: 800; letter-spacing: -.035em; }
.page-desc { margin-top: 8px; font-size: 14px; line-height: 1.4; color: var(--text-soft); }
.list-label { display: flex; justify-content: space-between; align-items: baseline; margin: clamp(14px, 2.6vh, 24px) 22px 6px; font-size: 13px; font-weight: 700; }
.list-label span:last-child { color: var(--text-mute); font-weight: 500; font-size: 12.5px; }
.list { list-style: none; padding: 0 8px; display: grid; gap: 2px; }
.chat-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: clamp(8px, 1.4vh, 12px) 14px; border-radius: 16px; text-align: left; transition: background .2s; animation: pop .45s var(--ease) both; animation-delay: calc(var(--i) * 55ms); }
.chat-row:hover { background: rgba(255,255,255,.04); }
.chat-row[aria-current="true"] { background: var(--raised); }
.row-mid { flex: 1; min-width: 0; }
.row-name { font-size: 13.5px; color: var(--text-soft); font-weight: 500; }
.row-preview { margin-top: 2px; font-size: 14.5px; line-height: 1.25; font-weight: 700; letter-spacing: -.01em; color: var(--text); text-wrap: pretty; }
.ranked .row-name { font-size: 15.5px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.ranked .row-preview { font-size: 13.5px; font-weight: 500; color: var(--text-mute); letter-spacing: 0; }
.unread { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--dm); box-shadow: 0 0 10px rgba(131,58,180,.8); transition: opacity .3s, transform .3s; }
.unread.seen { opacity: 0; transform: scale(.4); }
.rank { flex: none; min-width: 36px; text-align: center; font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: var(--dm); color: #fff; font-variant-numeric: tabular-nums; }
li:first-child .rank { background: var(--hot); }
.side-foot { margin-top: auto; padding: 0 22px; display: grid; gap: 7px; color: var(--text-mute); font-size: 12.5px; }
.keys { display: flex; align-items: center; gap: 6px; }
.keys kbd { font: inherit; font-size: 11px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; border: 1px solid #333; border-radius: 6px; background: var(--surface); color: var(--text); }
.keys span { margin: 0 8px 0 2px; }
.made { font-size: 11.5px; letter-spacing: .02em; }

/* conversation pane */
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: radial-gradient(900px 480px at 85% 0%, rgba(88,81,219,.10), transparent 70%), radial-gradient(800px 480px at 20% 100%, rgba(225,48,108,.07), transparent 70%); }
.pane-head { display: flex; align-items: center; gap: 12px; padding: clamp(9px, 1.5vh, 14px) 24px; border-bottom: 1px solid var(--line); }
.pane-who { flex: 1; min-width: 0; }
.pane-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.pane-sub { font-size: 13px; color: var(--text-mute); margin-top: 1px; }
.pane-count { font-size: 12.5px; color: var(--text-mute); font-variant-numeric: tabular-nums; margin-right: 4px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; flex: none; border: 1px solid #2b2b2b; background: var(--surface); }
.icon-btn:hover { background: #222; }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }
.body { flex: 1; min-height: 0; padding: clamp(10px, 2vh, 20px) 24px; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(18px, 2.2vw, 36px); animation: pane-in .4s var(--ease); }
@keyframes pane-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

/* the product's own messages */
.story { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--gap); padding-left: 38px; }
.stamp { align-self: center; font-size: 11.5px; color: var(--text-mute); font-weight: 500; margin-left: -38px; }
.bubble { max-width: 78%; padding: .58em .95em; border-radius: 1.35em; font-size: var(--fs-msg); line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; width: fit-content; }
.bubble.them { background: var(--bubble); color: var(--text); }
.bubble.me { background: var(--dm); color: #fff; }
.intro.bubble { max-width: 100%; font-size: var(--fs-body); border-bottom-left-radius: 6px; }
.rich { position: relative; background: var(--surface); border: 1px solid #2b2b2b; border-radius: 22px; border-top-left-radius: 6px; padding: clamp(12px, 2vh, 18px) clamp(14px, 1.4vw, 20px); }
.bot-av { position: absolute; left: -38px; bottom: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--ring); display: grid; place-items: center; }
.bot-av svg { width: 15px; height: 15px; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 8px; }
.title { font-size: clamp(21px, 3.5vh, 30px); line-height: 1.1; font-weight: 800; letter-spacing: -.03em; text-wrap: balance; }
.text { margin-top: clamp(7px, 1.2vh, 12px); font-size: var(--fs-body); line-height: 1.42; color: var(--text-soft); text-wrap: pretty; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { display: inline-flex; align-items: baseline; gap: 7px; background: var(--raised); border: 1px solid #2b2b2b; border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.stat span { font-size: 10.5px; color: var(--text-mute); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
.stat b { font-weight: 700; letter-spacing: -.01em; }

/* link preview */
.preview { display: block; text-decoration: none; color: inherit; border-radius: 18px; border-top-left-radius: 6px; overflow: hidden; background: var(--bubble); border: 1px solid #343434; transition: transform .2s var(--ease); box-shadow: 0 0 28px rgba(225,48,108,.16); }
a.preview:hover { transform: translateY(-2px); }
.preview-banner { background: var(--hot); padding: 7px 14px; display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #fff; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 100% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } }
.preview-main { padding: 9px 14px 2px; }
.preview-meta { font-size: 11.5px; color: var(--text-mute); font-weight: 600; }
.preview-text { margin-top: 3px; font-size: clamp(13.5px, 1.9vh, 15px); line-height: 1.33; font-weight: 600; }
.preview-foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px 9px; font-size: 12px; color: var(--text-mute); }
.preview-open { display: inline-flex; align-items: center; gap: 5px; color: #fff; font-weight: 700; }
.preview-open svg { width: 12px; height: 12px; }

/* evidence threads: the hero */
.threads { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.threads[data-size="lg"] { --fs-msg: clamp(15px, 2.4vh, 19.5px); }
.threads[data-size="xl"] { --fs-msg: clamp(18px, 2.9vh, 23px); }
.thread { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #000; border: 1px solid #242424; border-radius: 24px; padding: 0 clamp(12px, 1.3vw, 20px) clamp(8px, 1.4vh, 14px); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.thread-head { display: flex; align-items: center; gap: 10px; padding: clamp(7px, 1.2vh, 11px) 2px; border-bottom: 1px solid #1c1c1c; }
.thread-name { font-size: 14px; font-weight: 700; flex: 1; min-width: 0; }
.thread-from { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 4px 10px; border-radius: 999px; color: #fff; background: var(--hot); white-space: nowrap; }
.thread-plain { font-size: 11.5px; color: var(--text-mute); }
.msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.sep { text-align: center; font-size: 11.5px; color: var(--text-mute); padding: clamp(3px, 1.1vh, 10px) 0 clamp(1px, .6vh, 6px); font-weight: 500; }
.row { display: flex; align-items: flex-end; gap: 8px; margin-top: 2px; }
.row.gap { margin-top: clamp(4px, .9vh, 8px); }
.row.me { justify-content: flex-end; }
.row .mini { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(160deg, #3a3a3a, #202020); font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none; visibility: hidden; }
.row.tail .mini { visibility: visible; }
.wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 76%; min-width: 0; }
.row.me .wrap { align-items: flex-end; }
.row .bubble { max-width: 100%; }
.row.them.joined-up .bubble { border-top-left-radius: 6px; }
.row.them.joined-down .bubble { border-bottom-left-radius: 6px; }
.row.me.joined-up .bubble { border-top-right-radius: 6px; }
.row.me.joined-down .bubble { border-bottom-right-radius: 6px; }
.row.key { margin-top: clamp(5px, 1vh, 10px); margin-bottom: clamp(2px, .6vh, 6px); }
.row.key .bubble { border: 1.5px solid transparent; box-shadow: 0 0 26px rgba(225,48,108,.42), 0 0 4px rgba(252,175,69,.5); }
.row.key .bubble.them { background: linear-gradient(#262626, #262626) padding-box, var(--hot) border-box; }
.row.key .bubble.me { background: var(--dm) padding-box, linear-gradient(135deg, #FFDC80, #F77737 45%, #E1306C) border-box; }
.this-one { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin: 0 8px 3px; background: linear-gradient(90deg, #FCAF45, #E1306C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.this-one svg { width: 9px; height: 9px; color: #FCAF45; }
.more { align-self: center; flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); padding: 5px 13px; border-radius: 999px; border: 1px solid #333; background: var(--surface); }
.more:hover { color: #fff; border-color: #555; }
.more b { background: linear-gradient(90deg, #FCAF45, #E1306C); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* cards with nothing to quote */
.body.solo { grid-template-columns: minmax(0, 720px); justify-content: center; --fs-body: clamp(16px, 2.5vh, 20px); }
.body.solo .title { font-size: clamp(30px, 5.6vh, 46px); }
.body.solo .stat { font-size: 16px; padding: 9px 17px; }

/* profile (ranked cards) */
.body.profile { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 0; }
.body.profile .story, .body.poster-body .story { justify-content: flex-start; }
.profile-main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 1.6vh, 16px); min-height: 0; }
.big-ring { position: relative; padding: 0 14px 14px; }
.big-ring .ring { box-shadow: 0 0 80px rgba(225,48,108,.28), 0 0 160px rgba(88,81,219,.2); }
.big-rank { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 800; letter-spacing: .04em; padding: 5px 14px; border-radius: 999px; background: var(--hot); color: #fff; border: 3px solid #000; }
.profile-name { font-size: clamp(36px, 6.6vh, 56px); line-height: 1.15; font-weight: 800; letter-spacing: -.04em; }
.profile-main .text { margin-top: 0; max-width: 580px; font-size: clamp(15px, 2.3vh, 18px); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 900px; }
.tile { min-width: 132px; background: var(--surface); border: 1px solid #2b2b2b; border-radius: 18px; padding: clamp(10px, 1.7vh, 15px) 18px; text-align: left; }
.tile span { display: block; font-size: 10.5px; color: var(--text-mute); letter-spacing: .07em; text-transform: uppercase; font-weight: 700; }
.tile b { display: block; margin-top: 4px; font-size: clamp(17px, 2.7vh, 22px); font-weight: 800; letter-spacing: -.02em; }

/* recap poster */
.body.poster-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: var(--gap); }
.poster { min-height: 0; border-radius: 30px; color: #fff; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(18px, 2.4vw, 40px); padding: clamp(12px, 2.6vh, 30px) clamp(20px, 2.4vw, 36px); background: linear-gradient(rgba(0,0,0,.06), rgba(0,0,0,.34)), linear-gradient(150deg, #405DE6 0%, #833AB4 30%, #C13584 56%, #E1306C 78%, #F77737 100%); box-shadow: 0 30px 90px rgba(131,58,180,.28); }
.poster.alone { grid-template-columns: minmax(0, 1fr); }
.poster-main { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(6px, 1.4vh, 14px); }
.pair { display: flex; align-items: center; }
.pair .ring { background: rgba(255,255,255,.92); }
.pair .ring + .ring { margin-left: -12px; }
.pair .ring { --size: clamp(34px, 5.6vh, 46px) !important; }
.pair-label { margin-left: 12px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.poster h2 { font-size: clamp(38px, 8.4vh, 84px); line-height: 1.15; font-weight: 800; letter-spacing: -.05em; margin: -.06em 0; }
.poster.alone h2 { font-size: clamp(52px, 10.5vh, 92px); }
.poster .text { margin: 0; color: rgba(255,255,255,.95); font-size: clamp(14px, 2.1vh, 18px); max-width: 640px; }
.poster .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: clamp(5px, 1vh, 8px); max-width: none; }
.poster .tile { min-width: 0; background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.14); padding: clamp(5px, 1.1vh, 12px) 13px; border-radius: 14px; }
.poster .tile span { color: rgba(255,255,255,.8); }
.poster .tile b { margin-top: 2px; font-size: clamp(14.5px, 2.3vh, 20px); }
.poster-made { font-size: 11px; opacity: .8; letter-spacing: .05em; }
.poster-side { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.poster-side .threads { flex: 1; }
.poster-side .thread { background: rgba(0,0,0,.62); border-color: rgba(255,255,255,.14); box-shadow: none; }
.poster-side .thread-head { border-color: rgba(255,255,255,.12); }

/* composer */
.composer { display: flex; align-items: center; gap: 10px; padding: clamp(8px, 1.4vh, 12px) 24px clamp(10px, 1.8vh, 16px); border-top: 1px solid var(--line); }
.composer .icon-btn { width: 46px; height: 46px; }
.composer .icon-btn svg { width: 22px; height: 22px; }
.composer-field { flex: 1; min-width: 0; height: 46px; border-radius: 999px; border: 1px solid #303030; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 18px; font-size: 15px; color: var(--text-mute); text-align: left; }
.composer-field:hover { border-color: #444; }
.composer-field strong { color: var(--text); font-weight: 600; }
.composer-field .go { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; flex: none; color: #fff; }
.composer-field .go svg { width: 17px; height: 17px; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 22px; border-radius: 999px; font-size: 15.5px; font-weight: 700; color: #fff; border: 1.5px solid transparent; background: linear-gradient(#000, #000) padding-box, var(--dm) border-box; box-shadow: 0 0 26px rgba(131,58,180,.4); transition: transform .15s var(--ease), background .2s; animation: pop .5s var(--ease) .15s both; }
.pill:hover { background: linear-gradient(#15122a, #15122a) padding-box, var(--dm) border-box; }
.pill:active { transform: scale(.96); }
.pill svg { width: 17px; height: 17px; }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 5; }
.sheet-layer { position: absolute; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }
.sheet { position: absolute; pointer-events: auto; bottom: 0; left: calc(var(--side) + (100% - var(--side)) / 2); width: min(600px, calc(100% - var(--side) - 48px)); max-height: 88%; overflow-y: auto; background: #1a1a1a; border: 1px solid #2e2e2e; border-bottom: 0; border-radius: 26px 26px 0 0; padding: 8px 20px 22px; transform: translate(-50%, 105%); visibility: hidden; transition: transform .42s var(--ease), visibility 0s .42s; box-shadow: 0 -20px 80px rgba(0,0,0,.7); scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.sheet:focus { outline: none; }
.stage.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.stage.sheet-open .sheet { transform: translate(-50%, 0); visibility: visible; transition: transform .42s var(--ease); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: #4a4a4a; margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.sheet-sub { font-size: 12.5px; color: var(--text-mute); margin-top: 1px; }
.sheet-head .icon-btn { margin-left: auto; background: #2c2c2c; border: 0; width: 32px; height: 32px; }

  spark: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.6c.2.6.6 1 1.2 1.2L22 12l-6.6 2.2c-.6.2-1 .6-1.2 1.2L12 22l-2.2-6.6c-.2-.6-.6-1-1.2-1.2L2 12l6.6-2.2c.6-.2 1-.6 1.2-1.2L12 2z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6c.2.6.6 1 1.2 1.2L22 12l-6.6 2.2c-.6.2-1 .6-1.2 1.2L12 22l-2.2-6.6c-.2-.6-.6-1-1.2-1.2L2 12l6.6-2.2c.6-.2 1-.6 1.2-1.2L12 2z"/></svg>'
};

const PAGES = [
  { kind: 'your_people', name: 'Your People', label: 'Your people', sub: 'the chats that carry you',
    desc: 'The five people you actually talk to, ranked by closeness.', intro: 'First up: the people who fill your inbox. Pick a chat to see its numbers.' },
  { kind: 'memory_lane', name: 'Memory Lane', label: 'Memory lane', sub: 'buried deep in the thread',
    desc: 'Moments buried deep in old threads that deserve a second read.', intro: 'Some chats deserve a second read. The glowing messages are the ones that got me.' },
  { kind: 'reconnect', name: 'Reconnect', label: 'Gone quiet', sub: 'last active a while ago',
    desc: 'Things you two never shut up about, until you did.', intro: 'You two used to never shut up about this. Then it went quiet.' },
  { kind: 'both_wanted', name: 'Both Wanted', label: 'You both want this', sub: 'two chats, one idea',
    desc: 'You both said the same thing. Just not to each other.', intro: 'I found something neither of you knows.' },
  { kind: 'unfinished_plans', name: 'Unfinished Plans', label: 'Unfinished plan', sub: 'typing since forever',
    desc: 'Plans you keep making and never doing, with the receipts.', intro: 'You keep making this plan and never doing it. Every mention, dated.' },
  { kind: 'unanswered', name: 'Unanswered', label: 'Left hanging', sub: 'seen, never replied',
    desc: 'Someone asked you something. The chat moved on.', intro: 'It is not too late to answer. I drafted a start for you.' },
  { kind: 'recap', name: 'The Recap', label: 'Friendship recap', sub: 'made to be shared', layout: 'poster',
    desc: 'A whole friendship on a single card. Share the one that feels right.', intro: 'Last one. A whole friendship, poster sized.' }
];

const maxCardsPerPage = 3;
const maxMessagesPerCard = 6;
const farApartMs = 4 * 60 * 60 * 1000;
const stampFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const dayFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });

const $ = id => document.getElementById(id);
const stage = $('stage'), pane = $('pane'), sheet = $('sheet');
const selectedByPage = PAGES.map(() => 0);
const seenIds = new Set();
let pageIndex = 0;

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...kids.flat().filter(kid => kid !== null && kid !== undefined && kid !== false));
  return node;
}

const initials = name => String(name || '?').trim().split(/\s+/).slice(0, 2).map(word => word[0].toUpperCase()).join('');
const firstName = name => String(name || '').trim().split(/\s+/)[0];
const avatar = (name, size, isActive) => h('div', { class: 'ring' + (isActive ? ' active' : ''), style: `--size:${size}`, 'aria-hidden': 'true' }, h('div', { class: 'ring-in' }, initials(name)));
const isRanked = card => card.rank !== null && card.rank !== undefined;

function cardsFor(kind) {
  const cards = DATA.cards.filter(card => card.kind === kind);
  if (cards.length > 0 && cards.every(isRanked)) return cards.sort((a, b) => a.rank - b.rank);
  return cards.sort((a, b) => b.score - a.score).slice(0, maxCardsPerPage);
}

/* ---------- card sections ---------- */

function statsBlock(stats, isTiled) {
  if (!stats || !stats.length) return null;
  const item = isTiled ? 'tile' : 'stat';
  return h('div', { class: isTiled ? 'tiles' : 'stats' }, stats.map(stat => h('div', { class: item }, h('span', {}, stat.label), h('b', {}, stat.value))));
}

function safeUrl(raw) {
  try {
    const url = new URL(raw);
    return /^https?:$/.test(url.protocol) ? url : null;
  } catch (error) {
    return null;
  }
}

function contextBlock(context) {
  if (!context) return null;
  const url = safeUrl(context.url);
  const when = context.date ? dayFormat.format(new Date(context.date + 'T00:00:00Z')) : null;
  const meta = [context.source, when].filter(Boolean).join(' · ');
  const inner = [
    h('div', { class: 'preview-banner' }, h('i', { class: 'pulse' }), 'Why now'),
    h('div', { class: 'preview-main' }, meta && h('div', { class: 'preview-meta' }, meta), h('div', { class: 'preview-text' }, context.text)),
    h('div', { class: 'preview-foot' }, h('span', {}, url ? url.hostname.replace(/^www\./, '') : ''),
      url && h('span', { class: 'preview-open' }, 'Open', h('span', { html: ICON.open })))
  ];
  if (!url) return h('div', { class: 'preview' }, inner);
  return h('a', { class: 'preview', href: url.href, target: '_blank', rel: 'noopener noreferrer' }, inner);
}

function shownEvidence(evidence) {
  if (evidence.length <= maxMessagesPerCard) return evidence;
  const keyIndexes = evidence.map((message, i) => message.isKey ? i : -1).filter(i => i >= 0);
  const distance = i => keyIndexes.length ? Math.min(...keyIndexes.map(k => Math.abs(k - i))) : i;
  const keep = evidence.map((_, i) => i).sort((a, b) => distance(a) - distance(b) || a - b).slice(0, Math.max(maxMessagesPerCard, keyIndexes.length));
  return keep.sort((a, b) => a - b).map(i => evidence[i]);
}

function threadSegments(evidence) {
  const segments = [];
  for (const message of evidence) {
    const last = segments[segments.length - 1];
    if (last && last.name === message.threadName) last.messages.push(message);
    else segments.push({ name: message.threadName, messages: [message] });
  }
  return segments;
}

function isFarApart(earlier, later) {
  const a = new Date(earlier.timestamp), b = new Date(later.timestamp);
  return dayFormat.format(a) !== dayFormat.format(b) || Math.abs(b - a) >= farApartMs;
}

function messageRow(message, isJoinedUp, isJoinedDown) {
  const side = message.isFromOwner ? 'me' : 'them';
  const classes = ['row', side, message.isKey && 'key', isJoinedUp ? 'joined-up' : 'gap', isJoinedDown ? 'joined-down' : 'tail'];
  return h('div', { class: classes.filter(Boolean).join(' '), 'aria-label': `${message.sender}: ${message.text}` },
    !message.isFromOwner && h('div', { class: 'mini', 'aria-hidden': 'true' }, initials(message.sender)),
    h('div', { class: 'wrap' },
      message.isKey && h('span', { class: 'this-one' }, h('span', { html: ICON.star }), 'this one'),
      h('div', { class: 'bubble ' + side }, message.text)));
}

function threadBlock(segment, friendName) {
  const isOtherChat = segment.name !== friendName;
  const msgs = h('div', { class: 'msgs' });
  segment.messages.forEach((message, i) => {
    const prev = segment.messages[i - 1], next = segment.messages[i + 1];
    const hasBreak = !prev || isFarApart(prev, message);
    const hasBreakAfter = !next || isFarApart(message, next);
    if (hasBreak) msgs.append(h('div', { class: 'sep' }, stampFormat.format(new Date(message.timestamp))));
    const isJoinedUp = !hasBreak && prev.isFromOwner === message.isFromOwner && !prev.isKey && !message.isKey;
    const isJoinedDown = !hasBreakAfter && next.isFromOwner === message.isFromOwner && !next.isKey && !message.isKey;
    msgs.append(messageRow(message, isJoinedUp, isJoinedDown));
  });
  return h('div', { class: 'thread' },
    h('div', { class: 'thread-head' }, avatar(segment.name, '28px'), h('div', { class: 'thread-name' }, segment.name),
      isOtherChat ? h('span', { class: 'thread-from' }, 'your chat with ' + firstName(segment.name)) : h('span', { class: 'thread-plain' }, 'this chat')),
    msgs);
}

function threadsBlock(card, messages) {
  if (!messages.length) return null;
  const hiddenCount = card.evidence.length - messages.length;
  const size = messages.length <= 2 ? 'xl' : messages.length <= 4 ? 'lg' : 'md';
  const threads = h('div', { class: 'threads', 'data-size': size }, threadSegments(messages).map(segment => threadBlock(segment, card.friend.name)));
  if (hiddenCount > 0) {
    threads.lastElementChild.append(h('button', { class: 'more', type: 'button', onclick: () => openConversation(card) },
      h('b', {}, `+${hiddenCount} more`), 'open the full chat'));
  }
  return threads;
}

/* ---------- pane layouts ---------- */

const introBubble = page => h('div', { class: 'bubble them intro' }, page.intro);
const todayStamp = () => h('div', { class: 'stamp' }, 'Today · ' + dayFormat.format(new Date(DATA.generatedAt)));

function richMessage(card, page) {
  return h('div', { class: 'rich' }, h('div', { class: 'bot-av', html: ICON.spark }),
    h('div', { class: 'kicker' }, page.label), h('h2', { class: 'title' }, card.title), card.body && h('p', { class: 'text' }, card.body));
}

function chatPanel(card, page) {
  const threads = threadsBlock(card, shownEvidence(card.evidence || []));
  const story = h('div', { class: 'story' }, todayStamp(), introBubble(page), richMessage(card, page), statsBlock(card.stats), contextBlock(card.context));
  return h('div', { class: 'body' + (threads ? '' : ' solo') }, story, threads);
}

function profilePanel(card, page) {
  return h('div', { class: 'body profile' },
    h('div', { class: 'story' }, introBubble(page)),
    h('div', { class: 'profile-main' },
      h('div', { class: 'big-ring' }, avatar(card.friend.name, 'clamp(120px, 23vh, 190px)'), h('span', { class: 'big-rank' }, `#${card.rank} of your people`)),
      h('h2', { class: 'profile-name' }, card.title),
      card.body && h('p', { class: 'text' }, card.body),
      statsBlock(card.stats, true),
      threadsBlock(card, shownEvidence(card.evidence || [])), contextBlock(card.context)));
}

function posterPanel(card, page) {
  const threads = threadsBlock(card, shownEvidence(card.evidence || []));
  return h('div', { class: 'body poster-body' },
    h('div', { class: 'story' }, introBubble(page)),
    h('article', { class: 'poster' + (threads ? '' : ' alone') },
      h('div', { class: 'poster-main' },
        h('div', { class: 'pair' }, avatar(DATA.owner, '46px'), avatar(card.friend.name, '46px'), h('span', { class: 'pair-label' }, 'Your DMs, in review')),
        h('h2', {}, card.title), card.body && h('p', { class: 'text' }, card.body), statsBlock(card.stats, true), contextBlock(card.context),
        h('div', { class: 'poster-made' }, 'made for Instagram DMs')),
      threads && h('div', { class: 'poster-side' }, threads)));
}

function paneHead(card, page, cards, index) {
  const sub = [page.label, isRanked(card) ? `#${card.rank} closest` : page.sub].join(' · ');
  return h('header', { class: 'pane-head' }, avatar(card.friend.name, '46px', true),
    h('div', { class: 'pane-who' }, h('div', { class: 'pane-name' }, card.friend.name), h('div', { class: 'pane-sub' }, sub)),
    h('span', { class: 'pane-count' }, `${index + 1} of ${cards.length}`),
    h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Previous chat', html: ICON.up, disabled: index === 0 ? '' : null, onclick: () => select(index - 1) }),
    h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Next chat', html: ICON.down, disabled: index === cards.length - 1 ? '' : null, onclick: () => select(index + 1) }));
}

function composer(card) {
  const isLast = pageIndex === PAGES.length - 1;
  const upNext = PAGES[isLast ? 0 : pageIndex + 1].name;
  return h('footer', { class: 'composer' },
    h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Previous page', html: ICON.back, disabled: pageIndex === 0 ? '' : null, onclick: () => go(pageIndex - 1) }),
    h('button', { class: 'composer-field', type: 'button', onclick: () => go(isLast ? 0 : pageIndex + 1) },
      h('span', {}, isLast ? 'Replay' : 'Up next'), h('strong', {}, upNext), h('span', { class: 'go', html: ICON.arrow })),
    card.action && h('button', { class: 'pill', type: 'button', onclick: () => openSheet(card) }, card.action.label, h('span', { html: ICON.reply })));
}

function paneBody(card, page) {
  if (isRanked(card)) return profilePanel(card, page);
  if (page.layout === 'poster') return posterPanel(card, page);
  return chatPanel(card, page);
}

/* ---------- inbox ---------- */

function rowPreview(card) {
  if (!isRanked(card)) return card.title;
  const lead = (card.stats || [])[0];
  return lead ? `${lead.value} ${lead.label.toLowerCase()}` : card.body;
}

function chatRow(card, i, selectedIndex) {
  const isSelected = i === selectedIndex;
  return h('li', { class: isRanked(card) ? 'ranked' : '' },
    h('button', { class: 'chat-row', type: 'button', style: `--i:${i}`, 'aria-current': isSelected ? 'true' : 'false', onclick: () => select(i) },
      avatar(card.friend.name, isRanked(card) ? 'clamp(44px, 7vh, 54px)' : '56px'),
      h('div', { class: 'row-mid' }, h('div', { class: 'row-name' }, card.friend.name), h('div', { class: 'row-preview' }, rowPreview(card))),
      isRanked(card) ? h('span', { class: 'rank' }, '#' + card.rank) : h('span', { class: 'unread' + (seenIds.has(card.id) ? ' seen' : '') })));
}

/* ---------- rendering ---------- */

function renderTop() {
  $('counter').textContent = `${pageIndex + 1} / ${PAGES.length}`;
  [...$('segs').children].forEach((seg, i) => {
    seg.className = 'seg' + (i < pageIndex ? ' done' : i === pageIndex ? ' now' : '');
    seg.setAttribute('aria-current', i === pageIndex ? 'step' : 'false');
  });
}

function renderSide(page, cards, withEntrance) {
  $('pageName').textContent = page.name;
  $('pageDesc').textContent = page.desc;
  $('listTitle').textContent = 'Messages';
  $('listCount').textContent = cards.length === 1 ? '1 chat' : `${cards.length} chats`;
  const rows = cards.map((card, i) => chatRow(card, i, selectedByPage[pageIndex]));
  if (!withEntrance) rows.forEach(row => { row.firstElementChild.style.animation = 'none'; });
  $('list').replaceChildren(...rows);
}

function render(withEntrance) {
  const page = PAGES[pageIndex];
  const cards = cardsFor(page.kind);
  const index = Math.min(selectedByPage[pageIndex], cards.length - 1);
  renderTop();
  if (!cards.length) { renderSide(page, cards, withEntrance); pane.replaceChildren(); return; }
  const card = cards[index];
  renderSide(page, cards, withEntrance);
  seenIds.add(card.id);
  pane.replaceChildren(paneHead(card, page, cards, index), paneBody(card, page), composer(card));
  pane.dataset.kind = card.kind;
  requestAnimationFrame(() => $('list').querySelector('[aria-current="true"] .unread')?.classList.add('seen'));
}

function select(index) {
  const count = cardsFor(PAGES[pageIndex].kind).length;
  const target = Math.max(0, Math.min(count - 1, index));
  if (target === selectedByPage[pageIndex]) return;
  selectedByPage[pageIndex] = target;
  render(false);
}

function go(index) {
  const target = Math.max(0, Math.min(PAGES.length - 1, index));
  if (target === pageIndex) return;
  pageIndex = target;
  closeSheet();
  history.replaceState(null, '', '#' + (pageIndex + 1));
  render(true);
}

/* ---------- sheets ---------- */

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    button.replaceChildren(h('span', { html: ICON.check }), 'Copied');
  } catch (error) {
    console.warn('Clipboard write failed', error);
    button.replaceChildren('Select and copy');
  }
  setTimeout(() => button.replaceChildren(h('span', { html: ICON.copy }), 'Copy'), 1800);
}

const regenButton = () => h('button', { class: 'regen', type: 'button', disabled: '', 'aria-disabled': 'true' }, h('span', { html: ICON.regen }), 'Regenerate', h('em', {}, 'soon'));

function draftBody(card) {
  const textarea = h('textarea', { 'aria-label': 'Message draft', spellcheck: 'false' });
  textarea.value = card.action.draft;
  const fit = () => { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; };
  textarea.addEventListener('input', fit);
  requestAnimationFrame(fit);
  const copy = h('button', { class: 'copy', type: 'button', onclick: event => copyText(textarea.value, event.currentTarget) }, h('span', { html: ICON.copy }), 'Copy');
  return [
    h('div', { class: 'draft-box' }, textarea, h('div', { class: 'draft-actions' }, h('span', { class: 'draft-hint' }, 'Edit it until it sounds like you'), copy)),
    h('div', { class: 'sheet-foot' }, regenButton(), h('span', { class: 'sheet-note' }, 'Copy it, then paste it into your chat with ' + firstName(card.friend.name) + '.'))
  ];
}

function shareBody(card) {
  const lines = [card.title, card.body, '', ...(card.stats || []).map(stat => `${stat.label}: ${stat.value}`)];
  const copy = h('button', { class: 'copy', type: 'button', onclick: event => copyText(lines.join('\n').trim(), event.currentTarget) }, h('span', { html: ICON.copy }), 'Copy');
  return [
    h('div', { class: 'poster' }, h('div', { class: 'kicker' }, 'Your DMs, in review'), h('h3', {}, card.title),
      card.body && h('p', { class: 'text' }, card.body), statsBlock(card.stats, true), h('div', { class: 'poster-made' }, 'made for Instagram DMs')),
    h('div', { class: 'sheet-foot' }, regenButton(), h('span', { class: 'sheet-note' }, 'Copies the summary as text, ready to paste anywhere.'), copy)
  ];
}

function showSheet(card, title, sub, content) {
  sheet.replaceChildren(
    h('div', { class: 'grabber' }),
    h('div', { class: 'sheet-head' }, avatar(card.friend.name, '40px'),
      h('div', {}, h('div', { class: 'sheet-title' }, title), h('div', { class: 'sheet-sub' }, sub)),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', html: ICON.close, onclick: closeSheet })),
    ...content);
  sheet.scrollTop = 0;
  stage.classList.add('sheet-open');
  sheet.focus({ preventScroll: true });
}

function openSheet(card) {
  const hasDraft = card.action.draft !== null && card.action.draft !== undefined;
  showSheet(card, card.action.label, (hasDraft ? 'To ' : 'About ') + card.friend.name, hasDraft ? draftBody(card) : shareBody(card));
}

function openConversation(card) {
  showSheet(card, card.title, `The full chat · ${card.evidence.length} messages`, [threadsBlock({ ...card, evidence: [] }, card.evidence)]);
}

function closeSheet() {
  stage.classList.remove('sheet-open');
}

/* ---------- self-check ---------- */

function describe(node) {
  const name = node.tagName.toLowerCase() + (node.classList.length ? '.' + [...node.classList].join('.') : '');
  return `${name} "${node.textContent.trim().slice(0, 24)}" s${node.scrollWidth}x${node.scrollHeight} c${node.clientWidth}x${node.clientHeight}`;
}

function isClipped(node) {
  if (node.closest('.sheet-layer, .scrim')) return false;
  if (!node.clientWidth && !node.clientHeight) return false;
  if (getComputedStyle(node).visibility === 'hidden') return false;
  const box = node.getBoundingClientRect();
  const isOutside = box.right > innerWidth + 1 || box.bottom > innerHeight + 1 || box.left < -1 || box.top < -1;
  return isOutside || node.scrollHeight > node.clientHeight + 1 || node.scrollWidth > node.clientWidth + 1;
}

async function writeOverflowReport() {
  await document.fonts.ready;
  await Promise.all(document.getAnimations().map(animation => animation.finished.catch(() => null)));
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const report = {
    page: pageIndex + 1,
    viewport: [innerWidth, innerHeight],
    pageScrolls: document.documentElement.scrollHeight > innerHeight + 1,
    clipped: [stage, ...stage.querySelectorAll('*')].filter(isClipped).map(describe)
  };
  document.body.append(h('pre', { id: 'overflow-report', hidden: '' }, JSON.stringify(report)));
}

/* ---------- wiring ---------- */

function onStageClick(event) {
  if (event.target.closest('.scrim')) { closeSheet(); return; }
  if (event.target.closest('button, a, textarea, input, .sheet, .bubble')) return;
  go(pageIndex + (event.clientX < innerWidth * 0.4 ? -1 : 1));
}

function onKey(event) {
  if (stage.classList.contains('sheet-open')) {
    if (event.key === 'Escape') closeSheet();
    return;
  }
  if (event.target.closest('textarea, input')) return;
  const moves = { ArrowRight: () => go(pageIndex + 1), ArrowLeft: () => go(pageIndex - 1), ArrowDown: () => select(selectedByPage[pageIndex] + 1), ArrowUp: () => select(selectedByPage[pageIndex] - 1) };
  if (!moves[event.key]) return;
  event.preventDefault();
  moves[event.key]();
}

function readHash() {
  const [first, ...flags] = location.hash.slice(1).split('&');
  const number = parseInt(first, 10);
  const card = flags.map(flag => flag.match(/^card=(\d+)$/)).find(Boolean);
  return {
    index: Number.isNaN(number) ? 0 : Math.max(0, Math.min(PAGES.length - 1, number - 1)),
    cardIndex: card ? Number(card[1]) - 1 : 0,
    flags
  };
}

function init() {
  $('segs').append(...PAGES.map((page, i) => h('button', { class: 'seg', type: 'button', onclick: () => go(i) },
    h('span', { class: 'bar' }, h('i')), h('span', { class: 'lab' }, page.name))));
  stage.addEventListener('click', onStageClick);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => go(readHash().index));
  const start = readHash();
  pageIndex = start.index;
  const cards = cardsFor(PAGES[pageIndex].kind);
  selectedByPage[pageIndex] = Math.max(0, Math.min(cards.length - 1, start.cardIndex));
  render(true);
  const current = cards[selectedByPage[pageIndex]];
  if (start.flags.includes('sheet') && current && current.action) openSheet(current);
  if (start.flags.includes('full') && current && current.evidence.length) openConversation(current);
  if (start.flags.includes('check')) writeOverflowReport();
}

init();
</script>
</body>
</html>
