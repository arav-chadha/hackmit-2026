<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglow · Your DMs, in review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B12;
  --ink: #F5F3FB;
  --ink-soft: rgba(245, 243, 251, .78);
  --ink-faint: rgba(245, 243, 251, .54);
  --line: rgba(255, 255, 255, .14);
  --glass: rgba(16, 14, 28, .66);
  --ig: linear-gradient(100deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D, #F56040, #F77737, #FCAF45, #FFDC80);
  --ig-warm: linear-gradient(115deg, #FFDC80 0%, #FCAF45 14%, #F56040 34%, #E1306C 54%, #C13584 68%, #833AB4 86%, #5851DB 100%);
  --ig-ring: conic-gradient(from 200deg, #FFDC80, #FCAF45, #F77737, #F56040, #FD1D1D, #E1306C, #C13584, #833AB4, #5851DB, #405DE6, #FFDC80);
  --display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --rail: 4rem;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* one unit scales the whole layout: 16px at 1440x800, about 14.2px at 1280x720 */
html { font-size: clamp(11px, min(1.111vw, 2dvh), 20px); }
* { box-sizing: border-box; margin: 0; }
body {
  height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 1rem; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid #FCAF45; outline-offset: 3px; }
svg { display: block; width: 1.1em; height: 1.1em; }

/* drifting mesh: soft radial gradients, no filter blur, so it paints the same with or without a GPU */
.mesh { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(120% 90% at 50% 110%, #2a1147, #0B0B12 70%); }
.mesh i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 38s ease-in-out infinite alternate; }
.mesh i:nth-child(1) { width: 70vmax; height: 70vmax; left: -22vmax; top: -30vmax; background: radial-gradient(closest-side, rgba(64, 93, 230, .95), rgba(88, 81, 219, .55) 45%, transparent); }
.mesh i:nth-child(2) { width: 62vmax; height: 62vmax; right: -16vmax; top: -24vmax; background: radial-gradient(closest-side, rgba(225, 48, 108, .95), rgba(193, 53, 132, .6) 45%, transparent); animation-duration: 46s; animation-delay: -12s; }
.mesh i:nth-child(3) { width: 58vmax; height: 58vmax; right: -8vmax; bottom: -30vmax; background: radial-gradient(closest-side, rgba(247, 119, 55, .95), rgba(245, 96, 64, .55) 45%, transparent); animation-duration: 52s; animation-delay: -20s; }
.mesh i:nth-child(4) { width: 56vmax; height: 56vmax; left: 8vmax; bottom: -32vmax; background: radial-gradient(closest-side, rgba(131, 58, 180, .95), rgba(131, 58, 180, .5) 45%, transparent); animation-duration: 42s; animation-delay: -30s; }
.mesh i:nth-child(5) { width: 34vmax; height: 34vmax; left: 44%; top: 22%; background: radial-gradient(closest-side, rgba(252, 175, 69, .6), rgba(253, 29, 29, .22) 55%, transparent); animation-duration: 60s; animation-delay: -8s; }
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(7vw, -5vh, 0) scale(1.14); }
  100% { transform: translate3d(-6vw, 7vh, 0) scale(.94); }
}
.veil {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(11, 11, 18, .66) 0, rgba(11, 11, 18, .46) 30%, rgba(11, 11, 18, .12) 62%, rgba(11, 11, 18, 0) 100%);
}

.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }

/* story bar */
.story { grid-column: 1 / -1; padding: .55rem 1.25rem 0; }
.segments { display: grid; grid-template-columns: repeat(7, 1fr); gap: .4rem; }
.seg { display: block; padding: .3rem 0; }
.seg i { display: block; height: .25rem; border-radius: 1rem; background: rgba(255, 255, 255, .22); overflow: hidden; transition: background .3s; }
.seg:hover i { background: rgba(255, 255, 255, .4); }
.seg b { display: block; width: 0; height: 100%; border-radius: 1rem; background: var(--ig-warm); }
.seg.is-done b { width: 100%; }
.seg.is-current b { width: 100%; animation: fill 1.4s var(--ease) both; }
.seg.is-current i { box-shadow: 0 0 .9rem rgba(225, 48, 108, .9); overflow: visible; }
@keyframes fill { from { width: 0; } }
.story-row { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; padding: .3rem .1rem .2rem; }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.03em; }
.brand-dot { width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--ig-ring); display: grid; place-items: center; }
.brand-dot::after { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--bg); }
.brand-sub { margin-left: .4rem; font-family: var(--text); font-weight: 500; font-size: .78rem; letter-spacing: .01em; color: var(--ink-faint); }
.keys { display: flex; gap: 1.2rem; font-size: .72rem; color: var(--ink-faint); }
.keys span { display: inline-flex; align-items: center; gap: .3rem; }
kbd { font: 600 .66rem var(--text); min-width: 1.3rem; padding: .08rem .3rem; text-align: center; border-radius: .4rem; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink-soft); }
.counter { display: flex; align-items: baseline; gap: .8rem; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.counter b { font-family: var(--display); font-weight: 600; font-size: .95rem; letter-spacing: .02em; color: #fff; }
.counter b span { color: var(--ink-faint); }

/* rail, slimmed to glowing nodes */
.rail { display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01)); }
.steps { position: relative; list-style: none; padding: 0; }
.steps-track, .steps-fill { position: absolute; left: 50%; top: 1.4rem; width: 2px; margin-left: -1px; border-radius: 2px; }
.steps-track { bottom: 1.4rem; background: rgba(255, 255, 255, .14); }
.steps-fill { height: 0; background: linear-gradient(180deg, #FFDC80, #F56040, #E1306C, #833AB4, #405DE6); box-shadow: 0 0 .75rem rgba(225, 48, 108, .8); transition: height .7s var(--ease); }
.step { position: relative; display: block; padding: .5rem 0; color: var(--ink-faint); }
.step-node {
  width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-size: .68rem; font-weight: 600; letter-spacing: .02em;
  background: #15141f; border: 1px solid rgba(255, 255, 255, .18); transition: all .4s var(--ease);
}
.step:hover .step-node { color: #fff; border-color: rgba(255, 255, 255, .5); }
.step-name { display: none; position: absolute; left: 2.7rem; top: 50%; z-index: 9; transform: translateY(-50%); padding: .3rem .7rem; border-radius: 999px; white-space: nowrap; font-size: .78rem; font-weight: 600; color: #fff; background: rgba(20, 18, 34, .94); border: 1px solid var(--line); }
.step:hover .step-name, .step:focus-visible .step-name { display: block; }
.step.is-done .step-node { border-color: rgba(225, 48, 108, .7); color: #FFDC80; }
.step.is-current .step-node {
  border-color: transparent; color: #fff;
  background: linear-gradient(135deg, #F77737, #E1306C 55%, #833AB4);
  box-shadow: 0 0 0 .3rem rgba(225, 48, 108, .22), 0 0 1.6rem rgba(225, 48, 108, .85);
}

/* main */
.main { position: relative; min-width: 0; min-height: 0; overflow: hidden; cursor: default; }
.edge { position: absolute; top: 50%; z-index: 5; width: 2.4rem; height: 2.4rem; margin-top: -1.2rem; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink-soft); transition: all .3s var(--ease); }
.edge:hover { background: rgba(255, 255, 255, .18); color: #fff; }
.edge[disabled] { opacity: 0; pointer-events: none; }
.edge-prev { left: .45rem; }
.edge-next { right: .8rem; }
.colophon { position: absolute; left: 3.4rem; bottom: .8rem; font-size: .68rem; letter-spacing: .02em; color: var(--ink-faint); }

.pages { height: 100%; }
.page { display: none; height: 100%; padding: .9rem 4rem 1.6rem 3.4rem; grid-template-columns: 16.5rem minmax(0, 1fr); gap: 2.6rem; align-items: center; }
.page.is-active { display: grid; }

/* editorial column */
.editorial { min-width: 0; }
.editorial > * { animation: rise .8s var(--ease) both; }
.editorial > :nth-child(2) { animation-delay: .07s; }
.editorial > :nth-child(3) { animation-delay: .14s; }
.editorial > :nth-child(4) { animation-delay: .21s; }
.editorial > :nth-child(5) { animation-delay: .28s; }
@keyframes rise { from { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 1.8rem), .9rem, 0); } to { opacity: 1; transform: none; } }
.eyebrow { display: inline-flex; align-items: center; gap: .6rem; font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.eyebrow::before { content: ""; width: 1.7rem; height: 2px; border-radius: 2px; background: var(--ig); }
.headline {
  margin: .9rem 0 1.1rem; font-family: var(--display); font-weight: 800;
  font-size: 3.3rem; line-height: 1.02; letter-spacing: -.055em;
  background: var(--ig-warm); -webkit-background-clip: text; background-clip: text; color: transparent;
  padding-bottom: .1em;
}
.lede { font-size: .97rem; line-height: 1.55; color: var(--ink-soft); }
.hero { margin-top: 1.5rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.hero-value { font-family: var(--display); font-weight: 700; letter-spacing: -.05em; line-height: 1.3; font-size: 4.4rem; color: #fff; text-shadow: 0 0 3.5rem rgba(225, 48, 108, .55); overflow-wrap: anywhere; }
.hero-value[data-size="m"] { font-size: 3rem; }
.hero-value[data-size="s"] { font-size: 2.1rem; letter-spacing: -.04em; }
.hero-value.is-swapping { animation: swap .5s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(.75rem); } to { opacity: 1; transform: none; } }
.hero-label { margin-top: .2rem; font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.hero-label em { font-style: normal; color: var(--ink-faint); letter-spacing: .04em; text-transform: none; font-weight: 500; font-size: .85rem; }
.replay { margin-top: 1.4rem; display: inline-flex; align-items: center; gap: .5rem; padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); font-weight: 600; font-size: .85rem; }
.replay:hover { background: rgba(255, 255, 255, .16); }

/* showcase column */
.showcase { position: relative; height: 100%; min-width: 0; min-height: 0; display: flex; align-items: safe center; justify-content: center; animation: arrive .9s var(--ease) both .08s; }
@keyframes arrive { from { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 4rem), 0, 0) scale(.97); } to { opacity: 1; transform: none; } }

.glass {
  border: 1px solid var(--line); border-radius: 1.6em;
  background: linear-gradient(155deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03) 42%, rgba(255, 255, 255, .07)), var(--glass);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 2.75em rgba(255, 255, 255, .035), 0 2.2em 5em -1.5em rgba(0, 0, 0, .75);
  backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
}

/* deck: every card shows real content; the active one takes the big slot. --scale is fitted by script so type grows into spare room */
.deck { --scale: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: .8rem; font-size: calc(1rem * var(--scale)); }
.card { min-width: 0; padding: 1.15em 1.4em 1.2em; transition: border-color .4s, box-shadow .4s, transform .4s var(--ease); }
.card.is-active { order: -1; border-color: rgba(252, 175, 69, .5); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 0 2.75em rgba(255, 255, 255, .04), 0 2.4em 5.5em -1.5em rgba(0, 0, 0, .8), 0 0 4.5em -1.4em rgba(225, 48, 108, .8); }
.card[data-kind="recap"].is-active { background: linear-gradient(150deg, rgba(64, 93, 230, .30), rgba(131, 58, 180, .24) 36%, rgba(225, 48, 108, .24) 68%, rgba(247, 119, 55, .32)), linear-gradient(155deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .02) 42%), var(--glass); }
.card:not(.is-active) { cursor: pointer; }
.card:not(.is-active):hover { border-color: rgba(255, 255, 255, .34); }
.card-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2em; align-items: center; }
.card-grid.is-solo { grid-template-columns: minmax(0, 1fr); }
.card-story, .card-proof { min-width: 0; display: flex; flex-direction: column; gap: .75em; }
.lockup { display: flex; align-items: center; gap: .8em; }
.lockup .avatar { --s: 2.7em; }
.kicker { font-size: .7em; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.kicker span { margin-left: .6em; font-family: var(--display); font-weight: 600; color: var(--ink-faint); }
.card-title { font-family: var(--display); font-weight: 700; font-size: 1.42em; line-height: 1.14; letter-spacing: -.04em; text-wrap: balance; }
.card[data-kind="recap"] .card-title { font-size: 1.9em; background: var(--ig-warm); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em; }
.card-body { color: var(--ink-soft); font-size: .9em; line-height: 1.52; }
.card-foot { display: flex; align-items: center; flex-wrap: wrap; gap: .5em 1em; }
.foot-note { font-size: .74em; color: var(--ink-faint); }

.stats { display: flex; flex-wrap: wrap; gap: .45em; padding: 0; list-style: none; }
.stat { flex: 1 1 7.6em; min-width: 0; padding: .5em .8em .55em; border-radius: .95em; border: 1px solid rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .06); }
.stat-value { font-family: var(--display); font-weight: 600; font-size: .98em; line-height: 1.2; letter-spacing: -.03em; color: #fff; }
.stat-label { margin-top: .2em; font-size: .62em; font-weight: 700; line-height: 1.3; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.stat:only-child { flex: 0 1 auto; display: flex; align-items: baseline; gap: .6em; padding: .35em 1em; border-radius: 999px; }
.stat:only-child .stat-label { order: -1; margin: 0; }

.cta {
  display: inline-flex; align-items: center; gap: .6em; padding: .72em 1.4em; border-radius: 999px;
  font-weight: 700; font-size: .9em; color: #fff; letter-spacing: -.005em; white-space: nowrap;
  background: linear-gradient(100deg, #5851DB, #C13584 48%, #F56040 86%, #FCAF45);
  box-shadow: 0 .6em 2em -.5em rgba(225, 48, 108, .85), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: filter .25s, box-shadow .25s;
}
.cta:hover { filter: brightness(1.12); box-shadow: 0 .9em 2.4em -.5em rgba(225, 48, 108, 1), inset 0 1px 0 rgba(255, 255, 255, .35); }
.more { display: inline-flex; align-items: center; gap: .4em; padding: .3em .85em; border-radius: 999px; font-size: .74em; font-weight: 700; color: #FFE7B0; border: 1px solid rgba(252, 175, 69, .4); background: rgba(252, 175, 69, .1); white-space: nowrap; }
.more:hover { background: rgba(252, 175, 69, .22); }
.more-inline { align-self: center; }
.more-side { display: none; }

/* why now */
.why {
  display: block; padding: .8em 1em .85em; border-radius: 1.1em; text-decoration: none; color: var(--ink);
  border: 1px solid transparent;
  background: linear-gradient(rgba(34, 24, 36, .94), rgba(34, 24, 36, .94)) padding-box, linear-gradient(120deg, #FFDC80, #F56040, #C13584) border-box;
  box-shadow: 0 0 1.8em -.2em rgba(252, 175, 69, .5);
  transition: box-shadow .3s;
}
.why:hover { box-shadow: 0 0 2.4em 0 rgba(252, 175, 69, .7); }
.why:hover .why-go { text-decoration: underline; }
.why-chip { display: inline-flex; align-items: center; gap: .55em; padding: .25em .8em .25em .6em; border-radius: 999px; font-size: .7em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #FFE7B0; border: 1px solid rgba(252, 175, 69, .6); background: rgba(252, 175, 69, .14); box-shadow: 0 0 1.4em rgba(252, 175, 69, .45); }
.pulse { width: .6em; height: .6em; border-radius: 50%; background: #FCAF45; box-shadow: 0 0 0 0 rgba(252, 175, 69, .7); animation: pulse 2s infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 .7em rgba(252, 175, 69, 0); } }
.why-text { margin-top: .55em; font-size: .86em; line-height: 1.45; }
.why-meta { display: flex; align-items: center; justify-content: space-between; gap: .8em; margin-top: .5em; font-size: .72em; color: var(--ink-faint); }
.why-go { display: inline-flex; align-items: center; gap: .3em; color: #FFDC80; font-weight: 700; }

/* evidence */
.thread { display: flex; flex-direction: column; gap: .25em; }
.day { align-self: center; margin: .45em 0 .2em; font-size: .64em; font-weight: 700; letter-spacing: .08em; color: var(--ink-faint); text-transform: uppercase; }
.day:first-child { margin-top: 0; }
.skip { align-self: center; display: flex; gap: .3em; padding: .15em 0; }
.skip i { width: .25em; height: .25em; border-radius: 50%; background: var(--ink-faint); }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; }
.msg.is-owner { align-self: flex-end; align-items: flex-end; }
.msg-from { margin: .3em .5em .2em; font-size: .68em; font-weight: 600; color: var(--ink-faint); }
.msg-from b { color: #FFDC80; font-weight: 700; }
.bubble {
  padding: .42em .95em .48em; border-radius: 1.35em; font-size: .86em; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere;
  border: 1px solid rgba(255, 255, 255, .13); background: rgba(255, 255, 255, .11);
  border-bottom-left-radius: .4em;
}
.is-owner .bubble { border-color: transparent; border-radius: 1.35em; border-bottom-right-radius: .4em; color: #fff; background: linear-gradient(135deg, #405DE6, #833AB4 52%, #C13584); }
.msg.is-key .bubble {
  border: 1.5px solid transparent; font-weight: 600; color: #fff;
  background: linear-gradient(rgba(42, 34, 58, .95), rgba(42, 34, 58, .95)) padding-box, var(--ig-warm) border-box;
  box-shadow: 0 0 1.6em -.1em rgba(225, 48, 108, .65), 0 0 0 .25em rgba(252, 175, 69, .08);
}
.msg.is-key.is-owner .bubble {
  background: linear-gradient(135deg, #5851DB, #C13584 55%, #F56040) padding-box, linear-gradient(120deg, #FFDC80, #fff 50%, #FCAF45) border-box;
  box-shadow: 0 0 1.7em -.1em rgba(245, 96, 64, .75), 0 0 0 .25em rgba(252, 175, 69, .09);
}

/* facing chats */
.card-grid.is-facing { display: flex; flex-direction: column; align-items: stretch; gap: 1em; }
.is-facing .card-story, .is-facing .card-proof { display: contents; }
.is-facing .card-foot { order: 9; justify-content: center; }
.is-facing .card-body { max-width: 46em; }
.facing { display: flex; align-items: stretch; gap: .6em; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .9em; padding: 1em 1.1em 1.2em; border-radius: 1.3em; border: 1px solid rgba(255, 255, 255, .14); background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
.pane.is-elsewhere { border-color: rgba(252, 175, 69, .45); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 0 2em -.6em rgba(252, 175, 69, .55); }
.pane-head { display: flex; align-items: center; gap: .65em; padding-bottom: .75em; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.pane-head .avatar { --s: 2.2em; }
.pane-kicker { font-size: .58em; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.is-elsewhere .pane-kicker { color: #FFDC80; }
.pane-name { font-weight: 700; font-size: .84em; line-height: 1.2; }
.pane .thread { flex: 1; justify-content: center; }
.pane .msg { max-width: 92%; }
.pane .bubble { font-size: .95em; padding: .6em 1.1em .65em; }
.link { flex: none; align-self: center; width: 2.1em; height: 2.1em; margin: 0 -1.2em; z-index: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #F77737, #E1306C 55%, #833AB4); box-shadow: 0 0 0 .3em rgba(11, 11, 18, .55), 0 0 1.6em rgba(225, 48, 108, .9); }
.link svg { width: 1em; height: 1em; }

/* pager */

const maxCards = 3;
const maxMessages = 6;
const podiumSize = 3;
const scaleSteps = [1.5, 1.4, 1.3, 1.22, 1.15, 1.08, 1, .94, .88];
const fillRatio = .97;
const isWide = window.matchMedia('(min-width: 901px)');
const breakGapMs = 4 * 60 * 60 * 1000;
const settleMs = 400;
const fontWaitMs = 3000;
const dayFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });
const timeFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', hour: 'numeric', minute: '2-digit' });
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) setAttr(el, key, value);
  el.append(...kids.filter(Boolean));
  return el;
}

function setAttr(el, key, value) {
  if (key === 'class') return void (el.className = value);
  if (key === 'text') return void (el.textContent = value);
  if (key === 'html') return void (el.innerHTML = value);
  if (key.startsWith('on')) return void el.addEventListener(key.slice(2), value);
  el.setAttribute(key, value);
}

function initials(name) {
  return name.split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
}

function avatar(name, isLive) {
  return h('span', { class: 'avatar' + (isLive ? ' is-live' : ''), 'aria-hidden': 'true' },
    h('span', { class: 'avatar-core', text: initials(name) }));
}

function pad(number) {
  return String(number).padStart(2, '0');
}

function cardsFor(kind) {
  const cards = DATA.cards.filter(card => card.kind === kind);
  if (kind === 'your_people') return cards.sort((a, b) => a.rank - b.rank);
  return cards.sort((a, b) => b.score - a.score).slice(0, maxCards);
}

/* ---------- shared card parts ---------- */

function buildStats(stats) {
  if (!stats.length) return null;
  return h('ul', { class: 'stats' }, ...stats.map(stat =>
    h('li', { class: 'stat' },
      h('div', { class: 'stat-value', text: stat.value }),
      h('div', { class: 'stat-label', text: stat.label }))));
}

function buildContext(context) {
  if (!context) return null;
  const meta = h('div', { class: 'why-meta' },
    h('span', { text: context.source + ' · ' + dayFormat.format(new Date(context.date)) }),
    h('span', { class: 'why-go' }, 'Read the story', h('span', { html: ICONS.out })));
  return h('a', { class: 'why', href: context.url, target: '_blank', rel: 'noopener noreferrer' },
    h('span', { class: 'why-chip' }, h('i', { class: 'pulse' }), 'Why now'),
    h('div', { class: 'why-text', text: context.text }),
    meta);
}

function shownIndexes(evidence) {
  const indexes = evidence.map((message, index) => index);
  if (indexes.length <= maxMessages) return indexes;
  const keys = indexes.filter(index => evidence[index].isKey);
  if (!keys.length) return indexes.slice(0, maxMessages);
  const distance = index => Math.min(...keys.map(key => Math.abs(key - index)));
  const fillers = indexes.filter(index => !evidence[index].isKey).sort((a, b) => distance(a) - distance(b) || a - b);
  const room = Math.max(0, maxMessages - keys.length);
  return [...keys, ...fillers.slice(0, room)].sort((a, b) => a - b);
}

function isBreak(previous, current) {
  if (!previous) return true;
  const before = new Date(previous.timestamp);
  const after = new Date(current.timestamp);
  if (dayFormat.format(before) !== dayFormat.format(after)) return true;
  return after - before >= breakGapMs;
}

function buildDay(message) {
  const when = new Date(message.timestamp);
  return h('div', { class: 'day', text: dayFormat.format(when) + ' · ' + timeFormat.format(when) });
}

function buildMessage(message, card, isLabelled) {
  const classes = ['msg', message.isFromOwner ? 'is-owner' : '', message.isKey ? 'is-key' : ''];
  const row = h('div', { class: classes.join(' ').trim() });
  if (isLabelled) {
    const isElsewhere = message.threadName !== card.friend.name;
    row.append(h('div', { class: 'msg-from' },
      message.sender + (isElsewhere ? ', in another chat: ' : ', in chat with '),
      h('b', { text: message.threadName })));
  }
  row.append(h('div', { class: 'bubble', text: message.text }));
  return row;
}

function buildThread(card, indexes, isLabelled) {
  const thread = h('div', { class: 'thread' });
  const lead = indexes.find(index => card.evidence[index].isKey) ?? indexes[0];
  indexes.forEach((index, position) => {
    const message = card.evidence[index];
    const previous = indexes[position - 1];
    if (isBreak(card.evidence[previous], message)) thread.append(buildDay(message));
    else if (index - previous > 1) thread.append(h('div', { class: 'skip', 'aria-hidden': 'true' }, h('i'), h('i'), h('i')));
    const row = buildMessage(message, card, isLabelled);
    row.classList.toggle('is-lead', index === lead);
    thread.append(row);
  });
  return thread;
}

function buildPane(card, threadName, indexes) {
  const isElsewhere = threadName !== card.friend.name;
  const head = h('div', { class: 'pane-head' }, avatar(threadName),
    h('div', {},
      h('div', { class: 'pane-kicker', text: isElsewhere ? 'A different chat' : 'This chat' }),
      h('div', { class: 'pane-name', text: 'You and ' + threadName })));
  return h('div', { class: 'pane' + (isElsewhere ? ' is-elsewhere' : '') }, head, buildThread(card, indexes, false));
}

function buildFacing(card, indexes, threadNames) {
  const facing = h('div', { class: 'facing' });
  threadNames.forEach((threadName, position) => {
    if (position) facing.append(h('span', { class: 'link', 'aria-hidden': 'true', html: ICONS.link }));
    facing.append(buildPane(card, threadName, indexes.filter(index => card.evidence[index].threadName === threadName)));
  });
  return facing;
}

function threadNamesOf(card) {
  return [...new Set(card.evidence.map(message => message.threadName))];
}

function buildEvidence(card, indexes) {
  if (!indexes.length) return null;
  const threadNames = threadNamesOf(card);
  if (threadNames.length > 1) return buildFacing(card, indexes, threadNames);
  return buildThread(card, indexes, threadNames[0] !== card.friend.name);
}

function buildMore(card, count, variant) {
  if (count <= 0) return null;
  const label = '+' + count + ' more' + (variant === 'more-inline' ? (count === 1 ? ' message' : ' messages') : '');
  return h('button', { class: 'more ' + variant, type: 'button', 'aria-label': 'Open the full conversation', text: label, onclick: () => openThread(card) });
}

function buildAction(card) {
  const sideMore = buildMore(card, card.evidence.length - 1, 'more-side');
  if (!card.action) return sideMore && h('div', { class: 'card-foot' }, sideMore);
  const button = h('button', { class: 'cta', type: 'button', onclick: () => openSheet(card) }, h('span', { html: ICONS.send }), card.action.label);
  const note = card.action.draft === null ? 'Opens a shareable summary' : 'Opens an editable draft';
  return h('div', { class: 'card-foot' }, button, h('span', { class: 'foot-note', text: note }), sideMore);
}

function buildLockup(card, position) {
  return h('div', { class: 'lockup' }, avatar(card.friend.name),
    h('div', {},
      h('div', { class: 'kicker' }, card.friend.name, position ? h('span', { text: position }) : null),
      h('h2', { class: 'card-title', text: card.title })));
}

function buildProof(card) {
  const indexes = shownIndexes(card.evidence);
  const omitted = card.evidence.length - indexes.length;
  return [buildContext(card.context), buildEvidence(card, indexes), buildMore(card, omitted, 'more-inline')].filter(Boolean);
}

function gridVariant(card, proof, aside) {
  if (threadNamesOf(card).length > 1) return ' is-facing';
  if (proof.length) return '';
  return aside.length ? ' is-stats-led' : ' is-solo';
}

function buildCard(card, index, total) {
  const proof = buildProof(card);
  const stats = buildStats(card.stats);
  const aside = proof.length ? proof : [stats].filter(Boolean);
  const position = total > 1 ? pad(index + 1) + ' / ' + pad(total) : '';
  const story = h('div', { class: 'card-story' },
    buildLockup(card, position),
    h('p', { class: 'card-body', text: card.body }),
    proof.length ? stats : null,
    buildAction(card));
  const grid = h('div', { class: 'card-grid' + gridVariant(card, proof, aside) }, story, aside.length ? h('div', { class: 'card-proof' }, ...aside) : null);
  return h('article', { class: 'card glass', 'data-kind': card.kind, 'data-id': card.id }, grid);
}

/* ---------- editorial column ---------- */

function buildEditorial(page, pageIndex, isLast) {
  const hero = h('div', { class: 'hero' },
    h('div', { class: 'hero-value' }), h('div', { class: 'hero-label' }));
  const column = h('section', { class: 'editorial' },
    h('div', { class: 'eyebrow', text: 'Chapter ' + pad(pageIndex + 1) + ' of ' + pad(PAGES.length) }),
    h('h1', { class: 'headline', text: page.headline }),
    h('p', { class: 'lede', text: page.lede }),
    hero);
  if (isLast) column.append(h('button', { class: 'replay', type: 'button', onclick: () => showPage(0) },
    h('span', { html: ICONS.redo }), 'Watch it again'));
  return column;
}

function heroSize(value) {
  if (value.length <= 5) return 'l';
  return value.length <= 8 ? 'm' : 's';
}

function updateHero(view, card) {
  const stat = card && card.stats[0];
  const value = stat ? stat.value : String(view.cards.length);
  const valueEl = view.el.querySelector('.hero-value');
  const labelEl = view.el.querySelector('.hero-label');
  valueEl.textContent = value;
  valueEl.dataset.size = heroSize(value);
  labelEl.textContent = stat ? stat.label + ' ' : view.page.unit;
  if (stat) labelEl.append(h('em', { text: '· ' + card.friend.name }));
  replay(valueEl);
}

function replay(el) {
  el.classList.remove('is-swapping');
  void el.offsetWidth;
  el.classList.add('is-swapping');
}

/* ---------- deck ---------- */

function buildDeck(view, pageIndex) {
  const total = view.cards.length;
  const deck = h('div', { class: 'deck', 'data-n': total });
  view.cardEls = view.cards.map((card, index) => buildCard(card, index, total));
  view.cardEls.forEach((el, index) => {
    el.style.viewTransitionName = 'card-' + pageIndex + '-' + index;
    el.addEventListener('click', event => onCardClick(view, index, event));
  });
  deck.append(...view.cardEls);
  const showcase = h('section', { class: 'showcase' }, deck);
  if (total > 1) showcase.append(buildPager(view));
  return showcase;
}

function onCardClick(view, index, event) {
  if (index === view.active || event.target.closest('button, a')) return;
  swapCard(view, index);
}

function buildPager(view) {
  view.dots = view.cards.map(() => h('i'));
  return h('div', { class: 'pager' },
    h('button', { type: 'button', 'aria-label': 'Previous card', html: ICONS.up, onclick: () => stepCard(-1) }),
    h('div', { class: 'pager-dots' }, ...view.dots),
    h('button', { type: 'button', 'aria-label': 'Next card', html: ICONS.down, onclick: () => stepCard(1) }));
}

function layoutDeck(view) {
  view.cardEls.forEach((el, index) => el.classList.toggle('is-active', index === view.active));
  (view.dots || []).forEach((dot, index) => dot.classList.toggle('is-on', index === view.active));
}

/* ---------- your people ---------- */

function buildPerson(view, index) {
  const card = view.cards[index];
  return h('article', { class: 'person glass', 'data-rank': card.rank, onclick: () => selectCard(view, index) },
    h('div', { class: 'person-top' },
      avatar(card.friend.name, index === 0),
      h('span', { class: 'person-rank', text: String(card.rank) }),
      h('h2', { class: 'person-name', text: card.title })),
    h('p', { class: 'card-body', text: card.body }),
    buildStats(card.stats), buildEvidence(card, shownIndexes(card.evidence)), buildAction(card));
}

function buildPeople(view) {
  view.cardEls = view.cards.map((card, index) => buildPerson(view, index));
  const podium = h('div', { class: 'podium' }, ...view.cardEls.slice(0, podiumSize));
  const runners = h('div', { class: 'runners' }, ...view.cardEls.slice(podiumSize));
  return h('section', { class: 'showcase' }, h('div', { class: 'people' }, podium, view.cards.length > podiumSize ? runners : null));
}

function layoutPeople(view) {
  view.cardEls.forEach((el, index) => el.classList.toggle('is-selected', index === view.active));
}

/* ---------- pages and navigation ---------- */

function buildPage(page, pageIndex) {
  const view = { page, cards: cardsFor(page.kind), active: 0, isRanked: page.kind === 'your_people' };
  view.el = h('div', { class: 'page', 'data-kind': page.kind });
  view.el.append(buildEditorial(page, pageIndex, pageIndex === PAGES.length - 1));
  if (view.cards.length) view.el.append(view.isRanked ? buildPeople(view) : buildDeck(view, pageIndex));
  return view;
}

function selectCard(view, index) {
  const total = view.cards.length;
  if (!total) return updateHero(view, null);
  view.active = (index + total) % total;
  if (view.isRanked) layoutPeople(view);
  else layoutDeck(view);
  updateHero(view, view.cards[view.active]);
  fitScale(view);
}

function fitScale(view) {
  const showcase = view.el.querySelector('.showcase');
  if (!showcase) return;
  const box = showcase.firstElementChild;
  if (!isWide.matches) return void box.style.removeProperty('--scale');
  const room = showcase.clientHeight * fillRatio;
  scaleSteps.find(scale => {
    box.style.setProperty('--scale', scale);
    return box.scrollHeight <= room;
  });
}

function swapCard(view, index) {
  const canAnimate = Boolean(document.startViewTransition) && !reducedMotion.matches && !view.isRanked;
  if (!canAnimate) return selectCard(view, index);
  document.startViewTransition(() => selectCard(view, index));
}

function stepCard(delta) {
  const view = state.views[state.page];
  swapCard(view, view.active + delta);
}

function buildRail() {
  const list = document.getElementById('steps');
  list.append(h('span', { class: 'steps-track' }), h('span', { class: 'steps-fill', id: 'fill' }));
  PAGES.forEach((page, index) => {
    const step = h('button', { class: 'step', type: 'button', 'aria-label': 'Chapter ' + (index + 1) + ', ' + page.name, onclick: () => showPage(index) },
      h('span', { class: 'step-node', text: pad(index + 1) }),
      h('span', { class: 'step-name', text: page.name }));
    list.append(h('li', {}, step));
  });
}

function buildSegments() {
  const segments = PAGES.map((page, index) =>
    h('button', { class: 'seg', type: 'button', role: 'tab', 'aria-label': page.name + ', page ' + (index + 1) + ' of ' + PAGES.length, onclick: () => showPage(index) },
      h('i', {}, h('b'))));
  document.getElementById('segments').append(...segments);
}

function markProgress(selector, currentValue) {
  const items = [...document.querySelectorAll(selector)];
  items.forEach((item, index) => {
    item.classList.toggle('is-done', index < state.page);
    item.classList.toggle('is-current', index === state.page);
    if (index === state.page) item.setAttribute('aria-current', currentValue);
    else item.removeAttribute('aria-current');
  });
  return items;
}

function updateChrome() {
  markProgress('.seg', 'page');
  const steps = markProgress('.step', 'step');
  const first = steps[0].getBoundingClientRect();
  const current = steps[state.page].getBoundingClientRect();
  document.getElementById('fill').style.height = (current.top - first.top) + 'px';
  document.getElementById('counter').replaceChildren(
    h('span', { text: PAGES[state.page].name }),
    h('b', {}, String(state.page + 1), h('span', { text: ' / ' + PAGES.length })));
  document.getElementById('prev').disabled = state.page === 0;
  document.getElementById('next').disabled = state.page === PAGES.length - 1;
}

function showPage(index) {
  const target = Math.max(0, Math.min(PAGES.length - 1, index));
  document.getElementById('main').style.setProperty('--dir', target < state.page ? -1 : 1);
  state.page = target;
  state.views.forEach((view, viewIndex) => view.el.classList.toggle('is-active', viewIndex === target));
  selectCard(state.views[target], state.views[target].active);
  updateChrome();
  history.replaceState(null, '', '#' + (target + 1));
  window.scrollTo(0, 0);
}

/* ---------- sheet ---------- */

function buildDraft(card) {
  const draft = h('textarea', { class: 'draft', id: 'draft', 'aria-label': 'Message draft', spellcheck: 'false' });
  draft.value = card.action.draft;
  return [draft, h('p', { class: 'sheet-note', text: 'Nothing sends from here. Edit it, copy it, then paste it into your chat with ' + card.friend.name + '.' })];
}

function buildPoster(card) {
  return [h('div', { class: 'poster' },
    h('div', { class: 'poster-title', text: card.title }),
    h('p', { class: 'poster-body', text: card.body }),
    buildStats(card.stats),
    h('div', { class: 'poster-sign', text: 'Afterglow · Your DMs, in review' }))];
}

function summaryText(card) {
  const lines = card.stats.map(stat => stat.label + ': ' + stat.value);
  return [card.title, card.body, ...lines].join('\n');
}

function buildSheetHead(card, kicker, title) {
  return h('div', { class: 'sheet-head' }, avatar(card.friend.name),
    h('div', {},
      h('div', { class: 'sheet-kicker', text: kicker }),
      h('div', { class: 'sheet-title', id: 'sheet-title', text: title })));
}

function buildCopyButton(card, isShare) {
  const label = h('span', { text: isShare ? 'Copy summary' : 'Copy message' });
  return h('button', { class: 'cta', type: 'button', onclick: () => copyFrom(card, label) }, h('span', { html: ICONS.copy }), label);
}

function buildRegenerate() {
  return h('button', { class: 'ghost', type: 'button', disabled: '', title: 'Needs the live backend' },
    h('span', { html: ICONS.redo }), 'Regenerate', h('small', { text: 'Soon' }));
}

function showSheet(parts, focusTarget) {
  const close = h('button', { class: 'sheet-close', type: 'button', 'aria-label': 'Close', html: ICONS.close, onclick: closeSheet });
  document.getElementById('sheet').replaceChildren(close, ...parts);
  const scrim = document.getElementById('scrim');
  scrim.classList.add('is-open');
  scrim.setAttribute('aria-hidden', 'false');
  state.isSheetOpen = true;
  (focusTarget || close).focus();
}

function openSheet(card) {
  const isShare = card.action.draft === null;
  const copyButton = buildCopyButton(card, isShare);
  const title = isShare ? 'Ready to share' : 'To ' + card.friend.name;
  showSheet([
    buildSheetHead(card, card.action.label, title),
    ...(isShare ? buildPoster(card) : buildDraft(card)),
    h('div', { class: 'sheet-actions' }, copyButton, isShare ? null : buildRegenerate())
  ], copyButton);
}

function openThread(card) {
  const indexes = card.evidence.map((message, index) => index);
  const isLabelled = card.evidence.some(message => message.threadName !== card.friend.name);
  const count = card.evidence.length + (card.evidence.length === 1 ? ' message' : ' messages');
  showSheet([
    buildSheetHead(card, 'Full conversation · ' + count, card.title),
    h('div', { class: 'sheet-thread' }, buildThread(card, indexes, isLabelled))
  ]);
}

function closeSheet() {
  const scrim = document.getElementById('scrim');
  scrim.classList.remove('is-open');
  scrim.setAttribute('aria-hidden', 'true');
  state.isSheetOpen = false;
}

async function copyFrom(card, labelEl) {
  const draft = document.getElementById('draft');
  const text = card.action.draft === null ? summaryText(card) : draft.value;
  try {
    await navigator.clipboard.writeText(text);
    labelEl.textContent = 'Copied';
  } catch (error) {
    console.warn('Clipboard write failed', error);
    if (draft) draft.select();
    labelEl.textContent = 'Press Cmd+C to copy';
  }
}

/* ---------- overflow self-check ---------- */

function isClipped(el) {
  if (el instanceof SVGElement || !el.getClientRects().length) return false;
  if (!el.clientHeight && !el.clientWidth) return false;
  return el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
}

function describe(el) {
  const name = el.tagName.toLowerCase() + (el.className ? '.' + String(el.className).trim().split(/\s+/).join('.') : '');
  return name + ' "' + el.textContent.trim().slice(0, 32) + '"';
}

function entranceAnimations() {
  return document.getAnimations()
    .filter(animation => Number.isFinite(animation.effect.getComputedTiming().endTime))
    .map(animation => animation.finished.catch(() => null));
}

async function reportOverflow() {
  const wait = new Promise(resolve => setTimeout(resolve, fontWaitMs));
  await Promise.race([document.fonts.ready, wait]);
  await Promise.all(entranceAnimations());
  await new Promise(resolve => setTimeout(resolve, settleMs));
  const stage = document.getElementById('app');
  const report = {
    page: state.page + 1,
    viewport: [window.innerWidth, window.innerHeight],
    pageScrolls: document.documentElement.scrollHeight > window.innerHeight + 1,
    clipped: [...stage.querySelectorAll('*')].filter(isClipped).map(describe)
  };
  document.body.append(h('pre', { id: 'overflow-report', hidden: '', text: JSON.stringify(report) }));
}

/* ---------- input ---------- */

const keyActions = {
  ArrowRight: () => showPage(state.page + 1),
  ArrowLeft: () => showPage(state.page - 1),
  ArrowDown: () => stepCard(1),
  ArrowUp: () => stepCard(-1)
};

function onKey(event) {
  if (event.key === 'Escape') return closeSheet();
  if (state.isSheetOpen || event.target.closest('textarea')) return;
  const action = keyActions[event.key];
  if (!action) return;
  event.preventDefault();
  action();
}

function onStageClick(event) {
  if (event.target.closest('.card, .person, .pager, button, a, textarea')) return;
  const box = event.currentTarget.getBoundingClientRect();
  showPage(state.page + (event.clientX < box.left + box.width / 2 ? -1 : 1));
}

function parseHash() {
  const [target, ...flags] = location.hash.slice(1).split('&');
  const [pageToken, cardToken, modal] = target.split('-');
  return {
    page: (parseInt(pageToken, 10) || 1) - 1,
    card: (parseInt(cardToken, 10) || 1) - 1,
    modal,
    isCheck: flags.includes('check')
  };
}

function applyHash() {
  const request = parseHash();
  showPage(request.page);
  const view = state.views[state.page];
  selectCard(view, request.card);
  const card = view.cards[view.active];
  if (request.modal === 'sheet' && card && card.action) openSheet(card);
  if (request.modal === 'thread' && card && card.evidence.length) openThread(card);
  return request;
}

function onResize() {
  updateChrome();
  fitScale(state.views[state.page]);
}

function bindInput() {
  document.getElementById('prev').addEventListener('click', () => showPage(state.page - 1));
  document.getElementById('next').addEventListener('click', () => showPage(state.page + 1));
  document.getElementById('main').addEventListener('click', onStageClick);
  document.getElementById('scrim').addEventListener('click', event => { if (event.target.id === 'scrim') closeSheet(); });
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', applyHash);
  window.addEventListener('resize', onResize);
}

function init() {
  buildSegments();
  buildRail();
  state.views = PAGES.map(buildPage);
  document.getElementById('pages').append(...state.views.map(view => view.el));
  document.getElementById('prev').innerHTML = ICONS.left;
  document.getElementById('next').innerHTML = ICONS.right;
  document.getElementById('colophon').textContent = 'Generated ' + dayFormat.format(new Date(DATA.generatedAt)) + ' for ' + DATA.owner + ' · Made for Instagram DMs';
  bindInput();
  document.fonts.ready.then(onResize);
  if (applyHash().isCheck) reportOverflow();
}

init();
</script>
</body>
</html>
