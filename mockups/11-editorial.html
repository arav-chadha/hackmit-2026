<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your DMs, in review: The Friendship Issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121012; --ink2:#55505a; --ink3:#8a858f; --rule:#dcd8d2; --paper:#fbfaf7; --tint:#f1efea;
  --grad:linear-gradient(160deg,#405DE6 0%,#5851DB 10%,#833AB4 24%,#C13584 40%,#E1306C 54%,#FD1D1D 66%,#F56040 76%,#F77737 85%,#FCAF45 93%,#FFDC80 100%);
  --gradtext:linear-gradient(100deg,#405DE6 0%,#833AB4 28%,#C13584 48%,#E1306C 64%,#F56040 84%,#F77737 100%);
  --gradrule:linear-gradient(90deg,#405DE6,#833AB4,#C13584,#E1306C,#F56040,#FCAF45);
  --gradbub:linear-gradient(135deg,#5851DB,#833AB4 40%,#C13584 72%,#E1306C);
  --serif:"Playfair Display","Didot","Bodoni 72","Georgia",serif;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --u:min(calc(100vw / 1440),calc(100dvh / 800));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.px{font-size:calc(var(--u) * 12)}

#stage{position:fixed;inset:0;display:grid;grid-template-columns:calc(var(--u) * 56) 1fr calc(var(--u) * 44);grid-template-rows:auto 1fr auto;overflow:hidden}

/* spine: the full-height gradient band, also the "previous" edge zone */
.spine{grid-row:1 / -1;background:var(--grad);display:flex;align-items:center;justify-content:center;cursor:w-resize;position:relative}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:calc(var(--u) * 10.5);font-weight:600;letter-spacing:.32em;text-transform:uppercase;white-space:nowrap}
.edge{grid-column:3;grid-row:1 / -1;display:flex;align-items:center;justify-content:center;cursor:e-resize;color:var(--ink3);border-left:1px solid var(--rule)}
.edge svg,.spine svg{width:calc(var(--u) * 16);height:calc(var(--u) * 16)}
.spine svg{position:absolute;bottom:calc(var(--u) * 18);color:#fff}
.edge:hover{color:var(--ink);background:var(--tint)}

/* running header doubles as the story progress bar */
.running{grid-column:2;padding:calc(var(--u) * 14) calc(var(--u) * 32) 0}
.running .line{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(var(--u) * 10.5);letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.running .line b{font-weight:700}
.running .line i{font-style:normal;color:var(--ink3);margin:0 .7em}
.running .count{font-family:var(--serif);font-size:calc(var(--u) * 15);letter-spacing:.04em;font-weight:500;font-style:italic;text-transform:none}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--u) * 6);margin-top:calc(var(--u) * 8)}
.seg{height:calc(var(--u) * 14);position:relative;cursor:pointer}
.seg::before,.seg::after{content:"";position:absolute;left:0;right:0;top:calc(var(--u) * 4);height:calc(var(--u) * 3);border-radius:9px;background:var(--rule)}
.seg::after{background:var(--gradrule);background-size:700% 100%;background-position:calc(var(--i) * 16.66%) 0;transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.seg.on::after{transform:scaleX(1)}
.seg:hover::before{background:var(--ink3)}

.folio{grid-column:2;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u) * 9) calc(var(--u) * 32) calc(var(--u) * 12);margin-top:0;font-size:calc(var(--u) * 10);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--rule);margin-inline:0}
.folio b{color:var(--ink);font-weight:600}
.folio .pg{font-family:var(--serif);font-style:italic;font-size:calc(var(--u) * 14);letter-spacing:0;text-transform:none;color:var(--ink)}
.folio kbd{font:inherit;border:1px solid var(--rule);border-radius:calc(var(--u) * 4);padding:0 .45em;margin-right:.3em;color:var(--ink2)}

/* spreads */
#pages{grid-column:2;grid-row:2;position:relative;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;padding:calc(var(--u) * 18) calc(var(--u) * 32) calc(var(--u) * 16);display:none;grid-template-columns:repeat(12,1fr);column-gap:calc(var(--u) * 24)}
.page.active{display:grid;animation:turn .6s cubic-bezier(.22,.7,.2,1) both}
.page.active.back{animation-name:turnback}
@keyframes turn{from{opacity:0;transform:translateX(4%)}to{opacity:1;transform:none}}
@keyframes turnback{from{opacity:0;transform:translateX(-4%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none}.seg::after,.modal,.sheet{transition:none!important}}

.opener{grid-column:span 3;min-height:0;display:flex;flex-direction:column;padding-right:calc(var(--u) * 8)}
.page.wideopen .opener{grid-column:span 4}
.articles{grid-column:span 9;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;--a:calc(var(--u) * var(--k,1))}
.page.wideopen .articles{grid-column:span 8}

.kicker{font-size:calc(var(--u) * 10.5);font-weight:700;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:.9em}
.kicker::before{content:"";width:calc(var(--u) * 28);height:calc(var(--u) * 3);background:var(--gradrule);border-radius:9px}
.headline{font-family:var(--serif);font-weight:800;font-size:calc(var(--u) * 50);line-height:.98;padding-bottom:.3em;margin-bottom:-.3em;letter-spacing:-.025em;margin-top:calc(var(--u) * 14)}
.wideopen .headline{font-size:calc(var(--u) * 64)}
.headline em{font-weight:500;font-style:italic}
.standfirst{font-family:var(--serif);font-size:calc(var(--u) * 16.5);line-height:1.4;color:var(--ink2);margin-top:calc(var(--u) * 14);max-width:26em}
.wideopen .standfirst{font-size:calc(var(--u) * 18.5)}
.hero{margin-top:calc(var(--u) * 12);margin-bottom:calc(var(--u) * -22);display:flex;align-items:flex-end;gap:calc(var(--u) * 12)}
.hero .num{font-family:var(--serif);font-weight:900;font-size:calc(var(--u) * 124);line-height:.86;letter-spacing:-.04em;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .05em .3em 0}
.hero .num.long{font-size:calc(var(--u) * 92)}
.hero:has(.long){flex-direction:column;align-items:flex-start;gap:0;margin-bottom:0}
.hero:has(.long) .cap{max-width:none;padding:0;margin-top:calc(var(--u) * -4)}
.hero .cap{font-size:calc(var(--u) * 10.5);letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink2);line-height:1.5;padding-bottom:calc(var(--u) * 40);max-width:12em}

.pull{margin-top:auto;padding-top:calc(var(--u) * 10);position:relative}
.pull .mark{font-family:var(--serif);font-weight:900;font-size:calc(var(--u) * 110);line-height:1;padding-bottom:.25em;margin-bottom:-.66em;margin-top:-.12em;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;padding-right:.1em;width:max-content}
.pull blockquote{font-family:var(--serif);font-style:italic;font-weight:500;font-size:calc(var(--u) * 23);line-height:1.22;letter-spacing:-.01em}
.wideopen .pull blockquote{font-size:calc(var(--u) * 29)}
.pull .by{margin-top:calc(var(--u) * 10);font-size:calc(var(--u) * 10);letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:.8em}
.pull .by::before{content:"";width:calc(var(--u) * 22);height:calc(var(--u) * 2);background:var(--gradrule)}

.toc{margin-top:auto;border-top:1px solid var(--ink);padding-top:calc(var(--u) * 8)}
.toc h4{font-size:calc(var(--u) * 10);letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin-bottom:calc(var(--u) * 4)}
.toc button{display:flex;width:100%;align-items:baseline;gap:.6em;padding:calc(var(--u) * 3.5) 0;font-family:var(--serif);font-size:calc(var(--u) * 15);text-align:left;border-bottom:1px dotted var(--rule)}
.toc button span:first-child{font-style:italic;color:var(--ink3);width:1.6em}
.toc button:hover{color:#C13584}

/* articles */
.art{min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 calc(var(--a) * 20);border-left:1px solid var(--rule);container-type:inline-size}
.art:last-child{padding-right:0}
.art.weighty{grid-column:span 4}
.art.brief{grid-column:span 3}
.byline{display:flex;align-items:center;gap:calc(var(--a) * 9);font-size:calc(var(--a) * 10);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.ring{flex:none;width:calc(var(--a) * 34);height:calc(var(--a) * 34);border-radius:50%;background:var(--grad);padding:calc(var(--a) * 2.2);display:grid}
.ring span{border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 calc(var(--a) * 2) var(--paper);display:grid;place-items:center;font-family:var(--sans);font-size:calc(var(--a) * 10.5);font-weight:700;letter-spacing:.04em;color:var(--ink);background-color:var(--tint);border:calc(var(--a) * 2) solid var(--paper)}
.rank{font-family:var(--serif);font-weight:900;font-size:calc(var(--a) * 96);line-height:.82;letter-spacing:-.04em;padding-bottom:.3em;margin-bottom:calc(var(--a) * 12 - .26em)}
.rank.first{background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;padding-right:.08em}
.rank sup{font-size:.2em;font-family:var(--sans);font-weight:700;letter-spacing:.16em;vertical-align:top;position:relative;top:.5em;margin-left:.3em;color:var(--ink3);-webkit-text-fill-color:var(--ink3)}
.ranked .ring{width:calc(var(--a) * 48);height:calc(var(--a) * 48)}
.ranked .ring span{font-size:calc(var(--a) * 14)}
.title{font-family:var(--serif);font-weight:700;font-size:calc(var(--a) * 23);line-height:1.08;letter-spacing:-.015em;margin-top:calc(var(--a) * 9);text-wrap:balance;padding-bottom:.25em;margin-bottom:-.25em}
.lede{font-size:calc(var(--a) * 12.6);line-height:1.5;color:#2c2830;margin-top:calc(var(--a) * 8);text-wrap:pretty}
.brief .title{font-size:calc(var(--a) * 30)}
.brief .lede{font-family:var(--serif);font-size:calc(var(--a) * 17);line-height:1.42}
.brief .numbers div{flex-direction:column;align-items:flex-start;gap:0;padding:calc(var(--a) * 8) 0}
.brief .numbers dt{font-size:calc(var(--a) * 10);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.brief .numbers dd{font-family:var(--serif);font-weight:900;font-size:calc(var(--a) * 46);line-height:1.1;padding-bottom:.25em;margin-bottom:-.2em;letter-spacing:-.02em;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.ranked .title{font-size:calc(var(--a) * 21)}

.bigstat{margin-top:calc(var(--a) * 10);margin-bottom:calc(var(--a) * -14);display:flex;align-items:baseline;gap:calc(var(--a) * 10)}
.bigstat b{font-family:var(--serif);font-weight:900;font-size:calc(var(--a) * 58);line-height:.9;letter-spacing:-.03em;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .06em .3em 0}
.bigstat span{font-size:calc(var(--a) * 10);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink2)}

.numbers{margin-top:calc(var(--a) * 10);border-top:1px solid var(--ink)}
.numbers h5,.talk h5{font-size:calc(var(--a) * 9);letter-spacing:.22em;text-transform:uppercase;font-weight:700;padding:calc(var(--a) * 5) 0 calc(var(--a) * 2)}
.numbers div{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding:calc(var(--a) * 3.5) 0;border-bottom:1px dotted var(--rule);font-size:calc(var(--a) * 11.5)}
.numbers dt{color:var(--ink2)}
.numbers dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@container (max-width:215px){
  .numbers div{flex-direction:column;gap:0;align-items:flex-start}
  .numbers dt{font-size:calc(var(--a) * 9.5);letter-spacing:.12em;text-transform:uppercase}
  .numbers dd{text-align:left;font-family:var(--serif);font-size:calc(var(--a) * 15)}
}

.news{margin-top:calc(var(--a) * 11);padding:calc(var(--a) * 1.5);background:var(--gradrule);border-radius:calc(var(--a) * 4)}
.news>div{background:var(--paper);border-radius:calc(var(--a) * 3);padding:calc(var(--a) * 10) calc(var(--a) * 13) calc(var(--a) * 10)}
.news h5{font-size:calc(var(--a) * 9);letter-spacing:.24em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:.7em}
.news h5::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--grad)}
.news p{font-family:var(--serif);font-style:italic;font-size:calc(var(--a) * 14.5);line-height:1.34;margin-top:calc(var(--a) * 5)}
.news footer{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-top:calc(var(--a) * 7);font-size:calc(var(--a) * 10);letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.news a{display:inline-flex;align-items:center;gap:.4em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);white-space:nowrap}
.news a:hover{color:#C13584;border-color:#C13584}
.news svg,.pill svg,.more svg{width:1em;height:1em}

/* the interview transcript, still chat bubbles */
.talk{margin-top:calc(var(--a) * 10);border-top:1px solid var(--ink)}
.sep{display:flex;align-items:center;gap:.8em;font-size:calc(var(--a) * 8.8);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:calc(var(--a) * 6) 0 calc(var(--a) * 3)}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--rule)}
.from{font-size:calc(var(--a) * 9);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:calc(var(--a) * 4) 0 calc(var(--a) * 1);color:var(--ink2);display:flex;gap:.5em;align-items:center}
.from.me{justify-content:flex-end}
.from.other{color:#C13584}
.from.other::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--grad)}
.row{display:flex;align-items:flex-end;gap:calc(var(--a) * 6);padding:calc(var(--a) * 1.6) 0}
.row.me{flex-direction:row-reverse}
.row .who{flex:none;width:calc(var(--a) * 22);font-size:calc(var(--a) * 8.5);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-bottom:calc(var(--a) * 5)}
.row.me .who{text-align:right}
.bub{max-width:82%;padding:calc(var(--a) * 5.5) calc(var(--a) * 11);border-radius:calc(var(--a) * 15);font-size:calc(var(--a) * 12);line-height:1.34;background:#ebe9e5;color:var(--ink);overflow-wrap:anywhere}
.row.them .bub{border-bottom-left-radius:calc(var(--a) * 4)}
.row.me .bub{background:var(--gradbub);color:#fff;border-bottom-right-radius:calc(var(--a) * 4)}
.row.key{margin:calc(var(--a) * 1.5) 0;padding:calc(var(--a) * 4) calc(var(--a) * 6);background:linear-gradient(90deg,rgba(252,175,69,.34),rgba(225,48,108,.17) 55%,rgba(131,58,180,.13));border-radius:calc(var(--a) * 3)}
.row.key.me{background:linear-gradient(270deg,rgba(252,175,69,.34),rgba(225,48,108,.17) 55%,rgba(131,58,180,.13))}
.row.key .bub{font-weight:500}
.row.key.them .bub{background:#fff;box-shadow:0 0 0 1px rgba(193,53,132,.35)}
.more{margin-top:calc(var(--a) * 4);font-size:calc(var(--a) * 10);letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:.4em;align-self:flex-start;border-bottom:1px solid var(--rule);padding-bottom:1px}
.more:hover{color:#C13584}

.pill{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:.7em;border:1px solid var(--ink);border-radius:99px;padding:calc(var(--a) * 7) calc(var(--a) * 15);font-size:calc(var(--a) * 11.5);font-weight:600;letter-spacing:.02em;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:#fff}
.pillwrap{margin-top:auto;padding-top:calc(var(--a) * 10);display:flex}

/* single feature article: text and transcript side by side */
.solo .art{display:grid;grid-template-columns:1fr 1.1fr;column-gap:calc(var(--a) * 28);grid-template-rows:auto auto auto 1fr;align-content:start}
.solo .art>*{grid-column:1}
.solo .art .talk{grid-column:2;grid-row:1 / -1;margin-top:0;align-self:center;--a:calc(var(--u) * var(--k,1) * 1.4)}
.solo .title{font-size:calc(var(--a) * 40)}
.solo .lede{font-family:var(--serif);font-size:calc(var(--a) * 15.5);line-height:1.45}
.solo .pillwrap{align-self:end}

/* modals */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,16,18,.42);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{width:min(560px,92vw);max-height:88dvh;overflow:auto;background:var(--paper);border-radius:18px;box-shadow:0 30px 80px rgba(18,16,18,.35);transform:translateY(14px);transition:transform .3s cubic-bezier(.22,.7,.2,1);position:relative}
.modal.open .sheet{transform:none}
.sheet::before{content:"";display:block;height:6px;background:var(--gradrule);border-radius:18px 18px 0 0}
.sheet .in{padding:22px 28px 26px}
.sheet .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.sheet h3{font-family:var(--serif);font-size:30px;line-height:1.08;letter-spacing:-.015em;margin-top:6px;padding-right:36px}
.sheet p.b{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--ink2);margin-top:10px}
.sheet textarea{width:100%;min-height:130px;margin-top:16px;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;font:400 15px/1.5 var(--sans);color:var(--ink);background:#fff;resize:vertical;outline:none}
.sheet textarea:focus{border-color:#C13584;box-shadow:0 0 0 3px rgba(193,53,132,.14)}
.sheet .btns{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.sheet .btns button{border-radius:99px;padding:10px 20px;font-size:13px;font-weight:600;border:1px solid var(--ink)}
.sheet .btns .go{background:var(--gradbub);color:#fff;border-color:transparent}
.sheet .btns [disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.sheet .btns small{font-size:11px;color:var(--ink3);margin-left:auto}
.x{position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;background:var(--paper)}
.x:hover{border-color:var(--ink)}
.x svg{width:14px;height:14px}
.cover{margin-top:16px;border-radius:14px;background:var(--grad);color:#fff;padding:22px 24px}
.cover .k{color:rgba(255,255,255,.85)}
.cover h3{font-size:40px;padding:0}
.cover p{font-family:var(--serif);font-size:15px;line-height:1.45;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.cover dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:16px;border-top:1px solid rgba(255,255,255,.5);padding-top:14px}
.cover dt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.9}
.cover dd{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.15}
.sheet .talk{--a:1.12px;border-top:1px solid var(--ink);margin-top:16px}

#overflow-report{position:fixed;left:0;bottom:0;z-index:99;font:10px monospace;background:#fff;max-width:100vw;white-space:pre-wrap}

@media (max-width:900px){
  :root{--u:1px}
  body{overflow:auto}
  #stage{position:static;min-height:100dvh;grid-template-columns:10px 1fr 0}
  .edge{display:none}.spine span,.spine svg{display:none}
  #pages{overflow:visible}
  .page{position:static;display:none;grid-template-columns:1fr;row-gap:24px;padding:20px 16px}
  .page.active{display:grid}
  .opener,.articles,.page.wideopen .opener,.page.wideopen .articles{grid-column:1}
  .articles{grid-auto-flow:row;row-gap:28px;--k:1.1!important}
  .art,.art.weighty,.art.brief{grid-column:1;border-left:0;border-top:1px solid var(--rule);padding:20px 0 0}
  .solo .art{display:flex}
  .pull,.toc{margin-top:20px}.pillwrap{margin-top:14px}
  .running,.folio{padding-inline:16px}.folio span:nth-child(2){display:none}
  .headline,.wideopen .headline{font-size:44px}
}
</style>
</head>

const dayFormat = new Intl.DateTimeFormat("en-US", {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});
const timeFormat = new Intl.DateTimeFormat("en-US", {hour:"numeric", minute:"2-digit", timeZone:"UTC"});

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function initials(name) {
  return name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
}
function ring(name) {
  const node = el("span", "ring");
  node.append(el("span", "", initials(name)));
  return node;
}
function cardsOf(page) {
  const cards = DATA.cards.filter(c => c.kind === page.kind);
  if (cards.some(c => c.rank != null)) return {all: cards, shown: cards.sort((a, b) => a.rank - b.rank)};
  const sorted = cards.sort((a, b) => b.score - a.score);
  return {all: sorted, shown: sorted.slice(0, maxCards)};
}

function heroOf(page, all, shown) {
  const stat = page.hero === "stat" && shown[0] && shown[0].stats.find(s => /^\d[\d,.]{0,5}$/.test(s.value));
  if (stat) return {value: stat.value, caption: stat.label + " · " + shown[0].friend.name};
  const extra = all.length > shown.length ? ", top " + shown.length + " printed here" : "";
  return {value: String(all.length), caption: page.noun + extra};
}
function pullQuoteOf(shown) {
  const card = shown.find(c => c.evidence.some(m => m.isKey));
  if (!card) return null;
  const keys = card.evidence.filter(m => m.isKey);
  const fitting = keys.filter(m => m.text.length <= 90).sort((a, b) => b.text.length - a.text.length);
  return fitting[0] || keys[0];
}
function speaker(message) {
  return message.isFromOwner ? "You" : message.sender;
}

function renderOpener(page, index, all, shown) {
  const opener = el("section", "opener");
  opener.append(el("div", "kicker", page.kicker));
  const headline = el("h1", "headline");
  headline.innerHTML = page.headline;
  const hero = heroOf(page, all, shown);
  const heroBox = el("div", "hero");
  heroBox.append(el("div", "num" + (hero.value.length > 3 ? " long" : ""), hero.value), el("div", "cap", hero.caption));
  opener.append(headline, el("p", "standfirst", page.standfirst), heroBox);
  const quote = pullQuoteOf(shown);
  opener.append(quote ? renderPullQuote(quote) : renderContents(index));
  return opener;
}
function renderPullQuote(message) {
  const pull = el("figure", "pull");
  pull.append(el("span", "mark", "“"), el("blockquote", "", message.text));
  const where = message.isFromOwner ? "to " + message.threadName : "to you";
  pull.append(el("figcaption", "by", speaker(message) + ", " + where + " · " + dayFormat.format(new Date(message.timestamp))));
  return pull;
}
function renderContents(current) {
  const toc = el("nav", "toc");
  toc.append(el("h4", "", "In this issue"));
  PAGES.forEach((page, i) => {
    if (i === current) return;
    const item = el("button");
    item.append(el("span", "", String(i + 1).padStart(2, "0")), el("span", "", page.name));
    item.addEventListener("click", () => go(i));
    toc.append(item);
  });
  return toc;
}

function shownMessages(evidence) {
  if (evidence.length <= maxMessages) return evidence;
  const keyIndexes = evidence.map((m, i) => m.isKey ? i : -1).filter(i => i >= 0);
  if (!keyIndexes.length) return evidence.slice(0, maxMessages);
  const distance = i => Math.min(...keyIndexes.map(k => Math.abs(k - i)));
  const fillers = evidence.map((m, i) => i).filter(i => !evidence[i].isKey).sort((a, b) => distance(a) - distance(b) || a - b);
  const chosen = new Set([...keyIndexes, ...fillers.slice(0, Math.max(0, maxMessages - keyIndexes.length))]);
  return evidence.filter((m, i) => chosen.has(i));
}
function needsSeparator(previous, message) {
  if (!previous) return true;
  const a = new Date(previous.timestamp), b = new Date(message.timestamp);
  return a.toISOString().slice(0, 10) !== b.toISOString().slice(0, 10) || (b - a) >= gapHours * 3600000;
}
function renderMessage(message, previous, card) {
  const nodes = [];
  const date = new Date(message.timestamp);
  const isBreak = needsSeparator(previous, message);
  if (isBreak) nodes.push(el("div", "sep", dayFormat.format(date) + " · " + timeFormat.format(date)));
  const isOtherChat = message.threadName !== card.friend.name;
  const hasOtherChats = card.evidence.some(m => m.threadName !== card.friend.name);
  if (hasOtherChats && (isBreak || previous.threadName !== message.threadName)) {
    const label = isOtherChat ? "From a different chat: yours with " + message.threadName : "From your chat with " + message.threadName;
    nodes.push(el("div", "from" + (isOtherChat ? " other" : "") + (message.isFromOwner ? " me" : ""), label));
  }
  const row = el("div", "row " + (message.isFromOwner ? "me" : "them") + (message.isKey ? " key" : ""));
  const isRunStart = isBreak || previous.isFromOwner !== message.isFromOwner;
  row.append(el("span", "who", isRunStart ? (message.isFromOwner ? "You" : initials(message.sender)) : ""), el("div", "bub", message.text));
  nodes.push(row);
  return nodes;
}
function renderTranscript(card, messages) {
  const talk = el("section", "talk");
  talk.append(el("h5", "", "The transcript"));
  messages.forEach((message, i) => talk.append(...renderMessage(message, messages[i - 1], card)));
  return talk;
}

function renderStats(stats) {
  const list = el("dl", "numbers");
  list.append(el("h5", "", "By the numbers"));
  stats.forEach(stat => {
    const line = el("div");
    line.append(el("dt", "", stat.label), el("dd", "", stat.value));
    list.append(line);
  });
  return list;
}
function renderNews(context) {
  const box = el("aside", "news"), inner = el("div");
  inner.append(el("h5", "", "In the news · why now"), el("p", "", context.text));
  const credit = el("footer");
  const date = dayFormat.format(new Date(context.date + "T00:00:00Z"));
  credit.append(el("span", "", context.source + " · " + date));
  const link = el("a");
  link.href = context.url; link.target = "_blank"; link.rel = "noopener";
  link.innerHTML = "Read the story " + ARROW_OUT;
  credit.append(link);
  inner.append(credit);
  box.append(inner);
  return box;
}
function renderHead(card) {
  const nodes = [];
  if (card.rank != null) {
    const rank = el("div", "rank" + (card.rank === 1 ? " first" : ""), String(card.rank));
    nodes.push(rank);
  }
  const byline = el("div", "byline");
  byline.append(ring(card.friend.name));
  if (card.title !== card.friend.name) byline.append(el("span", "", "With " + card.friend.name));
  nodes.push(byline, el("h2", "title", card.title), el("p", "lede", card.body));
  return nodes;
}
function renderArticle(card) {
  const style = KIND_STYLE[card.kind] || {};
  const article = el("article", "art" + (card.rank != null ? " ranked" : ""));
  article.append(...renderHead(card));
  let stats = card.stats || [];
  if (style.hasBigStat && stats.length) {
    const big = el("div", "bigstat");
    big.append(el("b", "", stats[0].value), el("span", "", stats[0].label));
    article.children[article.children.length - 2].after(big);
    stats = stats.slice(1);
  }
  if (card.context) article.append(renderNews(card.context));
  if (stats.length) article.append(renderStats(stats));
  if (card.evidence.length) article.append(...renderEvidence(card));
  if (card.action) article.append(renderAction(card));
  return article;
}
function renderEvidence(card) {
  const messages = shownMessages(card.evidence);
  const nodes = [renderTranscript(card, messages)];
  const omitted = card.evidence.length - messages.length;
  if (!omitted) return nodes;
  const more = el("button", "more");
  more.innerHTML = "+" + omitted + " more in the full transcript " + ARROW;
  more.addEventListener("click", () => openConversation(card));
  nodes[0].append(more);
  return nodes;
}
function renderAction(card) {
  const wrap = el("div", "pillwrap");
  const pill = el("button", "pill");
  pill.innerHTML = "<span></span>" + ARROW;
  pill.firstChild.textContent = card.action.label;
  pill.addEventListener("click", () => openAction(card));
  wrap.append(pill);
  return wrap;
}

function renderPage(page, index) {
  const {all, shown} = cardsOf(page);
  const count = shown.length;
  const section = el("section", "page" + (count <= 2 ? " wideopen" : "") + (count === 1 ? " solo" : ""));
  section.dataset.count = count;
  const articles = el("div", "articles");
  shown.forEach(card => articles.append(renderArticle(card)));
  if (count === 2) weighColumns(articles, shown);
  section.append(renderOpener(page, index, all, shown), articles);
  return section;
}
function weighColumns(articles, shown) {
  const hasUneven = shown.some(c => c.evidence.length) && shown.some(c => !c.evidence.length);
  if (!hasUneven) return;
  articles.style.gridAutoColumns = "auto";
  articles.style.gridTemplateColumns = shown.map(c => c.evidence.length ? "1.45fr" : "1fr").join(" ");
  [...articles.children].forEach((node, i) => { if (!shown[i].evidence.length) node.classList.add("brief"); });
}

const startScale = {1: 1.5, 2: 1.3, 3: 1.25, 5: 1.4};
function isOverflowing(node) {
  return node.scrollHeight > node.clientHeight + 1 || node.scrollWidth > node.clientWidth + 1;
}
function fit(section) {
  const articles = section.querySelector(".articles");
  const boxes = [articles, ...articles.children];
  let scale = startScale[section.dataset.count] || 1;
  articles.style.setProperty("--k", scale);
  while (scale > 0.7 && boxes.some(isOverflowing)) {
    scale -= 0.02;
    articles.style.setProperty("--k", scale.toFixed(2));
  }
}
function fitAll() {
  if (innerWidth <= 900) return;
  fit(pagesRoot.children[current]);
}

let current = 0;
const pagesRoot = document.getElementById("pages");
const segs = document.getElementById("segs");
function go(index) {
  if (index < 0 || index >= PAGES.length) return;
  [...pagesRoot.children].forEach((node, i) => {
    node.classList.toggle("back", index < current);
    node.classList.toggle("active", i === index);
  });
  current = index;
  fitAll();
  [...segs.children].forEach((node, i) => node.classList.toggle("on", i <= index));
  document.getElementById("section").textContent = PAGES[index].name;
  document.getElementById("count").textContent = (index + 1) + " / " + PAGES.length;
  document.getElementById("pg").textContent = "p. " + String(index + 1).padStart(2, "0");
  if (location.hash.includes("&")) return;
  history.replaceState(null, "", "#" + (index + 1));
}

const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
function openModal(...nodes) {
  sheet.replaceChildren(...nodes);
  modal.classList.add("open");
}
function closeModal() { modal.classList.remove("open"); }
function copyButton(label, text) {
  const button = el("button", "go", label);
  button.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text()); button.textContent = "Copied"; }
    catch (error) { console.warn("clipboard unavailable", error); button.textContent = "Press Cmd+C to copy"; }
    setTimeout(() => button.textContent = label, 1600);
  });
  return button;
}
function openAction(card) {
  if (card.action.draft == null) return openShare(card);
  const area = el("textarea");
  area.value = card.action.draft;
  const buttons = el("div", "btns");
  const regenerate = el("button", "", "Regenerate");
  regenerate.disabled = true; regenerate.title = "Needs the live backend, coming soon";
  buttons.append(copyButton("Copy message", () => area.value), regenerate, el("small", "", "Edit freely, then paste it into your chat."));
  openModal(el("div", "k", card.action.label + " · a draft for " + card.friend.name), el("h3", "", card.title), area, buttons);
  area.focus();
}
function openShare(card) {
  const cover = el("div", "cover");
  const stats = el("dl");
  card.stats.forEach(stat => { const cell = el("div"); cell.append(el("dt", "", stat.label), el("dd", "", stat.value)); stats.append(cell); });
  cover.append(el("div", "k", "Your DMs, in review"), el("h3", "", card.title), el("p", "", card.body));
  if (card.stats.length) cover.append(stats);
  const summary = () => [card.title, card.body, ...card.stats.map(s => s.label + ": " + s.value)].join("\n");
  const buttons = el("div", "btns");
  buttons.append(copyButton("Copy summary", summary), el("small", "", "Made for Instagram DMs."));
  openModal(el("div", "k", card.action.label), cover, buttons);
}
function openConversation(card) {
  openModal(el("div", "k", "The full transcript · " + card.friend.name), el("h3", "", card.title), renderTranscript(card, card.evidence));
}

function isClipCandidate(node) {
  if (node.closest(".modal") || node.closest(".page:not(.active)")) return false;
  if (!node.clientHeight && !node.clientWidth) return false;
  return getComputedStyle(node).visibility !== "hidden";
}
function describe(node) {
  return node.tagName.toLowerCase() + (node.className ? "." + String(node.className).split(" ").join(".") : "") + ": " + node.textContent.trim().slice(0, 30);
}
function writeReport() {
  const nodes = [...document.querySelectorAll("#stage, #stage *")].filter(isClipCandidate);
  const report = {
    page: current + 1,
    viewport: [innerWidth, innerHeight],
    pageScrolls: document.documentElement.scrollHeight > innerHeight + 1,
    clipped: nodes.filter(isOverflowing).map(describe)
  };
  const pre = el("pre", "", JSON.stringify(report));
  pre.id = "overflow-report";
  document.body.append(pre);
}

const isCheck = /&check$/.test(location.hash);
function bind() {
  document.getElementById("prev").addEventListener("click", () => go(current - 1));
  document.getElementById("next").addEventListener("click", () => go(current + 1));
  document.getElementById("close").addEventListener("click", closeModal);
  modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
  pagesRoot.addEventListener("click", event => {
    if (event.target.closest("button, a, textarea, .talk, .news")) return;
    const x = event.clientX / innerWidth;
    if (x < 0.16) go(current - 1);
    if (x > 0.86) go(current + 1);
  });
  addEventListener("keydown", event => {
    if (event.key === "Escape") return closeModal();
    if (modal.classList.contains("open")) return;
    if (event.key === "ArrowRight") go(current + 1);
    if (event.key === "ArrowLeft") go(current - 1);
  });
  addEventListener("resize", fitAll);
}
async function start() {
  PAGES.forEach((page, i) => {
    pagesRoot.append(renderPage(page, i));
    const seg = el("button", "seg");
    seg.style.setProperty("--i", i);
    seg.title = page.name;
    seg.addEventListener("click", () => go(i));
    segs.append(seg);
  });
  document.getElementById("issue").textContent = "The Friendship Issue · " + new Date(DATA.generatedAt).getUTCFullYear();
  bind();
  const requested = parseInt(location.hash.slice(1), 10);
  go(requested >= 1 && requested <= PAGES.length ? requested - 1 : 0);
  await document.fonts.ready;
  fitAll();
  if (isCheck) setTimeout(writeReport, 900);
  const demo = {"&sheet": ".pill", "&talk": ".more"};
  Object.keys(demo).filter(flag => location.hash.includes(flag)).forEach(flag => pagesRoot.children[current].querySelector(demo[flag])?.click());
}
start();
</script>
</body>
