<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglow · Your DMs, in review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B12;
  --ink: #F5F3FB;
  --ink-soft: rgba(245, 243, 251, .72);
  --ink-faint: rgba(245, 243, 251, .48);
  --line: rgba(255, 255, 255, .13);
  --glass: rgba(18, 17, 30, .62);
  --ig: linear-gradient(100deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D, #F56040, #F77737, #FCAF45, #FFDC80);
  --ig-warm: linear-gradient(115deg, #FFDC80 0%, #FCAF45 14%, #F56040 34%, #E1306C 54%, #C13584 68%, #833AB4 86%, #5851DB 100%);
  --ig-ring: conic-gradient(from 200deg, #FFDC80, #FCAF45, #F77737, #F56040, #FD1D1D, #E1306C, #C13584, #833AB4, #5851DB, #405DE6, #FFDC80);
  --display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --rail: 236px;
  --peek: 44px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid #FCAF45; outline-offset: 3px; }
svg { display: block; }

/* drifting mesh */
.mesh { position: fixed; inset: -20%; z-index: 0; filter: blur(80px) saturate(135%); pointer-events: none; }
.mesh i { position: absolute; border-radius: 50%; opacity: .95; animation: drift 38s ease-in-out infinite alternate; }
.mesh i:nth-child(1) { width: 46vw; height: 46vw; left: 4%; top: 2%; background: radial-gradient(circle, #5851DB 0, #5851DB 30%, transparent 70%); }
.mesh i:nth-child(2) { width: 40vw; height: 40vw; right: 6%; top: 8%; background: radial-gradient(circle, #C13584 0, #C13584 30%, transparent 70%); animation-duration: 46s; animation-delay: -12s; }
.mesh i:nth-child(3) { width: 38vw; height: 38vw; right: 18%; bottom: 0; background: radial-gradient(circle, #F56040 0, #F56040 30%, transparent 70%); animation-duration: 52s; animation-delay: -20s; opacity: .7; }
.mesh i:nth-child(4) { width: 30vw; height: 30vw; left: 22%; bottom: 6%; background: radial-gradient(circle, #833AB4 0, #833AB4 30%, transparent 70%); animation-duration: 42s; animation-delay: -30s; }
.mesh i:nth-child(5) { width: 22vw; height: 22vw; left: 48%; top: 30%; background: radial-gradient(circle, #FCAF45 0, #FCAF45 30%, transparent 70%); animation-duration: 60s; animation-delay: -8s; opacity: .5; }
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(7vw, -5vh, 0) scale(1.14); }
  100% { transform: translate3d(-6vw, 7vh, 0) scale(.94); }
}
.veil {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 95% at 68% 45%, rgba(11, 11, 18, .0), rgba(11, 11, 18, .62) 85%),
    linear-gradient(90deg, rgba(11, 11, 18, .70) 0, rgba(11, 11, 18, .30) 46%, rgba(11, 11, 18, .10) 100%);
}

.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }

/* rail */
.rail {
  display: flex; flex-direction: column; padding: 30px 22px 26px 30px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015));
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.03em; }
.brand-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ig-ring); display: grid; place-items: center; }
.brand-dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
.brand-sub { margin-top: 6px; font-size: 12px; color: var(--ink-faint); letter-spacing: .02em; }
.steps { position: relative; list-style: none; padding: 0; margin: auto 0; }
.steps-track, .steps-fill { position: absolute; left: 15px; top: 22px; width: 2px; border-radius: 2px; }
.steps-track { bottom: 22px; background: rgba(255, 255, 255, .12); }
.steps-fill { height: 0; background: linear-gradient(180deg, #FFDC80, #F56040, #E1306C, #833AB4, #405DE6); box-shadow: 0 0 12px rgba(225, 48, 108, .8); transition: height .7s var(--ease); }
.step { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 9px 0; text-align: left; color: var(--ink-faint); transition: color .3s; }
.step:hover { color: var(--ink); }
.step-node {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .02em;
  background: #15141f; border: 1px solid rgba(255, 255, 255, .16); transition: all .4s var(--ease);
}
.step-name { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
.step.is-done { color: var(--ink-soft); }
.step.is-done .step-node { border-color: rgba(225, 48, 108, .7); color: #FFDC80; }
.step.is-current { color: var(--ink); }
.step.is-current .step-node {
  border-color: transparent; color: #fff; transform: scale(1.12);
  background: linear-gradient(135deg, #F77737, #E1306C 55%, #833AB4);
  box-shadow: 0 0 0 4px rgba(225, 48, 108, .18), 0 0 26px rgba(225, 48, 108, .85);
}
.rail-foot { font-size: 11.5px; color: var(--ink-faint); line-height: 1.7; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 12px; }
.keys span { display: inline-flex; align-items: center; gap: 5px; }
kbd { font: 600 10.5px var(--text); min-width: 20px; padding: 2px 5px; text-align: center; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink-soft); }

/* main */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; cursor: default; }
.topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 26px 72px 0; font-size: 12.5px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.counter b { color: var(--ink); font-family: var(--display); font-weight: 600; }
.edge { position: absolute; top: 50%; z-index: 5; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--ink-soft); transition: all .3s var(--ease); }
.edge:hover { background: rgba(255, 255, 255, .16); color: #fff; transform: scale(1.08); }
.edge[disabled] { opacity: 0; pointer-events: none; }
.edge-prev { left: 14px; }
.edge-next { right: 14px; }

.pages { position: relative; flex: 1; min-height: 0; }
.page { display: none; height: 100%; padding: 12px 72px 40px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center; }
.page.is-active { display: grid; }

/* editorial column */
.editorial > * { animation: rise .8s var(--ease) both; }
.editorial > :nth-child(2) { animation-delay: .07s; }
.editorial > :nth-child(3) { animation-delay: .14s; }
.editorial > :nth-child(4) { animation-delay: .21s; }
.editorial > :nth-child(5) { animation-delay: .28s; }
@keyframes rise { from { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 30px), 14px, 0); } to { opacity: 1; transform: none; } }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.eyebrow::before { content: ""; width: 28px; height: 2px; border-radius: 2px; background: var(--ig); }
.headline {
  margin: 18px 0 22px; font-family: var(--display); font-weight: 800;
  font-size: clamp(52px, 6.4vw, 104px); line-height: .94; letter-spacing: -.055em;
  background: var(--ig-warm); -webkit-background-clip: text; background-clip: text; color: transparent;
  padding-bottom: .08em;
}
.lede { max-width: 30em; font-size: 17px; line-height: 1.55; color: var(--ink-soft); }
.hero { margin-top: 38px; padding-top: 26px; border-top: 1px solid var(--line); max-width: 430px; }
.hero-value { font-family: var(--display); font-weight: 700; letter-spacing: -.05em; line-height: 1; font-size: 112px; color: #fff; text-shadow: 0 0 60px rgba(225, 48, 108, .45); }
.hero-value[data-size="m"] { font-size: 76px; }
.hero-value[data-size="s"] { font-size: 50px; letter-spacing: -.04em; }
.hero-value.is-swapping { animation: swap .5s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.hero-label { margin-top: 12px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.hero-label em { font-style: normal; color: var(--ink-faint); letter-spacing: .04em; text-transform: none; font-weight: 500; font-size: 14px; }
.replay { margin-top: 28px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); font-weight: 600; font-size: 13.5px; }
.replay:hover { background: rgba(255, 255, 255, .14); }

/* showcase column */
.showcase { position: relative; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; animation: arrive .9s var(--ease) both .08s; }
@keyframes arrive { from { opacity: 0; transform: translate3d(calc(var(--dir, 1) * 70px), 0, 0) scale(.96); } to { opacity: 1; transform: none; } }

.glass {
  border: 1px solid var(--line); border-radius: 28px;
  background: linear-gradient(155deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .03) 42%, rgba(255, 255, 255, .06)), var(--glass);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 44px rgba(255, 255, 255, .035), 0 40px 90px -20px rgba(0, 0, 0, .7);
  backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
}

/* depth stack */
.deck { position: relative; width: min(100% - 64px, 580px); padding-top: calc(var(--peek) * (var(--n) - 1)); perspective: 1600px; }
.card {
  position: absolute; top: calc(var(--peek) * (var(--n) - 1)); left: 0; right: 0; height: calc(100% - var(--peek) * (var(--n) - 1));
  display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
  transform-origin: 50% 0;
  transform: translate3d(0, calc(var(--d) * var(--peek) * -1), 0) scale(calc(1 - var(--d) * .055));
  filter: brightness(calc(1 - var(--d) * .12));
  transition: transform .7s var(--ease), filter .7s var(--ease), box-shadow .7s;
}
.card:not(.is-front):hover { filter: brightness(1.1); }
.card.is-front {
  position: relative; top: 0; height: auto; cursor: default;
  max-height: calc(100vh - 150px - var(--peek) * (var(--n) - 1)); min-height: 300px;
  animation: forward .75s var(--ease);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), inset 0 0 44px rgba(255, 255, 255, .04), 0 50px 110px -20px rgba(0, 0, 0, .8), 0 0 80px -30px rgba(225, 48, 108, .55);
}
@keyframes forward {
  0% { transform: translate3d(0, calc(var(--peek) * -1), -120px) rotateX(10deg) scale(.94); }
  55% { transform: translate3d(0, 10px, 0) rotateX(-2deg) scale(1.01); }
  100% { transform: none; }
}
.card-tab { flex: none; display: flex; align-items: center; gap: 10px; width: 100%; height: var(--peek); padding: 0 22px; text-align: left; font-size: 13px; color: var(--ink-soft); border-bottom: 1px solid transparent; }
.card.is-front .card-tab { cursor: default; height: 58px; border-bottom-color: rgba(255, 255, 255, .08); }
.tab-who { font-weight: 700; color: var(--ink); white-space: nowrap; }
.tab-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-faint); }
.card.is-front .tab-title { visibility: hidden; }
.tab-idx { font-family: var(--display); font-size: 11.5px; letter-spacing: .08em; color: var(--ink-faint); }
.card-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 28px 24px; transition: opacity .4s; }
.card:not(.is-front) .card-main { opacity: 0; pointer-events: none; }
.card-title { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.12; letter-spacing: -.04em; text-wrap: balance; }
.card[data-kind="recap"] .card-title { font-size: 40px; background: var(--ig-warm); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 4px; }
.card-scroll {
  flex: 1; min-height: 0; overflow-y: auto; margin: 14px -10px 0; padding: 0 10px 26px;
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .22) transparent;
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 30px), transparent);
}
.card-body { color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
.card-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 16px; }
.foot-note { font-size: 12px; color: var(--ink-faint); }

.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 0; list-style: none; }
.stat { flex: 1 1 120px; padding: 10px 14px 11px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .09); background: rgba(255, 255, 255, .05); }
.stat-value { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.03em; color: #fff; }
.stat-label { margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.stat:only-child { flex: 0 1 auto; display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; border-radius: 999px; }
.stat:only-child .stat-label { order: -1; margin: 0; }

.cta {
  display: inline-flex; align-items: center; gap: 10px; padding: 13px 24px; border-radius: 999px;
  font-weight: 700; font-size: 14.5px; color: #fff; letter-spacing: -.005em;
  background: linear-gradient(100deg, #5851DB, #C13584 48%, #F56040 86%, #FCAF45);
  box-shadow: 0 10px 34px -8px rgba(225, 48, 108, .8), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.cta:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -8px rgba(225, 48, 108, .95), inset 0 1px 0 rgba(255, 255, 255, .35); }

/* why now */
.why { margin-top: 16px; }
.why-chip {
  display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px 7px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: #FFE7B0;
  border: 1px solid rgba(252, 175, 69, .55); background: rgba(252, 175, 69, .12);
  box-shadow: 0 0 22px rgba(252, 175, 69, .38), inset 0 0 12px rgba(252, 175, 69, .15);
}
.why-chip span { color: var(--ink-soft); font-weight: 500; letter-spacing: 0; }
.why-chip svg { transition: transform .4s var(--ease); }
.why.is-open .why-chip svg { transform: rotate(180deg); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: #FCAF45; box-shadow: 0 0 0 0 rgba(252, 175, 69, .7); animation: pulse 2s infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 10px rgba(252, 175, 69, 0); } }
.why-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease), margin .5s var(--ease); }
.why.is-open .why-panel { grid-template-rows: 1fr; margin-top: 10px; }
.why-inner { overflow: hidden; }
.why-link {
  display: block; padding: 14px 16px; border-radius: 18px; text-decoration: none; color: var(--ink);
  border: 1px solid transparent;
  background: linear-gradient(rgba(30, 24, 38, .92), rgba(30, 24, 38, .92)) padding-box, linear-gradient(120deg, #FFDC80, #F56040, #C13584) border-box;
}
.why-link:hover .why-go { text-decoration: underline; }
.why-text { font-size: 14.5px; line-height: 1.5; }
.why-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--ink-faint); }
.why-go { display: inline-flex; align-items: center; gap: 5px; color: #FFDC80; font-weight: 700; }

/* evidence */
.thread { display: flex; flex-direction: column; gap: 5px; margin-top: 18px; }
.day { align-self: center; margin: 10px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-faint); text-transform: uppercase; }
.day:first-child { margin-top: 0; }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; }
.msg.is-owner { align-self: flex-end; align-items: flex-end; }
.msg-from { margin: 6px 6px 3px; font-size: 11px; font-weight: 600; color: var(--ink-faint); }
.msg-from b { color: #FFDC80; font-weight: 700; }
.bubble {
  padding: 9px 15px 10px; border-radius: 22px; font-size: 14.5px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere;
  border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .10);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom-left-radius: 7px;
}
.is-owner .bubble { border-color: transparent; border-radius: 22px; border-bottom-right-radius: 7px; color: #fff; background: linear-gradient(135deg, #405DE6, #833AB4 52%, #C13584); backdrop-filter: none; -webkit-backdrop-filter: none; }
.msg.is-key .bubble {
  border: 1.5px solid transparent; font-weight: 600; color: #fff;
  background: linear-gradient(rgba(42, 34, 58, .94), rgba(42, 34, 58, .94)) padding-box, var(--ig-warm) border-box;
  box-shadow: 0 0 26px -2px rgba(225, 48, 108, .6), 0 0 0 4px rgba(252, 175, 69, .07);
}
.msg.is-key.is-owner .bubble {
  background: linear-gradient(135deg, #5851DB, #C13584 55%, #F56040) padding-box, linear-gradient(120deg, #FFDC80, #fff 50%, #FCAF45) border-box;
  box-shadow: 0 0 28px -2px rgba(245, 96, 64, .7), 0 0 0 4px rgba(252, 175, 69, .08);
}

/* pager */
.pager { position: absolute; left: -26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pager button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink-soft); }
.pager button:hover { background: rgba(255, 255, 255, .16); color: #fff; }
.pager-dots { display: flex; flex-direction: column; gap: 7px; }
.pager-dots i { width: 6px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .25); transition: all .4s var(--ease); }
.pager-dots i.is-on { height: 22px; background: linear-gradient(180deg, #FCAF45, #E1306C, #833AB4); box-shadow: 0 0 10px rgba(225, 48, 108, .8); }

/* avatars */
.avatar { --s: 28px; --rw: 2px; --gap: 2px; position: relative; flex: none; width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; }
.avatar::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ig-ring); }
.avatar-core {
  position: relative; display: grid; place-items: center; border-radius: 50%;
  width: calc(100% - 2 * var(--rw)); height: calc(100% - 2 * var(--rw));
  border: var(--gap) solid #0f0e18; background: linear-gradient(160deg, #2b2740, #17152a);
  font-family: var(--display); font-weight: 700; font-size: calc(var(--s) * .34); letter-spacing: -.02em; color: #fff;
}
.avatar.is-live::before { animation: spin 5s linear infinite; }
.avatar.is-live::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: var(--ig-ring); filter: blur(26px); opacity: .55; z-index: -1; animation: spin 5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* podium */
.people { width: min(100%, 620px); display: flex; flex-direction: column; gap: 14px; }
.podium { display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: end; gap: 12px; }
.pod { display: flex; flex-direction: column; align-items: center; text-align: center; border-radius: 24px; transition: transform .4s var(--ease); }
.pod:hover { transform: translateY(-4px); }
.pod .avatar { --s: 92px; --rw: 4px; --gap: 4px; }
.pod[data-rank="1"] .avatar { --s: 140px; --rw: 6px; --gap: 5px; }
.pod-name { margin-top: 12px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -.03em; }
.pod[data-rank="1"] .pod-name { font-size: 21px; }
.pod-stat { font-size: 12.5px; color: var(--ink-soft); }
.pedestal { position: relative; width: 100%; margin-top: 12px; height: var(--h); border-radius: 20px 20px 8px 8px; display: grid; place-items: center; overflow: hidden; transition: box-shadow .4s, border-color .4s; }

const maxCards = 4;
const breakGapMs = 4 * 60 * 60 * 1000;
const dayFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });
const timeFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', hour: 'numeric', minute: '2-digit' });

const state = { page: 0, views: [], sheetCard: null };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) setAttr(el, key, value);
  el.append(...kids.filter(Boolean));
  return el;
}

function setAttr(el, key, value) {
  if (key === 'class') return void (el.className = value);
  if (key === 'text') return void (el.textContent = value);
  if (key === 'html') return void (el.innerHTML = value);
  if (key.startsWith('on')) return void el.addEventListener(key.slice(2), value);
  el.setAttribute(key, value);
}

function initials(name) {
  return name.split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
}

function avatar(name, isLive) {
  return h('span', { class: 'avatar' + (isLive ? ' is-live' : ''), 'aria-hidden': 'true' },
    h('span', { class: 'avatar-core', text: initials(name) }));
}

function pad(number) {
  return String(number).padStart(2, '0');
}

function cardsFor(kind) {
  const cards = DATA.cards.filter(card => card.kind === kind);
  if (kind === 'your_people') return cards.sort((a, b) => a.rank - b.rank);
  return cards.sort((a, b) => b.score - a.score).slice(0, maxCards);
}

/* ---------- shared card parts ---------- */

function buildStats(stats) {
  if (!stats.length) return null;
  return h('ul', { class: 'stats' }, ...stats.map(stat =>
    h('li', { class: 'stat' },
      h('div', { class: 'stat-value', text: stat.value }),
      h('div', { class: 'stat-label', text: stat.label }))));
}

function buildContext(context) {
  if (!context) return null;
  const wrap = h('div', { class: 'why' });
  const chip = h('button', { class: 'why-chip', type: 'button', 'aria-expanded': 'false' },
    h('i', { class: 'pulse' }), 'Why now', h('span', { text: context.source }), h('span', { html: ICONS.down }));
  chip.addEventListener('click', () => {
    const isOpen = wrap.classList.toggle('is-open');
    chip.setAttribute('aria-expanded', String(isOpen));
  });
  const link = h('a', { class: 'why-link', href: context.url, target: '_blank', rel: 'noopener noreferrer' },
    h('div', { class: 'why-text', text: context.text }),
    h('div', { class: 'why-meta' },
      h('span', { text: context.source + ' · ' + dayFormat.format(new Date(context.date)) }),
      h('span', { class: 'why-go' }, 'Read the story', h('span', { html: ICONS.out }))));
  wrap.append(chip, h('div', { class: 'why-panel' }, h('div', { class: 'why-inner' }, link)));
  return wrap;
}

function isBreak(previous, current) {
  if (!previous) return true;
  const before = new Date(previous.timestamp);
  const after = new Date(current.timestamp);
  if (dayFormat.format(before) !== dayFormat.format(after)) return true;
  return after - before >= breakGapMs;
}

function buildMessage(message, card, isLabelled) {
  const classes = ['msg', message.isFromOwner ? 'is-owner' : '', message.isKey ? 'is-key' : ''];
  const row = h('div', { class: classes.join(' ').trim() });
  if (isLabelled) {
    const isElsewhere = message.threadName !== card.friend.name;
    row.append(h('div', { class: 'msg-from' },
      message.sender + (isElsewhere ? ', in another chat: ' : ', in chat with '),
      h('b', { text: message.threadName })));
  }
  row.append(h('div', { class: 'bubble', text: message.text }));
  return row;
}

function buildEvidence(card) {
  if (!card.evidence.length) return null;
  const isLabelled = card.evidence.some(message => message.threadName !== card.friend.name);
  const thread = h('div', { class: 'thread' });
  card.evidence.forEach((message, index) => {
    if (isBreak(card.evidence[index - 1], message)) {
      const when = new Date(message.timestamp);
      thread.append(h('div', { class: 'day', text: dayFormat.format(when) + ' · ' + timeFormat.format(when) }));
    }
    thread.append(buildMessage(message, card, isLabelled));
  });
  return thread;
}

function buildAction(card) {
  if (!card.action) return null;
  const button = h('button', { class: 'cta', type: 'button' }, h('span', { html: ICONS.send }), card.action.label);
  button.addEventListener('click', () => openSheet(card));
  const note = card.action.draft === null ? 'Opens a shareable summary' : 'Opens an editable draft';
  return h('div', { class: 'card-foot' }, button, h('span', { class: 'foot-note', text: note }));
}

function buildCard(card, index, total) {
  const tab = h('button', { class: 'card-tab', type: 'button' },
    avatar(card.friend.name),
    h('span', { class: 'tab-who', text: card.friend.name }),
    h('span', { class: 'tab-title', text: card.title }),
    h('span', { class: 'tab-idx', text: pad(index + 1) + ' / ' + pad(total) }));
  const scroll = h('div', { class: 'card-scroll' },
    h('p', { class: 'card-body', text: card.body }),
    buildStats(card.stats), buildContext(card.context), buildEvidence(card));
  const main = h('div', { class: 'card-main' },
    h('h2', { class: 'card-title', text: card.title }), scroll, buildAction(card));
  return h('article', { class: 'card glass', 'data-kind': card.kind, 'data-id': card.id }, tab, main);
}

/* ---------- editorial column ---------- */

function buildEditorial(page, pageIndex, isLast) {
  const hero = h('div', { class: 'hero' },
    h('div', { class: 'hero-value' }), h('div', { class: 'hero-label' }));
  const column = h('section', { class: 'editorial' },
    h('div', { class: 'eyebrow', text: 'Chapter ' + pad(pageIndex + 1) + ' of ' + pad(PAGES.length) }),
    h('h1', { class: 'headline', text: page.headline }),
    h('p', { class: 'lede', text: page.lede }),
    hero);
  if (isLast) column.append(h('button', { class: 'replay', type: 'button', onclick: () => showPage(0) },
    h('span', { html: ICONS.redo }), 'Watch it again'));
  return column;
}

function heroSize(value) {
  if (value.length <= 5) return 'l';
  return value.length <= 9 ? 'm' : 's';
}

function updateHero(view, card) {
  const stat = card && card.stats[0];
  const value = stat ? stat.value : String(view.cards.length);
  const valueEl = view.el.querySelector('.hero-value');
  const labelEl = view.el.querySelector('.hero-label');
  valueEl.textContent = value;
  valueEl.dataset.size = heroSize(value);
  labelEl.textContent = stat ? stat.label + ' ' : view.page.unit;
  if (stat) labelEl.append(h('em', { text: '· ' + card.friend.name }));
  replay(valueEl);
}

function replay(el) {
  el.classList.remove('is-swapping');
  void el.offsetWidth;
  el.classList.add('is-swapping');
}

/* ---------- depth stack ---------- */

function buildDeck(view) {
  const total = view.cards.length;
  const deck = h('div', { class: 'deck', style: '--n:' + total });
  view.cardEls = view.cards.map((card, index) => buildCard(card, index, total));
  view.cardEls.forEach((el, index) => el.addEventListener('click', () => selectCard(view, index)));
  deck.append(...view.cardEls);
  const showcase = h('section', { class: 'showcase' }, deck);
  if (total > 1) showcase.append(buildPager(view));
  return showcase;
}

function buildPager(view) {
  view.dots = view.cards.map(() => h('i'));
  return h('div', { class: 'pager' },
    h('button', { type: 'button', 'aria-label': 'Previous card', html: ICONS.up, onclick: () => stepCard(-1) }),
    h('div', { class: 'pager-dots' }, ...view.dots),
    h('button', { type: 'button', 'aria-label': 'Next card', html: ICONS.down, onclick: () => stepCard(1) }));
}

function layoutDeck(view) {
  const total = view.cards.length;
  view.cardEls.forEach((el, index) => {
    const depth = (index - view.active + total) % total;
    el.style.setProperty('--d', depth);
    el.style.zIndex = total - depth;
    el.classList.toggle('is-front', depth === 0);
    el.querySelector('.card-tab').tabIndex = depth === 0 ? -1 : 0;
  });
  (view.dots || []).forEach((dot, index) => dot.classList.toggle('is-on', index === view.active));
}

/* ---------- your people podium ---------- */

function firstStat(card) {
  return card.stats[0] ? card.stats[0].value + ' ' + card.stats[0].label.toLowerCase() : '';
}

function buildPod(view, index, height) {
  const card = view.cards[index];
  if (!card) return h('span');
  const pod = h('button', { class: 'pod', type: 'button', 'data-rank': card.rank, onclick: () => selectCard(view, index) },
    avatar(card.friend.name, index === 0),
    h('span', { class: 'pod-name', text: card.title }),
    h('span', { class: 'pod-stat', text: firstStat(card) }),
    h('span', { class: 'pedestal glass', style: '--h:' + height + 'px' }, h('b', { text: String(card.rank) })));
  view.cardEls[index] = pod;
  return pod;
}

function buildRunner(view, index) {
  const card = view.cards[index];
  const runner = h('button', { class: 'runner glass', type: 'button', onclick: () => selectCard(view, index) },
    h('span', { class: 'runner-rank', text: String(card.rank) }),
    avatar(card.friend.name),
    h('span', {}, h('span', { class: 'runner-name', text: card.title }), h('br'), h('span', { class: 'runner-stat', text: firstStat(card) })));
  view.cardEls[index] = runner;
  return runner;
}

function buildPeople(view) {
  view.cardEls = [];
  view.panel = h('div', { class: 'person glass', 'aria-live': 'polite' });
  const podium = h('div', { class: 'podium' }, buildPod(view, 1, 92), buildPod(view, 0, 132), buildPod(view, 2, 68));
  const runners = h('div', { class: 'runners' }, ...view.cards.slice(3).map((card, offset) => buildRunner(view, offset + 3)));
  return h('section', { class: 'showcase' }, h('div', { class: 'people' }, podium, runners, view.panel));
}

function layoutPeople(view) {
  const card = view.cards[view.active];
  view.cardEls.forEach((el, index) => el.classList.toggle('is-selected', index === view.active));
  view.panel.replaceChildren(
    h('div', { class: 'person-head' },
      h('span', { class: 'person-rank', text: 'No. ' + card.rank }),
      h('h2', { class: 'person-name', text: card.title })),
    h('p', { class: 'card-body', text: card.body }));
  const extras = [buildStats(card.stats), buildEvidence(card), buildAction(card)].filter(Boolean);
  view.panel.append(...extras);
  replay(view.panel);
}

/* ---------- pages and navigation ---------- */

function buildPage(page, pageIndex) {
  const view = { page, cards: cardsFor(page.kind), active: 0, isRanked: page.kind === 'your_people' };
  view.el = h('div', { class: 'page', 'data-kind': page.kind });
  view.el.append(buildEditorial(page, pageIndex, pageIndex === PAGES.length - 1));
  if (view.cards.length) view.el.append(view.isRanked ? buildPeople(view) : buildDeck(view));
  return view;
}

function selectCard(view, index) {
  const total = view.cards.length;
  if (!total) return updateHero(view, null);
  view.active = (index + total) % total;
  if (view.isRanked) layoutPeople(view);
  else layoutDeck(view);
  updateHero(view, view.cards[view.active]);
}

function stepCard(delta) {
  const view = state.views[state.page];
  selectCard(view, view.active + delta);
}

function buildRail() {
  const list = document.getElementById('steps');
  list.append(h('span', { class: 'steps-track' }), h('span', { class: 'steps-fill', id: 'fill' }));
  PAGES.forEach((page, index) => {
    const step = h('button', { class: 'step', type: 'button', 'aria-label': 'Chapter ' + (index + 1) + ', ' + page.name, onclick: () => showPage(index) },
      h('span', { class: 'step-node', text: pad(index + 1) }),
      h('span', { class: 'step-name', text: page.name }));
    list.append(h('li', {}, step));
  });
}

function updateRail() {
  const steps = [...document.querySelectorAll('.step')];
  steps.forEach((step, index) => {
    step.classList.toggle('is-done', index < state.page);
    step.classList.toggle('is-current', index === state.page);
    step.setAttribute('aria-current', index === state.page ? 'step' : 'false');
  });
  const first = steps[0].getBoundingClientRect();
  const current = steps[state.page].getBoundingClientRect();
  document.getElementById('fill').style.height = (current.top - first.top) + 'px';
  document.getElementById('counter').replaceChildren(
    h('b', { text: pad(state.page + 1) }), ' / ' + pad(PAGES.length) + '  ·  ' + PAGES[state.page].name);
  document.getElementById('prev').disabled = state.page === 0;
  document.getElementById('next').disabled = state.page === PAGES.length - 1;
}

function showPage(index) {
  const target = Math.max(0, Math.min(PAGES.length - 1, index));
  document.getElementById('main').style.setProperty('--dir', target < state.page ? -1 : 1);
  state.page = target;
  state.views.forEach((view, viewIndex) => view.el.classList.toggle('is-active', viewIndex === target));
  selectCard(state.views[target], state.views[target].active);
  updateRail();
  history.replaceState(null, '', '#' + (target + 1));
  window.scrollTo(0, 0);
}

/* ---------- action sheet ---------- */

function buildDraft(card) {
  const draft = h('textarea', { class: 'draft', id: 'draft', 'aria-label': 'Message draft', spellcheck: 'false' });
  draft.value = card.action.draft;
  return [draft, h('p', { class: 'sheet-note', text: 'Nothing sends from here. Edit it, copy it, then paste it into your chat with ' + card.friend.name + '.' })];
}

function buildPoster(card) {
  return [h('div', { class: 'poster' },
    h('div', { class: 'poster-title', text: card.title }),
    h('p', { class: 'poster-body', text: card.body }),
    buildStats(card.stats),
    h('div', { class: 'poster-sign', text: 'Afterglow · Your DMs, in review' }))];
}

function summaryText(card) {
  const lines = card.stats.map(stat => stat.label + ': ' + stat.value);
  return [card.title, card.body, ...lines].join('\n');
}

function openSheet(card) {
  const isShare = card.action.draft === null;
  const copyButton = h('button', { class: 'cta', type: 'button' }, h('span', { html: ICONS.copy }), h('span', { text: isShare ? 'Copy summary' : 'Copy message' }));
  copyButton.addEventListener('click', () => copyFrom(card, copyButton.lastChild));
  const redo = isShare ? null : h('button', { class: 'ghost', type: 'button', disabled: '', title: 'Needs the live backend' },
    h('span', { html: ICONS.redo }), 'Regenerate', h('small', { text: 'Soon' }));
  document.getElementById('sheet').replaceChildren(
    h('button', { class: 'sheet-close', type: 'button', 'aria-label': 'Close', html: ICONS.close, onclick: closeSheet }),
    h('div', { class: 'sheet-head' }, avatar(card.friend.name),
      h('div', {}, h('div', { class: 'sheet-kicker', text: card.action.label }),
        h('div', { class: 'sheet-title', id: 'sheet-title', text: isShare ? 'Ready to share' : 'To ' + card.friend.name }))),
    ...(isShare ? buildPoster(card) : buildDraft(card)),
    h('div', { class: 'sheet-actions' }, copyButton, redo));
  state.sheetCard = card;
  const scrim = document.getElementById('scrim');
  scrim.classList.add('is-open');
  scrim.setAttribute('aria-hidden', 'false');
  copyButton.focus();
}

function closeSheet() {
  const scrim = document.getElementById('scrim');
  scrim.classList.remove('is-open');
  scrim.setAttribute('aria-hidden', 'true');
  state.sheetCard = null;
}

async function copyFrom(card, labelEl) {
  const draft = document.getElementById('draft');
  const text = card.action.draft === null ? summaryText(card) : draft.value;
  try {
    await navigator.clipboard.writeText(text);
    labelEl.textContent = 'Copied';
  } catch (error) {
    console.warn('Clipboard write failed', error);
    if (draft) draft.select();
    labelEl.textContent = 'Press Cmd+C to copy';
  }
}

/* ---------- input ---------- */

const keyActions = {
  ArrowRight: () => showPage(state.page + 1),
  ArrowLeft: () => showPage(state.page - 1),
  ArrowDown: () => stepCard(1),
  ArrowUp: () => stepCard(-1)
};

function onKey(event) {
  if (event.key === 'Escape') return closeSheet();
  if (state.sheetCard || event.target.closest('textarea')) return;
  const action = keyActions[event.key];
  if (!action) return;
  event.preventDefault();
  action();
}

function onStageClick(event) {
  if (event.target.closest('.card, .people, .pager, button, a, textarea')) return;
  const box = event.currentTarget.getBoundingClientRect();
  showPage(state.page + (event.clientX < box.left + box.width / 2 ? -1 : 1));
}

function applyHash() {
  const [pageToken, cardToken, flag] = location.hash.slice(1).split('-');
  const pageIndex = (parseInt(pageToken, 10) || 1) - 1;
  showPage(pageIndex);
  const view = state.views[state.page];
  selectCard(view, (parseInt(cardToken, 10) || 1) - 1);
  const card = view.cards[view.active];
  if (flag === 'sheet' && card && card.action) openSheet(card);
  if (flag === 'why') view.el.querySelectorAll('.is-front .why-chip').forEach(chip => chip.click());
}

function init() {
  buildRail();
  state.views = PAGES.map(buildPage);
  document.getElementById('pages').append(...state.views.map(view => view.el));
  document.getElementById('prev').innerHTML = ICONS.left;
  document.getElementById('next').innerHTML = ICONS.right;
  document.getElementById('prev').addEventListener('click', () => showPage(state.page - 1));
  document.getElementById('next').addEventListener('click', () => showPage(state.page + 1));
  document.getElementById('main').addEventListener('click', onStageClick);
  document.getElementById('scrim').addEventListener('click', event => { if (event.target.id === 'scrim') closeSheet(); });
  document.getElementById('generated').textContent = 'Generated ' + dayFormat.format(new Date(DATA.generatedAt)) + ' for ' + DATA.owner;
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', applyHash);
  window.addEventListener('resize', updateRail);
  applyHash();
}

init();
</script>
</body>
</html>
