<style>
:root{
  --ink:#17091F;--paper:#FFFBF2;--marker:#FFDC80;
  --bg:#405DE6;--fg:#fff;--pop:#FFDC80;--pop-ink:#17091F;--hero:#FFDC80;
  --display:'Anton','Haettenschweiler','Impact','Arial Narrow Bold',sans-serif;
  --text:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:500 15px/1.4 var(--text);color:var(--ink);background:color-mix(in srgb,var(--bg) 28%,#0A0310);display:grid;place-items:center;overflow:hidden;transition:background .5s}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.backdrop{position:fixed;inset:-25%;display:flex;flex-direction:column;justify-content:center;gap:6px;rotate:-10deg;pointer-events:none}
.backdrop span{font:400 120px/1 var(--display);white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--bg) 60%,#fff);opacity:.22;animation:slide 70s linear infinite alternate}
.backdrop span:nth-child(even){animation-direction:alternate-reverse}
.hint{position:fixed;bottom:7px;left:0;right:0;text-align:center;font:700 11px var(--text);letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.6}

.stage{position:relative;height:min(100dvh - 64px,880px);aspect-ratio:9/16;max-width:430px;overflow:hidden;border:4px solid var(--ink);border-radius:30px;box-shadow:12px 12px 0 var(--pop);background:var(--bg);transition:box-shadow .5s;user-select:none;-webkit-user-select:none}

.bars{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:5px;z-index:6}
.bar{flex:1;height:9px;border-radius:999px;border:2px solid var(--ink);background:rgba(255,255,255,.4);padding:0;cursor:pointer}
.bar.done{background:var(--fg)}
.bar.now{background:var(--pop)}
.brand{position:absolute;top:32px;left:20px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:6;color:var(--fg);font:800 11px var(--text);letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.brand b{background:var(--ink);color:#fff;padding:4px 9px;border-radius:999px;font:400 13px var(--display);letter-spacing:.08em}

.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);color:var(--fg);padding:60px 0 62px}
.page.on{display:flex}
.shapes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sh{position:absolute;aspect-ratio:1}
.sh svg{display:block;width:100%;height:100%;overflow:visible}
.circle{border-radius:50%;background:var(--c)}
.ring{border-radius:50%;border:44px solid var(--c)}
.pill{aspect-ratio:auto;border-radius:999px;background:var(--c)}
.arc{background:var(--c);border-radius:100% 0 0 0}
.wave{aspect-ratio:auto}
.spin{animation:spin 50s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.wave svg{animation:wave 7s linear infinite}

.head{position:relative;z-index:1;padding:4px 22px 0}
.kicker{display:inline-block;background:var(--ink);color:#fff;font:800 12px/1 var(--text);letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;border-radius:999px;rotate:-2deg}
.hero{font:400 var(--hero-size,108px)/.95 var(--display);text-transform:uppercase;white-space:nowrap;color:var(--hero);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);margin-top:6px}
.hero.swap{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.hero-tag{display:inline-block;position:relative;margin-top:-10px;background:var(--pop);color:var(--pop-ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:800 12.5px/1.1 var(--text);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;rotate:-3deg}
.line{font:700 16px/1.25 var(--text);margin-top:9px;max-width:27ch}
.page.on .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.page.on .hero{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:150ms}

.body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;padding-top:12px}
.carousel{flex:1;min-height:0;display:flex;align-items:flex-start;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 22px;padding:0 22px 10px;scrollbar-width:none;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.carousel.dragging{scroll-snap-type:none;cursor:grabbing}
.card{flex:0 0 calc(100% - 30px);max-height:calc(100% - 4px);scroll-snap-align:start;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--edge,var(--ink))}
.carousel.solo .card{flex-basis:100%}
.band{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--pop);color:var(--pop-ink);border-bottom:3px solid var(--ink)}
.who{font:800 15px/1.1 var(--text)}
.idx{margin-left:auto;font:400 17px var(--display);letter-spacing:.06em}
.scroll-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.more-tag{position:absolute;right:10px;bottom:8px;display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;font:800 10px var(--text);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;pointer-events:none;animation:nudge 1.1s ease-in-out infinite alternate}
.more-tag[hidden]{display:none}
.more-tag svg{width:11px;height:11px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 18px;cursor:auto}
.title{font:400 29px/1.04 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.text{margin-top:10px;font-size:15px;line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px 7px;background:#fff}
.stat:first-child{background:var(--pop);color:var(--pop-ink)}
.stat:last-child:nth-child(odd){grid-column:1/-1}
.stat b{display:block;font:400 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.stat span{display:block;margin-top:2px;font:800 10.5px/1.2 var(--text);letter-spacing:.1em;text-transform:uppercase}

.why{position:relative;margin:26px 2px 4px;background:var(--ink);color:#fff;border-radius:16px;padding:20px 14px 14px;rotate:-1deg;box-shadow:5px 5px 0 var(--pop)}
.why-tag{position:absolute;top:-15px;left:12px;background:var(--marker);color:var(--ink);border:2.5px solid var(--ink);border-radius:8px;font:400 15px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;rotate:-4deg}
.why p{font-size:14.5px;font-weight:700;line-height:1.4}
.why small{display:block;margin-top:6px;font:700 11.5px var(--text);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.why a{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--marker);font-weight:800;text-decoration:underline;text-underline-offset:3px}

.thread{display:flex;flex-direction:column;gap:6px;margin-top:18px;padding-top:12px;border-top:3px dashed var(--ink)}
.thread-h{font:800 11px var(--text);letter-spacing:.14em;text-transform:uppercase}
.sep{align-self:center;margin:8px 0 3px;background:var(--ink);color:#fff;font:700 10.5px var(--text);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:90%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg-col{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.msg.me .msg-col{align-items:flex-end}
.chip{font:800 10px var(--text);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.chip.other{background:var(--pop);color:var(--pop-ink)}
.bubble{border:2.5px solid var(--ink);border-radius:20px;padding:8px 12px;font-size:14.5px;line-height:1.38;overflow-wrap:anywhere}
.msg.them .bubble{background:#EFE6F8;border-bottom-left-radius:6px}
.msg.me .bubble{background:#405DE6;color:#fff;border-bottom-right-radius:6px}
.msg.key{margin:3px 0 5px}
.msg.key .bubble{font-weight:800;font-size:15.5px;box-shadow:4px 4px 0 var(--ink)}
.msg.key.them .bubble{background:#fff}
.msg.key .txt{background:linear-gradient(transparent 10%,var(--marker) 10% 90%,transparent 90%);color:var(--ink);padding:0 .25em;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:.35em .1em .3em .15em}

.av{--s:38px;flex:none;width:var(--s);height:var(--s);border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#405DE6,#833AB4,#E1306C,#FD1D1D,#F77737,#FFDC80,#F77737,#E1306C,#405DE6)}
.av i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;font:800 calc(var(--s)*.32)/1 var(--text);font-style:normal;letter-spacing:.02em}
.av.mini{--s:26px;padding:2px}
.av.mini i{border-width:1.5px}
.av.ghost{visibility:hidden}

.foot{padding:11px 14px 14px;border-top:3px solid var(--ink);background:var(--paper)}
.cta,.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--ink);border-radius:999px;background:var(--pop);color:var(--pop-ink);box-shadow:4px 4px 0 var(--ink);font:400 19px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:13px 16px;cursor:pointer;transition:translate .08s,box-shadow .08s}
.cta{width:100%}
.cta:active,.btn:active{translate:4px 4px;box-shadow:0 0 0 var(--ink)}
.btn[disabled]{background:transparent;color:var(--ink);border-style:dashed;box-shadow:none;cursor:not-allowed;opacity:.62}
.btn em{font:800 9.5px var(--text);font-style:normal;letter-spacing:.1em;background:var(--ink);color:#fff;border-radius:999px;padding:3px 7px}

.dots{display:flex;justify-content:center;align-items:center;gap:9px;padding:4px 0 8px}
.dot{position:relative;width:13px;height:13px;border-radius:999px;border:2.5px solid var(--ink);background:var(--paper);padding:0;cursor:pointer;transition:width .25s}
.dot::before{content:"";position:absolute;inset:-10px -5px}
.dot.on{width:32px;background:var(--pop)}

.people{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:0 28px 12px 22px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
.person.top{background:var(--pop);color:var(--pop-ink)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:40px 42px 1fr 18px;gap:10px;align-items:center;width:100%;padding:7px 12px 9px;cursor:pointer;border-radius:17px}
.num{font:400 56px/1 var(--display);text-align:center}
.pname{font:400 21px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.track{height:13px;margin-top:6px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.fill{height:100%;width:calc(var(--score)*100%);background:var(--bar);border-right:2.5px solid var(--ink);transform-origin:left}
.page.on .fill{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 250ms)}
.meta{margin-top:4px;font:800 10.5px var(--text);letter-spacing:.1em;text-transform:uppercase}
.chev{transition:rotate .2s}
.person.open .chev{rotate:180deg}
.more{display:none;padding:2px 14px 14px}
.person.open .more{display:block}
.more .text{margin-top:0}
.person.top .stat{background:#fff;color:var(--ink)}

.nav{position:absolute;left:0;right:0;bottom:0;height:62px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;background:var(--ink);color:#fff;font:700 10.5px var(--text);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.nav button{display:flex;align-items:center;gap:6px;border:2.5px solid #fff;border-radius:999px;background:var(--pop);color:var(--pop-ink);font:400 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.nav button[disabled]{background:transparent;color:#fff;opacity:.4;cursor:default}

.wipe{position:absolute;inset:0;z-index:15;pointer-events:none;display:grid;place-items:center;background:var(--wipe);color:var(--wipe-ink);font:400 260px/1 var(--display);translate:102% 0;border-inline:10px solid var(--ink)}
.wipe.run{animation:wipe .64s cubic-bezier(.7,0,.3,1) both}

.scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(23,9,31,.62);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--paper);color:var(--ink);border-top:4px solid var(--ink);border-radius:28px 28px 0 0;padding:16px 18px 22px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text}
.scrim.on .sheet{transform:none}
.sheet:focus{outline:none}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h div{font:400 22px/1.05 var(--display);text-transform:uppercase}
.sheet-h small{display:block;font:800 10.5px var(--text);letter-spacing:.12em;margin-bottom:3px}
.close{margin-left:auto;flex:none;display:grid;place-items:center;width:40px;height:40px;border:3px solid var(--ink);border-radius:50%;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.sheet textarea{display:block;width:100%;min-height:170px;resize:none;border:3px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);padding:13px 14px;font:500 16px/1.45 var(--text);box-shadow:inset 4px 4px 0 rgba(23,9,31,.08)}
.note{margin-top:8px;font-size:13px;font-weight:700}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1;font-size:17px;padding:13px 10px}
.poster{position:relative;overflow:hidden;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:0 16px 16px;box-shadow:5px 5px 0 var(--pop)}
.poster::before{content:"";display:block;height:16px;margin:0 -16px 16px;background:linear-gradient(90deg,#405DE6 0 10%,#5851DB 0 20%,#833AB4 0 30%,#C13584 0 40%,#E1306C 0 50%,#FD1D1D 0 60%,#F56040 0 70%,#F77737 0 80%,#FCAF45 0 90%,#FFDC80 0)}
.poster h3{font:400 46px/1 var(--display);text-transform:uppercase;color:var(--marker)}
.poster .text{font-size:14.5px}
.poster .stat{background:transparent;border-color:#fff;color:#fff}
.poster .stat:first-child{background:var(--marker);color:var(--ink);border-color:var(--marker)}
.poster footer{margin-top:14px;font:800 10.5px var(--text);letter-spacing:.14em;text-transform:uppercase;opacity:.8}

@keyframes spin{to{rotate:360deg}}
@keyframes drift{to{translate:14px -18px}}
@keyframes wave{to{translate:-60px 0}}
@keyframes slide{to{translate:-400px 0}}
@keyframes rise{from{opacity:0;translate:0 22px}}
@keyframes pop{from{opacity:0;scale:.6;rotate:-6deg}}
@keyframes nudge{to{translate:0 4px}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes wipe{0%{translate:calc(var(--dir)*102%) 0}42%,58%{translate:0 0}100%{translate:calc(var(--dir)*-102%) 0}}

@media (max-width:520px){
  .stage{width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
  .backdrop,.hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function add(parent, ...children) {
  children.filter(Boolean).forEach(child => parent.appendChild(child));
  return parent;
}

function firstName(card) {
  return card.friend.name.split(' ')[0];
}

function initials(name) {
  return name.split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
}

function avatar(name, isMini) {
  const ring = el('span', isMini ? 'av mini' : 'av');
  ring.setAttribute('aria-hidden', 'true');
  return add(ring, el('i', '', initials(name)));
}

function cardsFor(kind) {
  const own = DATA.cards.filter(card => card.kind === kind);
  if (kind === 'your_people') return own.sort((a, b) => a.rank - b.rank);
  return own.sort((a, b) => b.score - a.score).slice(0, maxCards);
}

function applyTheme(node, page) {
  node.style.setProperty('--bg', page.bg);
  node.style.setProperty('--fg', page.fg);
  node.style.setProperty('--pop', page.pop);
  node.style.setProperty('--pop-ink', page.popInk);
  node.style.setProperty('--hero', page.heroColor);
  node.style.setProperty('--edge', page.edge || ink);
}

function burstPoints(spikes) {
  const points = [];
  for (let k = 0; k < spikes * 2; k++) {
    const radius = k % 2 ? 74 : 100;
    const angle = Math.PI * k / spikes;
    points.push((100 + radius * Math.cos(angle)).toFixed(1) + ',' + (100 + radius * Math.sin(angle)).toFixed(1));
  }
  return points.join(' ');
}

function rainbowStops() {
  const band = 20;
  const start = 40;
  const stops = gradient.map((color, k) => `${color} ${start + k * band}px ${start + (k + 1) * band}px`);
  return `radial-gradient(circle at 100% 0,transparent ${start}px,${stops.join(',')},transparent ${start + gradient.length * band}px)`;
}

function shapeNode(shape) {
  const node = el('div', `sh ${shape.t} ${shape.a || ''}`);
  node.style.cssText = shape.s;
  node.style.setProperty('--c', shape.c);
  if (shape.t === 'burst') node.innerHTML = `<svg viewBox="0 0 200 200"><polygon points="${burstPoints(14)}" fill="${shape.c}"/></svg>`;
  if (shape.t === 'rainbow') node.style.background = rainbowStops();
  if (shape.t === 'wave') node.innerHTML = `<svg style="width:600px;height:40px" viewBox="0 0 600 40"><path d="M0 20${' q15 -26 30 0 t30 0'.repeat(10)}" fill="none" stroke="${shape.c}" stroke-width="11" stroke-linecap="round"/></svg>`;
  return node;
}

function heroFor(page, cards, index) {
  const card = cards[index];
  if (!card) return { big: '0', small: page.name };
  if (page.hero === 'count') return { big: String(cards.length), small: page.tag[cards.length === 1 ? 0 : 1] };
  const stat = card.stats[0];
  if (page.hero === 'stat' && stat) return { big: stat.value, small: `${stat.label} / ${firstName(card)}` };
  return { big: firstName(card), small: page.tag || card.title };
}

function setHero(section, hero) {
  const big = section.querySelector('.hero');
  if (big.textContent === hero.big && section.querySelector('.hero-tag').textContent === hero.small) return;
  const width = (stage.clientWidth || 430) - 56;
  big.style.setProperty('--hero-size', Math.min(108, Math.floor(width / (hero.big.length * 0.47))) + 'px');
  big.textContent = hero.big;
  section.querySelector('.hero-tag').textContent = hero.small;
  big.classList.remove('swap');
  void big.offsetWidth;
  big.classList.add('swap');
}

function renderStats(stats) {
  if (!stats.length) return null;
  const grid = el('div', 'stats');
  stats.forEach(stat => add(grid, add(el('div', 'stat'), el('b', '', stat.value), el('span', '', stat.label))));
  return grid;
}

function renderContext(context) {
  if (!context) return null;
  const box = el('aside', 'why');
  const link = el('a');
  link.href = context.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.innerHTML = icons.link;
  link.prepend(`Read it on ${context.source} `);
  const when = day.format(new Date(context.date + 'T00:00:00Z'));
  return add(box, el('span', 'why-tag', 'Why now'), el('p', '', context.text), el('small', '', `${context.source} / ${when}`), link);
}

function needsSeparator(previous, message) {
  if (!previous) return true;
  const before = new Date(previous.timestamp);
  const after = new Date(message.timestamp);
  const isNewDay = before.toISOString().slice(0, 10) !== after.toISOString().slice(0, 10);
  return isNewDay || after - before >= separatorGapMs;
}

function renderMessage(message, card, hasMixedThreads, isRunStart) {
  const row = el('div', `msg ${message.isFromOwner ? 'me' : 'them'}${message.isKey ? ' key' : ''}`);
  const column = el('div', 'msg-col');
  if (hasMixedThreads) {
    const isOther = message.threadName !== card.friend.name;
    add(column, el('span', isOther ? 'chip other' : 'chip', `From your chat with ${message.threadName}`));
  }
  const bubble = add(el('div', 'bubble'), el('span', 'txt', message.text));
  add(column, bubble);
  if (!message.isFromOwner) {
    const mini = avatar(message.sender, true);
    if (!isRunStart) mini.classList.add('ghost');
    add(row, mini);
  }
  return add(row, column);
}

function renderEvidence(card) {
  if (!card.evidence.length) return null;
  const thread = add(el('div', 'thread'), el('div', 'thread-h', 'The receipts'));
  const hasMixedThreads = card.evidence.some(message => message.threadName !== card.friend.name);
  card.evidence.forEach((message, k) => {
    const previous = card.evidence[k - 1];
    const hasSeparator = needsSeparator(previous, message);
    if (hasSeparator) add(thread, el('div', 'sep', stamp.format(new Date(message.timestamp))));
    const isRunStart = hasSeparator || previous.sender !== message.sender;
    add(thread, renderMessage(message, card, hasMixedThreads, isRunStart));
  });
  return thread;
}

function renderAction(card) {
  if (!card.action) return null;
  const button = el('button', 'cta', card.action.label);
  button.type = 'button';
  button.insertAdjacentHTML('beforeend', icons.next);
  button.addEventListener('click', () => openSheet(card));
  return add(el('div', 'foot'), button);
}

function buildCard(card, index, total) {
  const node = el('article', 'card');
  node.dataset.hold = '';
  const band = add(el('div', 'band'), avatar(card.friend.name), el('span', 'who', card.friend.name));
  if (total > 1) add(band, el('span', 'idx', `${index + 1}/${total}`));
  const scroll = add(el('div', 'scroll'), el('h2', 'title', card.title), el('p', 'text', card.body),
    renderStats(card.stats), renderContext(card.context), renderEvidence(card));
  return add(node, band, scrollWrap(scroll), renderAction(card));
}

function scrollWrap(scroll) {
  const tag = el('span', 'more-tag', 'Scroll');
  tag.insertAdjacentHTML('beforeend', icons.chevron);
  const update = () => { tag.hidden = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 12; };
  scroll.addEventListener('scroll', update, { passive: true });
  new ResizeObserver(update).observe(scroll);
  return add(el('div', 'scroll-wrap'), scroll, tag);
}

function enableDrag(track, settle) {
  let startX = 0, startLeft = 0, isDown = false, hasMoved = false;
  track.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.target.closest('button,a')) return;
    isDown = true; hasMoved = false; startX = event.clientX; startLeft = track.scrollLeft;
  });
  window.addEventListener('pointermove', event => {
    if (!isDown) return;
    const delta = event.clientX - startX;
    if (Math.abs(delta) < 6 && !hasMoved) return;
    hasMoved = true;
    track.classList.add('dragging');
    track.scrollLeft = startLeft - delta;
  });
  window.addEventListener('pointerup', () => {
    if (!isDown) return;
    isDown = false;
    if (hasMoved) settle();
  });
  track.addEventListener('click', event => {
    if (!hasMoved) return;
    hasMoved = false;
    event.stopPropagation();
    event.preventDefault();
  }, true);
}

function buildCarousel(cards, onActive) {
  const track = el('div', cards.length === 1 ? 'carousel solo' : 'carousel');
  const dots = el('div', 'dots');
  dots.dataset.hold = '';
  let active = 0;
  const step = () => cards.length > 1 ? track.children[1].offsetLeft - track.children[0].offsetLeft : 1;
  const nearest = () => Math.max(0, Math.min(cards.length - 1, Math.round(track.scrollLeft / step())));
  const scrollToCard = index => {
    track.scrollTo({ left: index * step(), behavior: reducedMotion.matches ? 'auto' : 'smooth' });
    setTimeout(() => track.classList.remove('dragging'), 450);
  };
  const mark = index => {
    active = index;
    [...dots.children].forEach((dot, k) => dot.classList.toggle('on', k === index));
    onActive(index);
  };
  cards.forEach((card, k) => {
    const node = buildCard(card, k, cards.length);
    node.addEventListener('click', () => { if (k !== active) scrollToCard(k); });
    add(track, node);
    const dot = el('button', k === 0 ? 'dot on' : 'dot');
    dot.type = 'button';
    dot.setAttribute('aria-label', `Show card ${k + 1} of ${cards.length}`);
    dot.addEventListener('click', () => scrollToCard(k));
    add(dots, dot);
  });
  track.addEventListener('scroll', () => { if (nearest() !== active) mark(nearest()); }, { passive: true });
  enableDrag(track, () => scrollToCard(nearest()));
  return cards.length > 1 ? [track, dots] : [track];
}

function buildPerson(card, index) {
  const person = el('div', index === 0 ? 'person top open' : 'person');
  person.dataset.hold = '';
  const row = el('button', 'row');
  row.type = 'button';
  row.setAttribute('aria-expanded', String(index === 0));
  const fill = el('div', 'fill');
  fill.style.setProperty('--score', card.score);
  fill.style.setProperty('--bar', barColors[index % barColors.length]);
  fill.style.setProperty('--i', index);
  const lead = card.stats[0];
  const info = add(el('div'), el('div', 'pname', card.title), add(el('div', 'track'), fill),
    lead ? el('div', 'meta', `${lead.value} ${lead.label}`) : null);
  add(row, el('span', 'num', String(card.rank)), avatar(card.friend.name), info);
  row.insertAdjacentHTML('beforeend', icons.chevron);
  row.addEventListener('click', () => togglePerson(person));
  return add(person, row, add(el('div', 'more'), el('p', 'text', card.body), renderStats(card.stats)));
}

function togglePerson(person) {
  const willOpen = !person.classList.contains('open');
  person.parentNode.querySelectorAll('.person.open').forEach(other => {
    other.classList.remove('open');
    other.querySelector('.row').setAttribute('aria-expanded', 'false');
  });
  person.classList.toggle('open', willOpen);
  person.querySelector('.row').setAttribute('aria-expanded', String(willOpen));
  if (willOpen) person.scrollIntoView({ block: 'nearest', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
}

function buildPage(page, index) {
  const section = el('section', 'page');
  section.setAttribute('aria-label', page.name);
  applyTheme(section, page);
  const cards = cardsFor(page.kind);
  const shapes = el('div', 'shapes');
  shapeSets[index].forEach(shape => add(shapes, shapeNode(shape)));
  const head = add(el('header', 'head'), el('span', 'kicker rise', `${String(index + 1).padStart(2, '0')} / ${page.name}`),
    el('div', 'hero'), el('span', 'hero-tag rise'), el('p', 'line rise', page.line));
  [...head.children].forEach((child, k) => child.style.setProperty('--i', k));
  const body = el('div', 'body rise');
  body.style.setProperty('--i', 4);
  if (page.kind === 'your_people') {
    add(body, add(el('div', 'people'), ...cards.map(buildPerson)));
  } else {
    add(body, ...buildCarousel(cards, active => setHero(section, heroFor(page, cards, active))));
  }
  add(section, shapes, head, body);
  setHero(section, heroFor(page, cards, 0));
  return section;
}

function shareText(card) {
  const lines = card.stats.map(stat => `${stat.label}: ${stat.value}`);
  return [card.title, card.body, ...lines].join('\n');
}

async function copyText(text, button, field) {
  const label = button.querySelector('span');
  try {
    await navigator.clipboard.writeText(text);
    label.textContent = 'Copied';
  } catch (error) {
    console.warn('Clipboard unavailable', error);
    if (field) field.select();
    label.textContent = 'Press Cmd+C';
  }
  setTimeout(() => { label.textContent = button.dataset.label; }, 1600);
}

function actionButton(labelText, icon, isDisabled) {
  const button = el('button', 'btn');
  button.type = 'button';
  button.dataset.label = labelText;
  button.innerHTML = icon;
  add(button, el('span', '', labelText));
  if (!isDisabled) return button;
  button.disabled = true;
  return add(button, el('em', '', 'Soon'));
}

function draftBody(card) {
  const field = el('textarea');
  field.value = card.action.draft;
  field.setAttribute('aria-label', `Message to ${card.friend.name}`);
  const copy = actionButton('Copy', icons.copy, false);
  copy.addEventListener('click', () => copyText(field.value, copy, field));
  const note = el('p', 'note', 'Make it sound like you, copy it, then paste it into the chat.');
  return [field, note, add(el('div', 'btns'), copy, actionButton('Regenerate', icons.redo, true))];
}

function posterBody(card) {
  const poster = add(el('div', 'poster'), el('h3', '', card.title), el('p', 'text', card.body),
    renderStats(card.stats), el('footer', '', 'Your DMs, in review'));
  const copy = actionButton('Copy summary', icons.copy, false);
  copy.addEventListener('click', () => copyText(shareText(card), copy, null));
  return [poster, add(el('div', 'btns'), copy)];
}

function openSheet(card) {
  sheet.textContent = '';
  const hasDraft = card.action.draft != null;
  const heading = add(el('div'), el('small', '', card.action.label), document.createTextNode(hasDraft ? `To ${card.friend.name}` : 'Ready to share'));
  const close = el('button', 'close');
  close.type = 'button';
  close.setAttribute('aria-label', 'Close');
  close.innerHTML = icons.close;
  close.addEventListener('click', closeSheet);
  add(sheet, add(el('div', 'sheet-h'), avatar(card.friend.name), heading, close), ...(hasDraft ? draftBody(card) : posterBody(card)));
  scrim.classList.add('on');
  sheet.focus({ preventScroll: true });
}

function closeSheet() {
  scrim.classList.remove('on');
}

function show(index) {
  current = index;
  const page = pages[index];
  sections.forEach((section, k) => section.classList.toggle('on', k === index));
  applyTheme(document.body, page);
  document.querySelectorAll('.bar').forEach((bar, k) => {
    bar.classList.toggle('done', k < index);
    bar.classList.toggle('now', k === index);
  });
  document.getElementById('counter').textContent = `${String(index + 1).padStart(2, '0')}/${String(pages.length).padStart(2, '0')}`;
  const isLast = index === pages.length - 1;
  backButton.disabled = index === 0;
  nextButton.innerHTML = `<span>${isLast ? 'Again' : 'Next'}</span>${icons.next}`;
  history.replaceState(null, '', '#' + (index + 1));
  closeSheet();
}

function go(target) {
  const next = Math.max(0, Math.min(pages.length - 1, target));
  if (next === current || isWiping) return;
  if (reducedMotion.matches) return show(next);
  isWiping = true;
  wipe.style.setProperty('--dir', next > current ? 1 : -1);
  wipe.style.setProperty('--wipe', pages[next].pop);
  wipe.style.setProperty('--wipe-ink', pages[next].popInk);
  wipe.textContent = String(next + 1).padStart(2, '0');
  wipe.classList.add('run');
  setTimeout(() => show(next), 300);
  setTimeout(() => { wipe.classList.remove('run'); isWiping = false; }, 660);
}

function pageFromHash() {
  const wanted = parseInt(location.hash.slice(1), 10);
  return wanted >= 1 && wanted <= pages.length ? wanted - 1 : 0;
}

function onKey(event) {
  if (scrim.classList.contains('on')) {
    if (event.key === 'Escape') closeSheet();
    return;
  }
  if (event.key === 'ArrowRight') go(current + 1);
  if (event.key === 'ArrowLeft') go(current - 1);
}

function onStageClick(event) {
  if (event.target.closest('[data-hold]')) return;
  const box = stage.getBoundingClientRect();
  go(current + (event.clientX - box.left > box.width / 2 ? 1 : -1));
}

function init() {
  const host = document.getElementById('pages');
  sections = pages.map(buildPage);
  add(host, ...sections);
  pages.forEach((page, k) => {
    const bar = el('button', 'bar');
    bar.type = 'button';
    bar.setAttribute('aria-label', `Go to page ${k + 1}: ${page.name}`);
    bar.addEventListener('click', () => go(k));
    add(document.getElementById('bars'), bar);
  });
  for (let k = 0; k < 9; k++) add(document.getElementById('backdrop'), el('span', '', 'YOUR DMS, IN REVIEW / '.repeat(8)));
  backButton.innerHTML = `${icons.back}<span>Back</span>`;
  backButton.addEventListener('click', () => go(current - 1));
  nextButton.addEventListener('click', () => go(current === pages.length - 1 ? 0 : current + 1));
  scrim.addEventListener('click', event => { if (event.target === scrim) closeSheet(); });
  stage.addEventListener('click', onStageClick);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => { if (pageFromHash() !== current) show(pageFromHash()); });
  show(pageFromHash());
}

init();
</script>
</body>
</html>
